<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">肉色：氧合與氧化要分開</title><desc id="desc">氧合保持 Fe²⁺，氧化形成 Fe³⁺；CO₂ 與 N₂ 各有不同包裝角色，肉色不替代安全量測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="500" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">肉色：氧合與氧化要分開</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">氣體角色與量測端點，不能互相代替</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><rect x="28" y="108" width="180" height="95" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="138" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">肌紅蛋白</text><text x="44" y="167" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">形式鐵價 Fe²⁺</text><rect x="285" y="108" width="180" height="95" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="301" y="138" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">氧合肌紅蛋白</text><text x="301" y="167" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">形式鐵價仍為 Fe²⁺</text><line x1="215" y1="155" x2="276" y2="155" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><text x="246" y="127" font-size="16" fill="#14665d" text-anchor="middle" font-weight="400">+ O₂</text><rect x="28" y="274" width="230" height="93" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="304" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">高鐵肌紅蛋白</text><text x="44" y="333" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">形式鐵價 Fe³⁺</text><line x1="117" y1="210" x2="117" y2="264" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><text x="136" y="244" font-size="18" fill="#b4692e" text-anchor="start" font-weight="400">氧化</text><rect x="502" y="108" width="190" height="112" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="518" y="138" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">CO₂</text><text x="518" y="167" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">有抑菌用途</text><text x="518" y="192" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">不等於殺菌保證</text><rect x="502" y="240" width="190" height="112" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="518" y="270" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">N₂</text><text x="518" y="299" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">平衡氣體</text><text x="518" y="324" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">不是氧配位體</text><rect x="285" y="274" width="180" height="93" rx="14" fill="#ffffff" stroke="#14665d" stroke-width="2"/><text x="301" y="304" font-size="16" fill="#1c2732" text-anchor="start" font-weight="400">a* 是色度座標</text><text x="301" y="331" font-size="16" fill="#1c2732" text-anchor="start" font-weight="400">氧化、菌數另測</text><text x="28" y="433" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">完整配方、日期與條件對齊後，才比較肉色。</text><text x="28" y="456" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">單一肉色結果不能推得安全期限或最佳包材。</text><text x="692" y="484" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>