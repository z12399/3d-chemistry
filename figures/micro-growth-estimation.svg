<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">先選時間窗，再估表觀生長斜率</title><desc id="desc">同一研究時間序列分為選窗內均值與未參與擬合的點，前者估表觀斜率，後者檢查延伸偏差。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="500" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">先選時間窗，再估表觀生長斜率</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">本課將原表 log 按 log₁₀ 解讀</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><rect x="28" y="111" width="664" height="68" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="360" y="153" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="700">同一研究的刊載時間序列</text><path d="M 360 187 L 360 207 L 181 207 L 181 231" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><path d="M 360 207 L 540 207 L 540 231" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="243" width="305" height="106" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="273" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">所選連續時間窗</text><text x="44" y="302" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">刊載均值做等權 OLS</text><text x="44" y="327" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">y＝a＋bt</text><rect x="387" y="243" width="305" height="106" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="403" y="273" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">同序列未用點</text><text x="403" y="302" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">檢查直線延伸的偏差</text><text x="403" y="327" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">e＝y−ŷ</text><rect x="28" y="372" width="305" height="70" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="402" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">μ_app＝b ln(10)</text><rect x="387" y="372" width="305" height="70" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="403" y="402" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">b＞0 才報倍增時間</text><text x="28" y="473" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">表觀斜率不是 μmax；同研究未用點不是獨立外部確效。</text><text x="692" y="484" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>