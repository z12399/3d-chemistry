<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">孢子結構與 Gram 染色，證據不同</title><desc id="desc">孢子以多層結構示意其耐受相關因素，另一側呈現分離株 Gram 染色僅支持該批細胞的表型。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="520" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">孢子結構與 Gram 染色，證據不同</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">先辨認原食品、分離株與細胞狀態</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><text x="52" y="115" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">內生孢子結構示意</text><ellipse cx="157" cy="227" rx="104" ry="89" fill="#f6f7f8" stroke="#14665d" stroke-width="2"/><ellipse cx="157" cy="227" rx="83" ry="67" fill="#e7f1ee" stroke="#6f8fb5" stroke-width="2"/><ellipse cx="157" cy="227" rx="57" ry="43" fill="#ffffff" stroke="#b8902a" stroke-width="2"/><text x="157" y="233" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">核心</text><text x="36" y="344" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">皮層、外被、核心低含水</text><text x="36" y="371" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">Ca-DPA 與 SASP</text><text x="36" y="398" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">按濕熱／乾熱／化學壓力判讀</text><line x1="315" y1="110" x2="315" y2="420" stroke="#dfe4e8" stroke-width="2"/><rect x="355" y="118" width="337" height="70" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="371" y="148" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">食品分離出的營養細胞</text><line x1="523" y1="197" x2="523" y2="227" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="355" y="237" width="337" height="77" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="371" y="267" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">Gram 染色表型</text><text x="371" y="296" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">常見：陽性紫／陰性粉紅</text><line x1="523" y1="323" x2="523" y2="352" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="355" y="365" width="337" height="65" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="523" y="405" font-size="17" fill="#1c2732" text-anchor="middle" font-weight="400">只描述這批細胞的染色觀察</text><text x="28" y="453" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">染色顏色不能倒推原食品孢子狀態、物種或事故原因。</text><text x="28" y="476" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">Bacillus 要分營養細胞與孢子；Salmonella 不形成內生孢子。</text><text x="692" y="504" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>