<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="title">開環與水解：先看哪條連接改變</title>
<desc id="desc">上排同一葡萄糖由環狀變為開鏈，碳骨架保持相連；下排雙糖加水後分成兩糖。</desc>
<defs>
<marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#14665d"/></marker>
<marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53606d"/></marker>
<marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b4692e"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6f8fb5"/></marker>
<marker id="arr-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b8902a"/></marker>
</defs>
<rect width="720" height="480" fill="#ffffff"/>
<text x="30" y="38" font-size="22" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="30" dy="0">開環與水解：先看哪條連接改變</tspan></text>
<text x="30" y="69" font-size="17" fill="#53606d" text-anchor="start"><tspan x="30" dy="0">圖形只表示連接層次，不表示立體構型</tspan></text>
<text x="30" y="112" font-size="20" fill="#14665d" text-anchor="start" font-weight="600"><tspan x="30" dy="0">半縮醛開環</tspan></text>
<path d="M78 157L110 139L142 157L142 189L110 207L78 189Z" fill="#e7f1ee" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="110" y="180" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="110" dy="0">Glc</tspan></text>
<path d="M170 173L270 173" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/>
<rect x="295" y="132" width="190" height="82" rx="12" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="390.0" y="166.5" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="390.0" dy="0">開鏈 Glc</tspan><tspan x="390.0" dy="27">恢復 C=O</tspan></text>
<text x="520" y="165" font-size="20" fill="#1c2732" text-anchor="start"><tspan x="520" dy="0">同一個分子</tspan><tspan x="520" dy="27">不淨耗水</tspan></text>
<path d="M30 251L690 251" fill="none" stroke="#dfe4e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="30" y="290" font-size="20" fill="#b4692e" text-anchor="start" font-weight="600"><tspan x="30" dy="0">糖苷水解</tspan></text>
<path d="M63 326L88 308L113 326L113 358L88 376L63 358Z" fill="#e7f1ee" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="349" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="88" dy="0">A</tspan></text>
<path d="M165 326L190 308L215 326L215 358L190 376L165 358Z" fill="#e7f1ee" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="190" y="349" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="190" dy="0">B</tspan></text>
<path d="M115 342L163 342" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="139" y="391" font-size="17" fill="#1c2732" text-anchor="middle"><tspan x="139" dy="0">橋鍵</tspan></text>
<path d="M250 342L365 342" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-orange)"/>
<text x="307" y="316" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="307" dy="0">＋H₂O</tspan></text>
<path d="M425 326L450 308L475 326L475 358L450 376L425 358Z" fill="#e7f1ee" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="450" y="349" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="450" dy="0">A</tspan></text>
<text x="519" y="350" font-size="24" fill="#1c2732" text-anchor="middle"><tspan x="519" dy="0">＋</tspan></text>
<path d="M560 326L585 308L610 326L610 358L585 376L560 358Z" fill="#e7f1ee" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="585" y="349" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="585" dy="0">B</tspan></text>
<text x="30" y="438" font-size="17" fill="#53606d" text-anchor="start"><tspan x="30" dy="0">水解橋鍵得到兩糖；開環不是把糖拆成兩個分子。</tspan></text>
<text x="688" y="464" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
