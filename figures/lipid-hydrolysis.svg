<text x="542.0" y="356.0" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="542.0" dy="0">1 個游離</tspan><tspan x="542.0" dy="28">脂肪酸</tspan></text>
<text x="360" y="436" font-size="21" fill="#14665d" text-anchor="middle"><tspan x="360" dy="0">中性淨式：一酯位耗一水、釋一酸</tspan></text>
<text x="360" y="467" font-size="18" fill="#53606d" text-anchor="middle"><tspan x="360" dy="0">短鏈游離脂肪酸可帶來異味；此處未模擬氣味</tspan></text>
