<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">熱需求是總量，熱阻限制傳入速率</title>
<desc id="figure-desc">熱由溫差驅動並經對流及食品內部導熱熱阻；平板變厚會增大導熱熱阻，總熱需求不能單獨決定升溫時間。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="540" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">熱需求是總量，熱阻限制傳入速率</tspan></text>
<text x="32" y="103" font-size="20" fill="#1c2732" text-anchor="start"><tspan x="32" dy="0">較熱流體</tspan></text>
<text x="688" y="103" font-size="20" fill="#1c2732" text-anchor="end"><tspan x="688" dy="0">較冷內部</tspan></text>
<path d="M 36 183 L 139 183" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<rect x="152" y="129" width="183" height="108" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="243.5" y="176.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="243.5" dy="0">表面對流熱阻</tspan><tspan x="243.5" dy="28">1／(h·A)</tspan></text>
<path d="M 348 183 L 390 183" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<rect x="403" y="129" width="183" height="108" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="494.5" y="176.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="494.5" dy="0">內部導熱熱阻</tspan><tspan x="494.5" dy="28">L／(k·A)</tspan></text>
<path d="M 599 183 L 682 183" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="360" y="278" font-size="23" fill="#b4692e" text-anchor="middle"><tspan x="360" dy="0">熱流＝溫差 ÷ 熱阻</tspan></text>
<rect x="68" y="327" width="29" height="89" rx="0" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<rect x="211" y="327" width="80" height="89" rx="0" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="82" y="446" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="82" dy="0">較薄</tspan></text>
<text x="251" y="446" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="251" dy="0">較厚</tspan></text>
<path d="M 109 372 L 198 372" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="154" y="350" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="154" dy="0">L 增加</tspan></text>
<text x="356" y="350" font-size="21" fill="#1c2732" text-anchor="start"><tspan x="356" dy="0">導熱熱阻增加</tspan><tspan x="356" dy="34">內部熱阻大時，</tspan><tspan x="356" dy="34">提高外部流速效果有限</tspan></text>
<text x="32" y="509" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">平板式限穩態；中心升溫需非穩態模型。</tspan></text>
<text x="688" y="522" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
