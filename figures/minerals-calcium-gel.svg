<text x="32" y="425" font-size="22" fill="#1c2732" text-anchor="start"><tspan x="32" dy="0">羧酸根的數量與分布影響連接</tspan></text>
<text x="32" y="461" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">連接區涉及多個鏈段與水，非定量配位式。</tspan><tspan x="32" dy="25">鈣不是越多越好；條件需依配方調整。</tspan></text>
