<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">製程管理有三層工作</title>
<desc id="figure-desc">製程管理分三層：確效（建立科學證據證明製程能達到目標）、監測（確認每次操作都在控制範圍內）與查核（檢視紀錄與系統是否照設計運作）。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="530" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">製程管理有三層工作</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">科學依據、每次操作與系統查核要接在一起</tspan></text>
<rect x="32" y="125" width="180" height="156" rx="14" fill="#f6f7f8" stroke="#14665d" stroke-width="2"/>
<text x="122.0" y="182.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="122.0" dy="0">確效</tspan><tspan x="122.0" dy="28">建立能達目標的</tspan><tspan x="122.0" dy="28">科學證據</tspan></text>
<path d="M 122 291 L 122 330" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="270" y="125" width="180" height="156" rx="14" fill="#f6f7f8" stroke="#6f8fb5" stroke-width="2"/>
<text x="360.0" y="182.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">監測</tspan><tspan x="360.0" dy="28">追蹤每次操作</tspan><tspan x="360.0" dy="28">是否受控</tspan></text>
<path d="M 360 291 L 360 330" fill="none" stroke="#6f8fb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="508" y="125" width="180" height="156" rx="14" fill="#f6f7f8" stroke="#b4692e" stroke-width="2"/>
<text x="598.0" y="182.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="598.0" dy="0">查核</tspan><tspan x="598.0" dy="28">檢視紀錄與系統</tspan><tspan x="598.0" dy="28">是否依設計運作</tspan></text>
<path d="M 598 291 L 598 330" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<path d="M 122 340 L 122 365 L 598 365 L 598 340" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 360 365 L 360 396" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="183" y="408" width="354" height="59" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="444.5" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">指定產品與條件的製程證據</tspan></text>
<text x="32" y="505" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">模型或幾份未檢出，僅提供部分製程證據。</tspan></text>
<text x="688" y="512" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
