<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">PCR 的分析對象是目標核酸</title><desc id="desc">細胞失去增殖能力後仍可能保留可被 PCR 檢出的 DNA；PMA 的膜相關訊號也不能代替可培養性證據。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="500" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">PCR 的分析對象是目標核酸</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">檢出 DNA，不等於量到可培養性、感染性或毒素</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><rect x="44" y="115" width="236" height="120" rx="30" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/><path d="M 79 159 C 99 129 125 189 145 159 S 192 129 214 159 S 243 189 254 159" fill="none" stroke="#14665d" stroke-width="2"/><text x="162" y="214" font-size="17" fill="#1c2732" text-anchor="middle" font-weight="400">細胞中的目標 DNA</text><rect x="44" y="278" width="236" height="106" rx="18" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="162" y="311" font-size="17" fill="#1c2732" text-anchor="middle" font-weight="400">失去增殖能力後</text><text x="162" y="340" font-size="17" fill="#1c2732" text-anchor="middle" font-weight="400">DNA 仍可能留存</text><path d="M 290 175 L 341 175 L 341 246 L 391 246" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><path d="M 290 330 L 341 330 L 341 246" fill="none" stroke="#14665d" stroke-width="2"/><rect x="405" y="196" width="287" height="104" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="421" y="226" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">PCR 目標訊號</text><text x="421" y="255" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">回答此方法是否檢出</text><text x="421" y="280" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">指定目標核酸</text><rect x="405" y="328" width="287" height="73" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="421" y="358" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">PMA 可降低部分受損細胞訊號</text><text x="421" y="383" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">膜完整仍不保證可培養</text><text x="28" y="433" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">PMA 效果需在菌種、基質與處理條件下驗證。</text><text x="28" y="456" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">PCR 陰性也要查取樣、萃取與抑制。</text><text x="692" y="484" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>