<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">殺菁的目的，要配上各自證據</title><desc id="desc">殺菁有酵素控制、組織氣體與裝填等目的；POD、Vc 及後續微生物控制使用不同證據。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="500" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">殺菁的目的，要配上各自證據</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">短時間熱水或蒸氣前處理</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><rect x="32" y="111" width="196" height="227" rx="20" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/><text x="130" y="146" font-size="20" fill="#14665d" text-anchor="middle" font-weight="700">殺菁</text><path d="M 72 242 Q 58 220 72 202 Q 86 183 72 166" fill="none" stroke="#b4692e" stroke-width="2"/><path d="M 116 242 Q 102 220 116 202 Q 130 183 116 166" fill="none" stroke="#b4692e" stroke-width="2"/><path d="M 160 242 Q 146 220 160 202 Q 174 183 160 166" fill="none" stroke="#b4692e" stroke-width="2"/><text x="130" y="280" font-size="17" fill="#1c2732" text-anchor="middle" font-weight="400">熱水／蒸氣</text><text x="130" y="308" font-size="17" fill="#1c2732" text-anchor="middle" font-weight="400">作用於食品組織</text><path d="M 236 224 L 269 224 L 269 143 L 302 143" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><path d="M 236 224 L 269 224 L 269 229 L 302 229" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><path d="M 236 224 L 269 224 L 269 315 L 302 315" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="314" y="105" width="378" height="73" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="330" y="135" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">控制品質相關酵素</text><text x="330" y="164" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">POD 活性：Pt／P0</text><rect x="314" y="191" width="378" height="73" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="330" y="221" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">排除氣體、組織收縮</text><text x="330" y="250" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">仍需核對裝填與後續流程</text><rect x="314" y="277" width="378" height="73" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="330" y="307" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">品質成分</text><text x="330" y="336" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">Vc 濃度不等於營養總量保留率</text><rect x="32" y="378" width="660" height="65" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="362" y="417" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">後續微生物控制與商業滅菌：仍需各自製程證據</text><text x="28" y="475" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">POD 指標不能替其他品質端點或後段殺菌作保證。</text><text x="692" y="484" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>