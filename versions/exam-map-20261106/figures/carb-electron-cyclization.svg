<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 435" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">葡萄糖成環：加成，保留原子</title>
<desc id="figure-desc">由開鏈、成環中間體到半縮醛，標示 O5 與 C1 新鍵和羰基鍵階改變；去質子後恢復中性，沒有淨脫水。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="435" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">葡萄糖成環：加成，保留原子</tspan></text>
<rect x="32" y="120" width="190" height="162" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="127.0" y="180.0" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="127.0" dy="0">酸活化開鏈式</tspan><tspan x="127.0" dy="28">C1=O1</tspan><tspan x="127.0" dy="28">C5 的羥基氧 O5</tspan></text>
<rect x="265" y="120" width="190" height="162" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="166.0" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">成環中間體</tspan><tspan x="360.0" dy="28">新增 C1–O5</tspan><tspan x="360.0" dy="28">C1=O1 → C1–O1</tspan><tspan x="360.0" dy="28">O5 暫帶正電</tspan></text>
<rect x="500" y="120" width="188" height="162" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="594.0" y="180.0" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="594.0" dy="0">環狀半縮醛</tspan><tspan x="594.0" dy="28">去質子後回中性</tspan><tspan x="594.0" dy="28">酸再生</tspan></text>
<path d="M 226 201 L 257 201" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 459 201 L 492 201" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="95" y="320" width="530" height="60" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="357.0" font-size="24" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">C₆H₁₂O₆ ⇌ C₆H₁₂O₆</tspan></text>
<text x="32" y="410" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">分子內加成沒有淨脫水。</tspan></text>
<text x="688" y="417" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
