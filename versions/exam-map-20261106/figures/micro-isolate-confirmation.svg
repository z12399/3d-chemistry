<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">把身分確認，接回同一分離株</title><desc id="desc">食品樣份分為核酸訊號與培養候選兩條證據，身分確認必須沿追溯連到同一挑選分離株。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="500" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">把身分確認，接回同一分離株</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">食品 PCR 與培養菌落可能來自不同來源</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><rect x="28" y="116" width="150" height="85" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="146" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">食品樣份</text><text x="44" y="175" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">保留追溯</text><path d="M 187 156 L 222 156 L 222 126 L 260 126" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><path d="M 222 156 L 222 248 L 260 248" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="272" y="96" width="203" height="77" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="288" y="126" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">食品 PCR</text><text x="288" y="155" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">目標核酸訊號</text><rect x="272" y="209" width="203" height="77" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="288" y="239" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">培養候選菌落</text><text x="288" y="268" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">外觀只建立候選</text><line x1="486" y1="247" x2="530" y2="247" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="543" y="209" width="149" height="77" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="559" y="239" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">挑選分離株</text><text x="559" y="268" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">保留同一株</text><line x1="617" y1="295" x2="617" y2="329" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="394" y="340" width="298" height="76" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="410" y="370" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">有效身分確認</text><text x="410" y="399" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">連到同一分離株</text><text x="28" y="351" font-size="18" fill="#b4692e" text-anchor="start" font-weight="400">不能把食品 PCR 陽性</text><text x="28" y="380" font-size="18" fill="#b4692e" text-anchor="start" font-weight="400">貼到所有培養菌落身上</text><text x="28" y="461" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">確認可培養目標，仍不等於量到全部目標、毒素或感染性。</text><text x="692" y="484" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>