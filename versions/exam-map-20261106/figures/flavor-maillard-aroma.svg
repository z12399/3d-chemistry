<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="flavor-maillard-aroma-title flavor-maillard-aroma-desc">
<title id="flavor-maillard-aroma-title">烤褐與香氣：同源反應，不同分支</title>
<desc id="flavor-maillard-aroma-desc">羰基片段與含氮物形成中間體後分支，色素與部分吡嗪分開；食品內量、氣相與感知再分別量測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker></defs>
<rect width="720" height="100%" fill="#ffffff"/>
<g font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" fill="#1c2732" font-size="18">
<text x="32" y="36" font-size="20" fill="#1c2732" text-anchor="start" font-weight="600">烤褐與香氣：同源反應，不同分支</text>
<line x1="32" y1="54" x2="688" y2="54" stroke="#dfe4e8" stroke-width="2"/>
<rect x="32" y="83" width="186" height="80" rx="12" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="125.0" y="116.0" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">羰基片段</text>
<text x="125.0" y="142.0" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">＋ 含氮反應物</text>
<line x1="220" y1="123" x2="266" y2="123" stroke="#14665d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="270" y="83" width="180" height="80" rx="12" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="129.0" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">反應中間體</text>
<path d="M450 105 H485 V91 H524" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M450 140 H485 V201 H524" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="530" y="67" width="158" height="65" rx="12" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="609.0" y="105.5" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">部分吡嗪類</text>
<rect x="530" y="170" width="158" height="65" rx="12" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="609.0" y="195.5" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">色素及</text>
<text x="609.0" y="221.5" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">其他香氣</text>
<text x="37" y="208" font-size="18" fill="#1c2732" text-anchor="start" font-weight="400">配方、pH、含水狀態、熱歷程</text>
<text x="37" y="234" font-size="18" fill="#1c2732" text-anchor="start" font-weight="400">會改變產物分布</text>
<text x="32" y="274" font-size="20" fill="#1c2732" text-anchor="start" font-weight="600">香氣還要分開回答三個問題</text>
<rect x="32" y="328" width="176" height="77" rx="12" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="120.0" y="359.5" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">食品內含量</text>
<text x="120.0" y="385.5" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">食品中量到多少？</text>
<rect x="272" y="328" width="176" height="77" rx="12" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="359.5" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">氣相濃度</text>
<text x="360.0" y="385.5" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">氣相中有多濃？</text>
<rect x="512" y="328" width="176" height="77" rx="12" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="600.0" y="359.5" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">嗅聞感知</text>
<text x="600.0" y="385.5" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">聞起來多強？</text>
<line x1="210" y1="366" x2="263" y2="366" stroke="#14665d" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="450" y1="366" x2="503" y2="366" stroke="#14665d" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="244" y="309" font-size="16" fill="#53606d" text-anchor="middle" font-weight="400">基質分配</text>
<text x="484" y="309" font-size="16" fill="#53606d" text-anchor="middle" font-weight="400">閾值／混合</text>
<rect x="32" y="424" width="656" height="43" rx="12" fill="#e7f1ee" stroke="#e7f1ee" stroke-width="2"/>
<text x="46" y="450" font-size="16" fill="#14665d" text-anchor="start" font-weight="400">色澤不能替代香氣定量；各分支未列全，箭頭不表示固定比例。</text>
<text x="680" y="497" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text>
</g>
</svg>