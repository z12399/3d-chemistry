<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">冷凍負荷拆成三段</title>
<desc id="figure-desc">冷凍負荷分三段：降溫到凍結點的顯熱 → 水結冰的潛熱（依實際結冰量）→ 凍結後繼續降溫的顯熱；溶質使結冰分布在一段溫度範圍內。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="500" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">冷凍負荷拆成三段</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">相變項只計實際新形成的冰</tspan></text>
<rect x="32" y="125" width="180" height="205" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="122" y="158" font-size="21" fill="#b4692e" text-anchor="middle"><tspan x="122" dy="0">降溫前段</tspan></text>
<rect x="270" y="125" width="180" height="205" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="360" y="158" font-size="21" fill="#14665d" text-anchor="middle"><tspan x="360" dy="0">水形成冰</tspan></text>
<rect x="508" y="125" width="180" height="205" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="598" y="158" font-size="21" fill="#6f8fb5" text-anchor="middle"><tspan x="598" dy="0">凍結後降溫</tspan></text>
<path d="M 220 225 L 260 225" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<path d="M 458 225 L 498 225" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<path d="M 72 190 L 172 247" fill="none" stroke="#b4692e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="122" y="293" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="122" dy="0">顯熱</tspan><tspan x="122" dy="25">m × 比熱 × 溫差</tspan></text>
<rect x="307" y="196" width="23" height="23" rx="2" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<rect x="364" y="196" width="23" height="23" rx="2" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<rect x="336" y="242" width="23" height="23" rx="2" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="360" y="293" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">潛熱</tspan><tspan x="360" dy="25">實際結冰量 × 潛熱</tspan></text>
<path d="M 548 190 L 648 247" fill="none" stroke="#6f8fb5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="598" y="293" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="598" dy="0">顯熱</tspan><tspan x="598" dy="25">m × 比熱 × 溫差</tspan></text>
<rect x="100" y="368" width="520" height="56" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="403.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">總冷量 ≈ 前段顯熱 ＋ 潛熱 ＋ 後段顯熱</tspan></text>
<text x="32" y="458" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">結冰分布於一段溫度；三段式是集中相變近似。</tspan></text>
<text x="688" y="482" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
