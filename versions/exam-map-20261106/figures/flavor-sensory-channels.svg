<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">風味由多個通道整合</title>
<desc id="figure-desc">味蕾的味覺、鼻前及鼻後嗅覺與灼熱涼感的化學刺激感分別進入風味知覺，入口位置不能取代通道判讀。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="500" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">風味由多個通道整合</tspan></text>
<rect x="32" y="110" width="250" height="78" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="157.0" y="142.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="157.0" dy="0">甜、酸、鹹、苦、鮮</tspan><tspan x="157.0" dy="28">口腔味蕾受器</tspan></text>
<path d="M 294 149 L 332 149" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="345" y="110" width="173" height="78" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="431.5" y="156.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="431.5" dy="0">味覺</tspan></text>
<path d="M 530 149 L 557 149" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="220" width="250" height="78" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="157.0" y="252.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="157.0" dy="0">香氣</tspan><tspan x="157.0" dy="28">鼻前／鼻後途徑</tspan></text>
<path d="M 294 259 L 332 259" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="345" y="220" width="173" height="78" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="431.5" y="266.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="431.5" dy="0">嗅覺</tspan></text>
<path d="M 530 259 L 557 259" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="330" width="250" height="78" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="157.0" y="362.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="157.0" dy="0">辣椒素灼熱</tspan><tspan x="157.0" dy="28">薄荷醇涼感</tspan></text>
<path d="M 294 369 L 332 369" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="345" y="330" width="173" height="78" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="431.5" y="376.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="431.5" dy="0">化學刺激感</tspan></text>
<path d="M 530 369 L 557 369" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 557 149 L 557 369" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 557 259 L 584 259" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="597" y="203" width="91" height="112" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="642.5" y="252.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="642.5" dy="0">風味</tspan><tspan x="642.5" dy="28">知覺</tspan></text>
<text x="32" y="466" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">同一食品可走多通道；不表示強度相加。</tspan></text>
<text x="688" y="482" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
