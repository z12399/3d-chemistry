<svg xmlns="http://www.w3.org/2000/svg" width="640" height="645" viewBox="0 0 640 645" role="img" aria-labelledby="title desc">
<title id="title">木聚糖水解與木糖還原為木糖醇</title><desc id="desc">木糖Fischer投影的C2、C3、C4羥基依序為右、左、右。還原將頂端CHO換成CH2OH，保留其餘連接。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18745f"/></marker></defs>
<rect width="640" height="645" fill="white"/><g font-family="Arial,Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="28" y="38" font-size="24" fill="#1c3335" text-anchor="start" font-weight="700">木聚糖水解，再將木糖的醛基還原</text><rect x="28" y="62" width="584" height="70" rx="14" fill="#f1f6f2" stroke="#d9e4dc"/><text x="48" y="91" font-size="20" fill="#1c3335" text-anchor="start" font-weight="400">木聚糖主鏈：β-(1→4) 相連的 D-木糖基</text><text x="48" y="119" font-size="18" fill="#1c3335" text-anchor="start" font-weight="400">糖苷鍵水解 + H₂O → 木糖；原料支鏈另行處理</text><text x="165" y="173" font-size="21" fill="#1c3335" text-anchor="middle" font-weight="600">D-木糖（開鏈）</text><text x="475" y="173" font-size="21" fill="#1c3335" text-anchor="middle" font-weight="600">木糖醇</text><text x="165" y="218" font-size="23" fill="#1c3335" text-anchor="middle" font-weight="600">CHO</text><text x="165" y="472" font-size="23" fill="#1c3335" text-anchor="middle" font-weight="600">CH₂OH</text><line x1="165" y1="230" x2="165" y2="443" stroke="#243c3c" stroke-width="2"/><line x1="120" y1="280" x2="210" y2="280" stroke="#243c3c" stroke-width="2"/><text x="106" y="287" font-size="21" fill="#1c3335" text-anchor="end" font-weight="400">H</text><text x="224" y="287" font-size="21" fill="#1c3335" text-anchor="start" font-weight="400">OH</text><line x1="120" y1="340" x2="210" y2="340" stroke="#243c3c" stroke-width="2"/><text x="106" y="347" font-size="21" fill="#1c3335" text-anchor="end" font-weight="400">OH</text><text x="224" y="347" font-size="21" fill="#1c3335" text-anchor="start" font-weight="400">H</text><line x1="120" y1="400" x2="210" y2="400" stroke="#243c3c" stroke-width="2"/><text x="106" y="407" font-size="21" fill="#1c3335" text-anchor="end" font-weight="400">H</text><text x="224" y="407" font-size="21" fill="#1c3335" text-anchor="start" font-weight="400">OH</text><text x="475" y="218" font-size="23" fill="#1c3335" text-anchor="middle" font-weight="600">CH₂OH</text><text x="475" y="472" font-size="23" fill="#1c3335" text-anchor="middle" font-weight="600">CH₂OH</text><line x1="475" y1="230" x2="475" y2="443" stroke="#243c3c" stroke-width="2"/><line x1="430" y1="280" x2="520" y2="280" stroke="#243c3c" stroke-width="2"/><text x="416" y="287" font-size="21" fill="#1c3335" text-anchor="end" font-weight="400">H</text><text x="534" y="287" font-size="21" fill="#1c3335" text-anchor="start" font-weight="400">OH</text><line x1="430" y1="340" x2="520" y2="340" stroke="#243c3c" stroke-width="2"/><text x="416" y="347" font-size="21" fill="#1c3335" text-anchor="end" font-weight="400">OH</text><text x="534" y="347" font-size="21" fill="#1c3335" text-anchor="start" font-weight="400">H</text><line x1="430" y1="400" x2="520" y2="400" stroke="#243c3c" stroke-width="2"/><text x="416" y="407" font-size="21" fill="#1c3335" text-anchor="end" font-weight="400">H</text><text x="534" y="407" font-size="21" fill="#1c3335" text-anchor="start" font-weight="400">OH</text><path d="M286 330 L352 330" fill="none" stroke="#18745f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="320" y="305" font-size="18" fill="#1c3335" text-anchor="middle" font-weight="400">還原</text><text x="320" y="360" font-size="18" fill="#1c3335" text-anchor="middle" font-weight="400">+ H₂</text><rect x="28" y="502" width="584" height="88" rx="14" fill="#f1f6f2" stroke="#d9e4dc"/><text x="48" y="531" font-size="21" fill="#1c3335" text-anchor="start" font-weight="600">C1：醛基 → 一級醇；五碳骨架保留</text><text x="48" y="559" font-size="20" fill="#1c3335" text-anchor="start" font-weight="400">C₅H₁₀O₅ + H₂ → C₅H₁₂O₅</text><text x="28" y="619" font-size="17" fill="#566966" text-anchor="start" font-weight="400">Fischer 投影：橫向鍵朝向觀察者，縱向鍵朝後。</text></g></svg>
