<svg xmlns="http://www.w3.org/2000/svg" width="640" height="747" viewBox="0 0 640 747" role="img" aria-labelledby="title desc">
<title id="title">脯胺酸到N-亞硝基脯胺酸的淨結構轉換</title><desc id="desc">原脯胺酸環內的N-H經N-亞硝化成N-N=O；五元環與羧基保留，NPRO本身已是N-nitroso化合物。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18745f"/></marker></defs>
<rect width="640" height="747" fill="white"/><g font-family="Arial,Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="28" y="38" font-size="24" fill="#1c3335" text-anchor="start" font-weight="700">以脯胺酸為例：胺氮的 N-亞硝化</text><text x="28" y="68" font-size="17" fill="#566966" text-anchor="start" font-weight="400">NaNO₂ → NO₂⁻；在適合酸性條件下形成亞硝化物種。</text><text x="175" y="111" font-size="21" fill="#1c3335" text-anchor="middle" font-weight="600">脯胺酸（proline）</text><line x1="189.52" y1="211.9" x2="226.48000000000002" y2="237.1" stroke="#243c3c" stroke-width="2"/><line x1="235.72" y1="263.94" x2="222.28" y2="307.06" stroke="#243c3c" stroke-width="2"/><line x1="198.52" y1="324.0" x2="151.48000000000002" y2="324.0" stroke="#243c3c" stroke-width="2"/><line x1="127.72" y1="307.06" x2="114.28" y2="263.94" stroke="#243c3c" stroke-width="2"/><line x1="123.52" y1="237.1" x2="160.48000000000002" y2="211.9" stroke="#243c3c" stroke-width="2"/><text x="175" y="209" font-size="20" fill="#1c3335" text-anchor="middle" font-weight="400">N</text><text x="241" y="254" font-size="20" fill="#1c3335" text-anchor="middle" font-weight="400">CH</text><text x="217" y="331" font-size="20" fill="#1c3335" text-anchor="middle" font-weight="400">CH₂</text><text x="133" y="331" font-size="20" fill="#1c3335" text-anchor="middle" font-weight="400">CH₂</text><text x="109" y="254" font-size="20" fill="#1c3335" text-anchor="middle" font-weight="400">CH₂</text><line x1="259" y1="247" x2="295" y2="247" stroke="#243c3c" stroke-width="2"/><text x="301" y="254" font-size="20" fill="#1c3335" text-anchor="start" font-weight="400">COOH</text><line x1="175" y1="188" x2="175" y2="154" stroke="#243c3c" stroke-width="2"/><text x="175" y="144" font-size="20" fill="#1c3335" text-anchor="middle" font-weight="400">H</text><path d="M175 355 L175 403" fill="none" stroke="#18745f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="212" y="378" font-size="18" fill="#18745f" text-anchor="start" font-weight="400">消耗 HNO₂；生成 H₂O（淨式）</text><text x="175" y="451" font-size="21" fill="#1c3335" text-anchor="middle" font-weight="600">N-nitrosoproline（NPRO）</text><line x1="189.52" y1="562.9" x2="226.48000000000002" y2="588.1" stroke="#243c3c" stroke-width="2"/><line x1="235.72" y1="614.94" x2="222.28" y2="658.06" stroke="#243c3c" stroke-width="2"/><line x1="198.52" y1="675.0" x2="151.48000000000002" y2="675.0" stroke="#243c3c" stroke-width="2"/><line x1="127.72" y1="658.06" x2="114.28" y2="614.94" stroke="#243c3c" stroke-width="2"/><line x1="123.52" y1="588.1" x2="160.48000000000002" y2="562.9" stroke="#243c3c" stroke-width="2"/><text x="175" y="560" font-size="20" fill="#1c3335" text-anchor="middle" font-weight="400">N</text><text x="241" y="605" font-size="20" fill="#1c3335" text-anchor="middle" font-weight="400">CH</text><text x="217" y="682" font-size="20" fill="#1c3335" text-anchor="middle" font-weight="400">CH₂</text><text x="133" y="682" font-size="20" fill="#1c3335" text-anchor="middle" font-weight="400">CH₂</text><text x="109" y="605" font-size="20" fill="#1c3335" text-anchor="middle" font-weight="400">CH₂</text><line x1="259" y1="598" x2="295" y2="598" stroke="#243c3c" stroke-width="2"/><text x="301" y="605" font-size="20" fill="#1c3335" text-anchor="start" font-weight="400">COOH</text><line x1="175" y1="539" x2="175" y2="502" stroke="#243c3c" stroke-width="2"/><text x="175" y="490" font-size="20" fill="#ae573c" text-anchor="middle" font-weight="400">N</text><line x1="189" y1="483" x2="223" y2="483" stroke="#243c3c" stroke-width="2"/><line x1="189" y1="492" x2="223" y2="492" stroke="#243c3c" stroke-width="2"/><text x="238" y="494" font-size="20" fill="#ae573c" text-anchor="middle" font-weight="400">O</text><rect x="375" y="165" width="237" height="171" rx="14" fill="#f1f6f2" stroke="#d9e4dc"/><text x="394" y="197" font-size="20" fill="#1c3335" text-anchor="start" font-weight="600">觀察成鍵位置</text><text x="394" y="232" font-size="17" fill="#1c3335" text-anchor="start" font-weight="400">原來的胺氮失去 H，</text><text x="394" y="263" font-size="17" fill="#1c3335" text-anchor="start" font-weight="400">與另一個 N 成鍵：</text><text x="394" y="305" font-size="26" fill="#ae573c" text-anchor="start" font-weight="600">R₂N−N=O</text><rect x="375" y="490" width="237" height="159" rx="14" fill="#f1f6f2" stroke="#d9e4dc"/><text x="394" y="524" font-size="20" fill="#1c3335" text-anchor="start" font-weight="600">作答界線</text><text x="394" y="557" font-size="16" fill="#1c3335" text-anchor="start" font-weight="400">NPRO 已是 N-nitroso</text><text x="394" y="582" font-size="16" fill="#1c3335" text-anchor="start" font-weight="400">化合物；後續脫羧可</text><text x="394" y="607" font-size="16" fill="#1c3335" text-anchor="start" font-weight="400">另述，並非本圖必需。</text><text x="28" y="721" font-size="16" fill="#566966" text-anchor="start" font-weight="400">連接式省略立體資訊；只表達一條淨轉換，不表示逐步反應機構。</text></g></svg>
