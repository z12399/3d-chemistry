<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">金屬形態會影響促氧化作用</title>
<desc id="figure-desc">可變氧化態金屬可能促進脂質氫過氧化物分解生成自由基，效果取決於氧化態、配位及位置。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="460" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">金屬形態會影響促氧化作用</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">Fe²⁺／Fe³⁺ 是課文的可能反應步驟示例</tspan></text>
<rect x="32" y="113" width="656" height="92" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="166.0" font-size="26" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">Fe²⁺ + LOOH → Fe³⁺ + LO• + OH⁻</tspan></text>
<rect x="32" y="285" width="128" height="82" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="96.0" y="319.0" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="96.0" dy="0">金屬</tspan><tspan x="96.0" dy="28">氧化態與配位</tspan></text>
<rect x="216" y="285" width="128" height="82" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="280.0" y="319.0" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="280.0" dy="0">過氧化物</tspan><tspan x="280.0" dy="28">分解</tspan></text>
<rect x="400" y="285" width="128" height="82" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="464.0" y="319.0" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="464.0" dy="0">自由基</tspan><tspan x="464.0" dy="28">增加</tspan></text>
<rect x="584" y="285" width="104" height="82" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="636.0" y="319.0" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="636.0" dy="0">氧化</tspan><tspan x="636.0" dy="28">加速</tspan></text>
<path d="M 168 326 L 208 326" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<path d="M 352 326 L 392 326" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<path d="M 536 326 L 576 326" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="32" y="417" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">不能只看總元素含量；反應能力依化學形態而異。</tspan></text>
<text x="688" y="442" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
