<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">肌紅蛋白：氧合與氧化分開看</title>
<desc id="figure-desc">上列表示結合氧但仍以二價鐵記帳；下列表示鐵由二價氧化成三價。兩列不當作同一反應。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="520" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">肌紅蛋白：氧合與氧化分開看</tspan></text>
<text x="32" y="92" font-size="22" fill="#14665d" text-anchor="start" font-weight="600"><tspan x="32" dy="0">氧合：與氧結合</tspan></text>
<rect x="32" y="118" width="225" height="105" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="144.5" y="163.5" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="144.5" dy="0">去氧肌紅蛋白</tspan><tspan x="144.5" dy="28">Mb–Fe²⁺</tspan></text>
<rect x="463" y="118" width="225" height="105" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="575.5" y="163.5" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="575.5" dy="0">氧合肌紅蛋白</tspan><tspan x="575.5" dy="28">Mb–Fe²⁺·O₂</tspan></text>
<path d="M 276 166 L 444 166" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 444 184 L 276 184" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="360" y="141" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">結合 O₂</tspan></text>
<text x="360" y="215" font-size="18" fill="#53606d" text-anchor="middle"><tspan x="360" dy="0">鐵仍寫為 Fe²⁺</tspan></text>
<text x="32" y="274" font-size="22" fill="#b4692e" text-anchor="start" font-weight="600"><tspan x="32" dy="0">氧化：鐵失去電子</tspan></text>
<rect x="32" y="300" width="225" height="105" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="144.5" y="345.5" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="144.5" dy="0">肌紅蛋白</tspan><tspan x="144.5" dy="28">Mb–Fe²⁺</tspan></text>
<rect x="463" y="300" width="225" height="105" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="575.5" y="345.5" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="575.5" dy="0">高鐵肌紅蛋白</tspan><tspan x="575.5" dy="28">Mb–Fe³⁺（常呈褐色）</tspan></text>
<path d="M 276 352 L 444 352" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="360" y="327" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">失去 e⁻</tspan></text>
<text x="32" y="452" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">氧化式省略電子受體，並非完整淨反應。</tspan><tspan x="32" dy="25">色素狀態不能單獨判定食品安全。</tspan></text>
<text x="688" y="502" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
