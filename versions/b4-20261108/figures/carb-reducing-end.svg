<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">還原端看的是游離異頭中心</title>
<desc id="figure-desc">乳糖保留一個可開環的游離異頭中心；蔗糖兩個異頭中心都參與糖苷鍵，不能直接進行此互變。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="480" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">還原端看的是游離異頭中心</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">圓表示糖單位；小點表示異頭中心</tspan></text>
<rect x="38" y="105" width="297" height="275" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="186" y="142" font-size="23" fill="#1c2732" text-anchor="middle"><tspan x="186" dy="0">乳糖</tspan></text>
<rect x="385" y="105" width="297" height="275" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="533" y="142" font-size="23" fill="#1c2732" text-anchor="middle"><tspan x="533" dy="0">蔗糖</tspan></text>
<circle cx="111" cy="207" r="38" fill="#ffffff" stroke="#14665d" stroke-width="2"/>
<circle cx="260" cy="207" r="38" fill="#ffffff" stroke="#14665d" stroke-width="2"/>
<circle cx="456" cy="207" r="38" fill="#ffffff" stroke="#14665d" stroke-width="2"/>
<circle cx="605" cy="207" r="38" fill="#ffffff" stroke="#14665d" stroke-width="2"/>
<path d="M 149 207 L 222 207" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="149" cy="207" r="7" fill="#14665d" stroke="#14665d" stroke-width="2"/>
<circle cx="298" cy="207" r="7" fill="#b4692e" stroke="#b4692e" stroke-width="2"/>
<path d="M 494 207 L 567 207" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="494" cy="207" r="7" fill="#14665d" stroke="#14665d" stroke-width="2"/>
<circle cx="567" cy="207" r="7" fill="#14665d" stroke="#14665d" stroke-width="2"/>
<text x="185" y="180" font-size="17" fill="#53606d" text-anchor="middle"><tspan x="185" dy="0">糖苷鍵</tspan></text>
<text x="530" y="180" font-size="17" fill="#53606d" text-anchor="middle"><tspan x="530" dy="0">糖苷鍵</tspan></text>
<path d="M 298 220 L 298 249" fill="none" stroke="#b4692e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="187" y="276" font-size="19" fill="#b4692e" text-anchor="middle"><tspan x="187" dy="0">保留游離異頭中心</tspan></text>
<path d="M 187 288 L 187 315" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="187" y="349" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="187" dy="0">可開環成游離羰基</tspan></text>
<text x="533" y="276" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="533" dy="0">兩個異頭中心都成鍵</tspan></text>
<text x="533" y="326" font-size="19" fill="#53606d" text-anchor="middle"><tspan x="533" dy="0">不保有可開環的</tspan></text>
<text x="533" y="353" font-size="19" fill="#53606d" text-anchor="middle"><tspan x="533" dy="0">游離異頭中心</tspan></text>
<text x="360" y="428" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="360" dy="0">雙糖也可以是還原糖；重點是成鍵位置</tspan></text>
<text x="688" y="462" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
