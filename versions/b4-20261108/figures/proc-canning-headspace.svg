<title id="figure-title">冷卻凝結，罐內氣相減少</title>
<desc id="figure-desc">罐頭排氣後密封，頂隙中的水蒸氣在冷卻時凝結，使罐內壓力低於外界而形成真空；罐內總壓＝殘留非凝結氣體分壓＋該溫度的飽和水蒸氣壓。</desc>
