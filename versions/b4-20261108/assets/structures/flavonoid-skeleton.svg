<text x="505.2" y="210.7" font-size="12" fill="#11665a" text-anchor="middle" font-weight="normal">2′</text>
<text x="566.4" y="175.4" font-size="12" fill="#11665a" text-anchor="middle" font-weight="normal">3′</text>
<text x="566.4" y="104.6" font-size="12" fill="#11665a" text-anchor="middle" font-weight="normal">4′</text>
<text x="505.2" y="69.3" font-size="12" fill="#11665a" text-anchor="middle" font-weight="normal">5′</text>
<text x="443.9" y="104.6" font-size="12" fill="#11665a" text-anchor="middle" font-weight="normal">6′</text>
<text x="380.0" y="346.0" font-size="13" fill="#11665a" text-anchor="middle" font-weight="normal">八類的判據都在 C 環：是否閉合（查耳酮開環）、C2=C3 是否為雙鍵、C3 有無 OH、</text>
<text x="380.0" y="366.0" font-size="13" fill="#11665a" text-anchor="middle" font-weight="normal">C4 有無羰基、B 環接 C2（多數）或 C3（異黃酮）、是否為氧鎓離子（花青素）。</text>
<text x="380.0" y="390.0" font-size="12" fill="#5b6b70" text-anchor="middle" font-weight="normal">畫法：先畫 A、B 兩個苯環，中間以三個碳與一個氧連成 C 環；再依類別加雙鍵、羰基、3-OH。羥基常在 5、7、3′、4′。</text>
</g></svg>
