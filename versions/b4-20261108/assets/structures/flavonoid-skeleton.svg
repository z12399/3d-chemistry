<line x1="340.1" y1="267.0" x2="340.1" y2="307.0" stroke="#1f2a2e" stroke-width="2.2" stroke-linecap="round"/>
<line x1="334.1" y1="273.0" x2="334.1" y2="301.0" stroke="#1f2a2e" stroke-width="2.2" stroke-linecap="round"/>
<text x="340.1" y="327.0" font-size="17" fill="#1f2a2e" text-anchor="middle" font-weight="normal">O</text>
<text x="356.1" y="329.0" font-size="12" fill="#5b6b70" text-anchor="start" font-weight="normal">（多數類別有 C4 羰基）</text>
<text x="250.0" y="151.4" font-size="13" fill="#11665a" text-anchor="middle" font-weight="normal">8</text>
<text x="250.0" y="288.6" font-size="13" fill="#11665a" text-anchor="middle" font-weight="normal">5</text>
