<text x="380.0" y="330.0" font-size="14" fill="#11665a" text-anchor="middle" font-weight="normal">工業上用葡萄糖異構酶（xylose isomerase）在中性 pH 完成同一件事，平衡約 42% 果糖，再以層析濃縮到 55%。</text>
<text x="380.0" y="356.0" font-size="14" fill="#5b6b70" text-anchor="middle" font-weight="normal">果糖糖漿＝游離葡萄糖＋游離果糖（都有還原端）；蔗糖＝葡萄糖 α1 → β2 果糖以糖苷鍵相連的雙醣（無還原端）。</text>
<text x="380.0" y="382.0" font-size="13" fill="#a23b2a" text-anchor="middle" font-weight="normal">畫法重點：C1 由醛變 CH₂OH、C2 由 CHOH 變 C=O；C3、C4、C5 的 OH 左右位置不變（左、右、右）。</text>
