<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
<title id="t">亞麻油酸 9-氫過氧化物到 2,4-癸二烯醛的生成機制</title><desc id="d">抽氫、共軛化、加氧、氫過氧化物分解、β-斷裂的流程。</desc>
<rect width="760" height="420" fill="#ffffff"/>
<g font-family="Segoe UI, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="15" fill="#1f2a2e">
<text x="380.0" y="38.0" font-size="17" fill="#1f2a2e" text-anchor="middle" font-weight="bold">生成機制：亞麻油酸（18:2 Δ9,12）→ 9-OOH → 烷氧自由基 → β-斷裂</text>
<text x="380.0" y="78.0" font-size="15" fill="#1f2a2e" text-anchor="middle" font-weight="bold">HOOC–(CH₂)₇–CH=CH–CH₂–CH=CH–(CH₂)₄–CH₃</text>
<text x="380.0" y="100.0" font-size="13" fill="#5b6b70" text-anchor="middle" font-weight="normal">亞麻油酸：C9=C10、C12=C13（皆 cis），C11 是雙烯丙位，C–H 最弱</text>
<text x="380.0" y="138.0" font-size="14" fill="#11665a" text-anchor="middle" font-weight="normal">①  起始／傳播：自由基抽走 C11 的 H → 戊二烯基自由基（電子離域在 C9–C13）</text>
<text x="380.0" y="178.0" font-size="14" fill="#11665a" text-anchor="middle" font-weight="normal">②  雙鍵位移成共軛二烯，O₂ 加在 C9（或 C13）→ 過氧自由基 → 抽 H 成 9-OOH（10E,12Z）</text>
<text x="380.0" y="222.0" font-size="15" fill="#1f2a2e" text-anchor="middle" font-weight="bold">HOOC–(CH₂)₇–CH(OOH)–CH=CH–CH=CH–(CH₂)₄–CH₃</text>
<text x="380.0" y="244.0" font-size="13" fill="#5b6b70" text-anchor="middle" font-weight="normal">9-氫過氧化物：OOH 在 C9，雙鍵移到 C10=C11、C12=C13</text>
<text x="380.0" y="282.0" font-size="14" fill="#11665a" text-anchor="middle" font-weight="normal">③  O–O 鍵均裂 → C9 烷氧自由基（C9–O•）＋ •OH</text>
<text x="380.0" y="318.0" font-size="14" fill="#11665a" text-anchor="middle" font-weight="normal">④  β-斷裂切 C8–C9：C9 變成醛基碳 → O=CH–CH=CH–CH=CH–(CH₂)₄–CH₃</text>
<text x="380.0" y="348.0" font-size="14" fill="#11665a" text-anchor="middle" font-weight="normal">＝ 2,4-癸二烯醛：C9…C18 共 10 碳，雙鍵在新編號 2、4 位（初為 2E,4Z，異構化成 E,E）</text>
<text x="380.0" y="372.0" font-size="15" fill="#1f2a2e" text-anchor="middle" font-weight="bold">另一片段為 C1–C8 的辛酸基自由基；兩片段碳數 8＋10＝18</text>
<line x1="380.0" y1="100.0" x2="380.0" y2="124.0" stroke="#11665a" stroke-width="2" stroke-linecap="round"/>
<line x1="380.0" y1="124.0" x2="375.7" y2="115.0" stroke="#11665a" stroke-width="2" stroke-linecap="round"/>
<line x1="380.0" y1="124.0" x2="384.3" y2="115.0" stroke="#11665a" stroke-width="2" stroke-linecap="round"/>
<line x1="380.0" y1="192.0" x2="380.0" y2="208.0" stroke="#11665a" stroke-width="2" stroke-linecap="round"/>
<line x1="380.0" y1="208.0" x2="375.7" y2="199.0" stroke="#11665a" stroke-width="2" stroke-linecap="round"/>
<line x1="380.0" y1="208.0" x2="384.3" y2="199.0" stroke="#11665a" stroke-width="2" stroke-linecap="round"/>
<line x1="380.0" y1="244.0" x2="380.0" y2="268.0" stroke="#11665a" stroke-width="2" stroke-linecap="round"/>
<line x1="380.0" y1="268.0" x2="375.7" y2="259.0" stroke="#11665a" stroke-width="2" stroke-linecap="round"/>
<line x1="380.0" y1="268.0" x2="384.3" y2="259.0" stroke="#11665a" stroke-width="2" stroke-linecap="round"/>
<text x="380.0" y="402.0" font-size="13" fill="#a23b2a" text-anchor="middle" font-weight="normal">答題重點：前驅物與氫過氧化物位置（9-OOH）、烷氧自由基、切哪條鍵、片段碳數守恆。</text>
</g></svg>
