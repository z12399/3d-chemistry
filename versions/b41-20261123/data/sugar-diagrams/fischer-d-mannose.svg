<svg xmlns="http://www.w3.org/2000/svg" width="220" height="310" viewBox="0 0 220 310" role="img" aria-label="D-甘露糖的 Fischer 投影：C2 到 C5 的 OH 依序在左、左、右、右；和 D-葡萄糖只差 C2。">
<rect width="220" height="310" fill="#ffffff"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif" font-size="17" fill="#1f2a30" stroke-linecap="round">
<line x1="110" y1="52" x2="110" y2="256" stroke="#1f2a30" stroke-width="2"/>
<text x="110" y="44" text-anchor="middle">CHO</text>
<text x="110" y="276" text-anchor="middle">CH<tspan dy="4" font-size="12">2</tspan><tspan dy="-4">OH</tspan></text>
<text x="40" y="44" text-anchor="end" font-size="12" fill="#6b7780">1</text>
<text x="40" y="276" text-anchor="end" font-size="12" fill="#6b7780">6</text>
<text x="40" y="93" text-anchor="end" font-size="12" fill="#b4532a" font-weight="700">2</text>
<line x1="76" y1="88" x2="144" y2="88" stroke="#b4532a" stroke-width="2.6"/>
<text x="72" y="94" text-anchor="end" fill="#b4532a" font-weight="700">HO</text>
<text x="148" y="94" text-anchor="start">H</text>
<text x="40" y="137" text-anchor="end" font-size="12" fill="#6b7780">3</text>
<line x1="76" y1="132" x2="144" y2="132" stroke="#1f2a30" stroke-width="2"/>
<text x="72" y="138" text-anchor="end" fill="#1f2a30">HO</text>
<text x="148" y="138" text-anchor="start">H</text>
<text x="40" y="181" text-anchor="end" font-size="12" fill="#6b7780">4</text>
<line x1="76" y1="176" x2="144" y2="176" stroke="#1f2a30" stroke-width="2"/>
<text x="148" y="182" text-anchor="start" fill="#1f2a30">OH</text>
<text x="72" y="182" text-anchor="end">H</text>
<text x="40" y="225" text-anchor="end" font-size="12" fill="#6b7780">5</text>
<line x1="76" y1="220" x2="144" y2="220" stroke="#1f2a30" stroke-width="2"/>
<text x="148" y="226" text-anchor="start" fill="#1f2a30">OH</text>
<text x="72" y="226" text-anchor="end">H</text>
<text x="110" y="298" text-anchor="middle" font-size="13" fill="#b4532a">和葡萄糖只差 C2</text>
</g>
</svg>
