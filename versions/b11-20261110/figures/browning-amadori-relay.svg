<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">Amadori：氮留 C1，C2 成羰基</title>
<desc id="figure-desc">C1 亞胺經 C1=C2 烯胺醇互變為 C2 酮胺，C1–N 保留，原 C2 氧仍位於 C2，重排不再淨脫水。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="500" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">Amadori：氮留 C1，C2 成羰基</tspan></text>
<rect x="32" y="118" width="166" height="190" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="115" y="150" font-size="19" fill="#1c2732" text-anchor="middle" font-weight="600"><tspan x="115" dy="0">C1 亞胺</tspan></text>
<text x="115" y="200" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="115" dy="0">C1=N–R</tspan><tspan x="115" dy="38">C2–OH</tspan></text>
<rect x="277" y="118" width="166" height="190" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360" y="150" font-size="19" fill="#1c2732" text-anchor="middle" font-weight="600"><tspan x="360" dy="0">烯胺醇</tspan></text>
<text x="360" y="200" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">C1–NH–R</tspan><tspan x="360" dy="38">C1=C2–OH</tspan></text>
<rect x="522" y="118" width="166" height="190" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="605" y="150" font-size="19" fill="#1c2732" text-anchor="middle" font-weight="600"><tspan x="605" dy="0">Amadori 酮胺</tspan></text>
<text x="605" y="200" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="605" dy="0">C1–NH–R</tspan><tspan x="605" dy="38">C2=O</tspan></text>
<path d="M 209 213 L 264 213" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 454 213 L 509 213" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="360" y="97" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="360" dy="0">質子與鍵階重排</tspan></text>
<path d="M 80 345 L 640 345" fill="none" stroke="#b4692e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="80" cy="345" r="5" fill="#b4692e" stroke="#b4692e" stroke-width="2"/>
<circle cx="640" cy="345" r="5" fill="#b4692e" stroke="#b4692e" stroke-width="2"/>
<text x="360" y="376" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">C1–N 保留；O2 始終留在 C2</tspan></text>
<text x="32" y="431" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">此重排不再淨脫水；</tspan><tspan x="32" dy="25">開鏈代表形態不表示食品中的主要形態或含量。</tspan></text>
<text x="688" y="482" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
