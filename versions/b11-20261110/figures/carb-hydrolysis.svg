<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">糖苷鍵水解：水加入斷鍵兩端</title>
<desc id="figure-desc">乳糖酶催化乳糖糖苷鍵水解，淨消耗水，生成半乳糖與葡萄糖；分子拆分並非移除糖。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="490" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">糖苷鍵水解：水加入斷鍵兩端</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">以乳糖水解為例；圖形是糖單位示意</tspan></text>
<rect x="77" y="120" width="180" height="64" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="167.0" y="159.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="167.0" dy="0">半乳糖單位</tspan></text>
<rect x="463" y="120" width="180" height="64" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="553.0" y="159.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="553.0" dy="0">葡萄糖單位</tspan></text>
<path d="M 257 152 L 463 152" fill="none" stroke="#14665d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="360" y="127" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">糖苷鍵</tspan></text>
<rect x="300" y="206" width="120" height="51" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="238.5" font-size="23" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">H₂O</tspan></text>
<path d="M 360 267 L 360 307" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="391" y="297" font-size="19" fill="#14665d" text-anchor="start"><tspan x="391" dy="0">乳糖酶</tspan></text>
<rect x="77" y="327" width="224" height="67" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="189.0" y="367.5" font-size="23" fill="#1c2732" text-anchor="middle"><tspan x="189.0" dy="0">半乳糖</tspan></text>
<rect x="419" y="327" width="224" height="67" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="531.0" y="367.5" font-size="23" fill="#1c2732" text-anchor="middle"><tspan x="531.0" dy="0">葡萄糖</tspan></text>
<text x="326" y="368" font-size="26" fill="#53606d" text-anchor="middle"><tspan x="326" dy="0">＋</tspan></text>
<text x="281" y="368" font-size="18" fill="#b4692e" text-anchor="end"><tspan x="281" dy="0">OH</tspan></text>
<text x="432" y="368" font-size="18" fill="#b4692e" text-anchor="start"><tspan x="432" dy="0">H</tspan></text>
<path d="M 314 239 C 282 250 280 283 280 315" fill="none" stroke="#b4692e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
