<text x="360" y="435" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="360" dy="0">酵素辨認鍵型與立體環境</tspan></text>
<text x="360" y="464" font-size="18" fill="#53606d" text-anchor="middle"><tspan x="360" dy="0">拆成單糖，碳原子仍留在食品中</tspan></text>
<text x="688" y="472" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
