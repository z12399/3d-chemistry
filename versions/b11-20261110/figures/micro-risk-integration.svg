<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">菌量預測只接上風險評估的一環</title>
<desc id="figure-desc">微生物風險評估包含四步：危害鑑定 → 危害特性描述（劑量反應）→ 暴露評估 → 風險特性描述；預測菌量只是暴露評估的一環。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="540" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">菌量預測只接上風險評估的一環</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">危害、反應、暴露與適用對象需相互對齊</tspan></text>
<rect x="32" y="135" width="140" height="112" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="102.0" y="184.0" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="102.0" dy="0">危害鑑定</tspan><tspan x="102.0" dy="28">微生物或毒素</tspan></text>
<rect x="204" y="135" width="140" height="112" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="274.0" y="184.0" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="274.0" dy="0">危害特性</tspan><tspan x="274.0" dy="28">劑量反應</tspan></text>
<rect x="376" y="135" width="140" height="112" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="446.0" y="184.0" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="446.0" dy="0">暴露評估</tspan><tspan x="446.0" dy="28">污染到食用</tspan></text>
<rect x="548" y="135" width="140" height="112" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="618.0" y="184.0" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="618.0" dy="0">風險特性</tspan><tspan x="618.0" dy="28">可能性與嚴重性</tspan></text>
<path d="M 180 191 L 196 191" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<path d="M 352 191 L 368 191" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<path d="M 524 191 L 540 191" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="52" y="335" width="210" height="95" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="157.0" y="375.5" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="157.0" dy="0">預測濃度 C</tspan><tspan x="157.0" dy="28">保存條件與時間</tspan></text>
<rect x="333" y="335" width="224" height="95" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="445.0" y="375.5" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="445.0" dy="0">份量 m</tspan><tspan x="445.0" dy="28">平均劑量 d = C × m</tspan></text>
<path d="M 272 383 L 323 383" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 446 325 L 446 257" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="469" y="295" font-size="18" fill="#14665d" text-anchor="start"><tspan x="469" dy="0">暴露的一環</tspan></text>
<text x="32" y="480" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">預測菌量不能單獨給出健康風險。</tspan><tspan x="32" dy="25">感染、發病、嚴重度與不確定性需分開。</tspan></text>
<text x="688" y="522" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
