<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">合生元：兩條路徑，各有證據要求</title><desc id="desc">互補型合生元要求成分各自成立且組合有宿主效益；協同型成分不必各自成立，但須相符的四條件研究。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="560" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">合生元：兩條路徑，各有證據要求</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">組合名稱不能代替目標宿主的健康效益</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><rect x="28" y="110" width="310" height="359" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><rect x="382" y="110" width="310" height="359" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="48" y="142" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">Complementary synbiotic</text><text x="48" y="185" font-size="17" fill="#1c2732" text-anchor="start" font-weight="400">益生菌、益生元各自成立</text><text x="48" y="214" font-size="17" fill="#1c2732" text-anchor="start" font-weight="400">提供相符用量</text><line x1="183" y1="240" x2="183" y2="274" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="287" width="270" height="99" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="64" y="317" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">組合本身</text><text x="64" y="346" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">仍須有目標宿主效益</text><text x="402" y="142" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">Synergistic synbiotic</text><text x="402" y="185" font-size="17" fill="#1c2732" text-anchor="start" font-weight="400">基質為同時施用的菌而選</text><text x="402" y="214" font-size="17" fill="#1c2732" text-anchor="start" font-weight="400">成分不必各自已成立</text><line x1="537" y1="240" x2="537" y2="274" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="402" y="287" width="270" height="145" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="418" y="317" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">同一目標宿主研究</text><text x="418" y="346" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">組合／菌單用／基質單用／對照</text><text x="418" y="371" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">比較選擇性利用</text><text x="418" y="396" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">及健康效益</text><text x="28" y="493" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">須核對菌株或製備物、基質、用量、族群與終點。</text><text x="28" y="516" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">選擇性利用、活菌數或菌群改變，均不能取代相符宿主結果。</text><text x="692" y="544" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>