<text x="46" y="355" font-size="18" fill="#53606d" text-anchor="start"><tspan x="46" dy="0">連線僅表示分子間作用的網絡概念</tspan></text>
<rect x="35" y="379" width="650" height="70" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360" y="405" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">適當系統中，可能發生二硫鍵交換</tspan></text>
<text x="360" y="434" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">R–S⁻ + R′–S–S–R″ → R–S–S–R′ + R″–S⁻</tspan></text>
<text x="32" y="472" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">非共價作用也能支撐網絡。</tspan><tspan x="32" dy="25">配方與加工條件決定結果。</tspan></text>
<text x="688" y="502" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
