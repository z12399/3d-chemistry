<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">平均電荷：先列形態，再加權</title>
<desc id="figure-desc">三種整數電荷形態隨 pH 與 pKa 改變分率，以電荷乘分率相加得到平均淨電荷。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="470" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">平均電荷：先列形態，再加權</tspan></text>
<text x="360" y="102" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">pH 與 pKa 決定各形態比例</tspan></text>
<circle cx="135" cy="195" r="45" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="135" y="204" font-size="30" fill="#1c2732" text-anchor="middle" font-weight="600"><tspan x="135" dy="0">+1</tspan></text>
<text x="135" y="280" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="135" dy="0">分率 α₊</tspan></text>
<path d="M 135 300 L 135 335" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<circle cx="360" cy="195" r="45" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="360" y="204" font-size="30" fill="#1c2732" text-anchor="middle" font-weight="600"><tspan x="360" dy="0">0</tspan></text>
<text x="360" y="280" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">分率 α₀</tspan></text>
<path d="M 360 300 L 360 335" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<circle cx="585" cy="195" r="45" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="585" y="204" font-size="30" fill="#1c2732" text-anchor="middle" font-weight="600"><tspan x="585" dy="0">−1</tspan></text>
<text x="585" y="280" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="585" dy="0">分率 α₋</tspan></text>
<path d="M 585 300 L 585 335" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 190 188 L 305 188" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 305 202 L 190 202" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 415 188 L 530 188" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 530 202 L 415 202" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="50" y="350" width="620" height="65" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="389.5" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">平均淨電荷＝(+1)α₊＋(0)α₀＋(−1)α₋</tspan></text>
<text x="32" y="445" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">分率合計為 1；平均值不是一個分子的獨立形態。</tspan></text>
<text x="688" y="452" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
