<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">變性改變高階結構</title>
<desc id="figure-desc">連續的肽鏈由摺疊改為展開或重排；之後可能聚集，但聚集並非每次變性都發生。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="500" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">變性改變高階結構</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">通常保留肽鏈的主要序列</tspan></text>
<text x="132" y="137" font-size="22" fill="#1c2732" text-anchor="middle" font-weight="600"><tspan x="132" dy="0">原生摺疊</tspan></text>
<text x="360" y="137" font-size="22" fill="#1c2732" text-anchor="middle" font-weight="600"><tspan x="360" dy="0">展開／重排</tspan></text>
<text x="595" y="137" font-size="22" fill="#1c2732" text-anchor="middle" font-weight="600"><tspan x="595" dy="0">可能聚集</tspan></text>
<path d="M 74 247 C 39 197 114 170 144 204 C 183 248 99 287 91 236 C 80 182 194 197 180 248 C 170 284 137 291 126 263 C 108 223 199 213 206 262" fill="none" stroke="#14665d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 280 246 C 292 196 320 284 334 234 C 347 194 369 270 385 235 C 407 197 429 263 443 225" fill="none" stroke="#14665d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 526 212 C 546 185 560 251 581 219 C 605 188 633 248 661 219" fill="none" stroke="#14665d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 520 241 C 540 214 554 280 575 248 C 599 217 627 277 655 248" fill="none" stroke="#6f8fb5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 535 269 C 555 242 569 308 590 276 C 614 245 642 305 670 276" fill="none" stroke="#b4692e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 218 235 L 263 235" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="245" y="181" font-size="18" fill="#53606d" text-anchor="middle"><tspan x="245" dy="0">環境</tspan></text>
<text x="245" y="205" font-size="18" fill="#53606d" text-anchor="middle"><tspan x="245" dy="0">改變</tspan></text>
<path d="M 457 235 L 509 235" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#arrow-teal)"/>
<text x="483" y="205" font-size="18" fill="#53606d" text-anchor="middle"><tspan x="483" dy="0">可能</tspan></text>
<text x="360" y="341" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="360" dy="0">連續線代表肽鏈，並未畫成斷裂片段</tspan></text>
<text x="32" y="400" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">加熱、pH 或環境改變，可使原本隱藏的基團暴露。</tspan><tspan x="32" dy="25">變性與聚集不同，也不保證都可逆。</tspan></text>
<text x="688" y="482" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
