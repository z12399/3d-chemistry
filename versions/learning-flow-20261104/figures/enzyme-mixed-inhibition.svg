<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">混合抑制：α 與 α′ 分開看</title>
<desc id="figure-desc">抑制劑分別可逆結合E與ES，以α和α′標示；ESI無催化活性，表觀Vmax與Km依兩因子改變。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="560" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">混合抑制：α 與 α′ 分開看</tspan></text>
<rect x="40" y="125" width="150" height="70" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="115.0" y="167.0" font-size="28" fill="#1c2732" text-anchor="middle"><tspan x="115.0" dy="0">E</tspan></text>
<rect x="285" y="125" width="150" height="70" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="167.0" font-size="28" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">ES</tspan></text>
<rect x="530" y="125" width="158" height="70" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="609.0" y="167.0" font-size="26" fill="#1c2732" text-anchor="middle"><tspan x="609.0" dy="0">E＋P</tspan></text>
<path d="M 198 153 L 277 153" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 277 167 L 198 167" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="237" y="118" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="237" dy="0">＋S</tspan></text>
<path d="M 443 160 L 522 160" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="40" y="315" width="150" height="70" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="115.0" y="357.0" font-size="28" fill="#1c2732" text-anchor="middle"><tspan x="115.0" dy="0">EI</tspan></text>
<rect x="285" y="315" width="150" height="70" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="357.0" font-size="28" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">ESI</tspan></text>
