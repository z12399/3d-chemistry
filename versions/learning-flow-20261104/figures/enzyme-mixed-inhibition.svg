<path d="M 129 307 L 129 203" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="159" y="244" font-size="20" fill="#1c2732" text-anchor="start"><tspan x="159" dy="0">＋I</tspan><tspan x="159" dy="31">α</tspan></text>
<path d="M 346 203 L 346 307" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<path d="M 374 307 L 374 203" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="404" y="244" font-size="20" fill="#1c2732" text-anchor="start"><tspan x="404" dy="0">＋I</tspan><tspan x="404" dy="31">α′</tspan></text>
<text x="477" y="352" font-size="20" fill="#53606d" text-anchor="start"><tspan x="477" dy="0">ESI 不生成產物</tspan></text>
<rect x="32" y="425" width="656" height="80" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="458.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">Vmax,app＝Vmax／α′</tspan><tspan x="360.0" dy="28">Km,app＝αKm／α′</tspan></text>
<text x="32" y="537" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">α／α′ 決定 Km,app 的升降。</tspan></text>
<text x="688" y="542" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
