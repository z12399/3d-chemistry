<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">先前暴露，可能改變後續壓力反應</title><desc id="desc">以有無前次暴露的兩組比較後續同一壓力反應，須對齊起始量與回收，不能由存活差直接推定突變。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="490" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">先前暴露，可能改變後續壓力反應</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">適應與交叉保護須限定菌株、壓力和條件</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><text x="28" y="116" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">對齊起始量</text><rect x="28" y="139" width="195" height="82" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="169" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">未經前次暴露</text><text x="44" y="198" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">基準狀態</text><rect x="28" y="265" width="195" height="96" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="295" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">經前次暴露</text><text x="44" y="324" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">膜、蛋白與代謝</text><text x="44" y="349" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">可能調整</text><rect x="294" y="139" width="179" height="82" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="310" y="169" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">後續指定壓力</text><rect x="294" y="265" width="179" height="96" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="310" y="295" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">相同後續壓力</text><line x1="231" y1="180" x2="284" y2="180" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><line x1="231" y1="312" x2="284" y2="312" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="545" y="139" width="147" height="82" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="561" y="169" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">量測結果</text><text x="561" y="198" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">同樣回收條件</text><rect x="545" y="265" width="147" height="96" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="561" y="295" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">量測結果</text><text x="561" y="324" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">同樣回收條件</text><line x1="481" y1="180" x2="535" y2="180" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><line x1="481" y1="312" x2="535" y2="312" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><line x1="28" y1="392" x2="692" y2="392" stroke="#dfe4e8" stroke-width="2"/><text x="28" y="423" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">較高存活量不能單獨辨認短期調整、族群選擇或遺傳改變。</text><text x="28" y="446" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">不是所有菌或所有壓力組合，都會產生更高耐受。</text><text x="692" y="474" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>