<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">先找改變的是哪個部位</title>
<desc id="figure-desc">脂質反應依酯鍵與碳碳雙鍵區分；熔化結晶另屬分子排列改變。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="510" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">先找改變的是哪個部位</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">相似的軟硬或風味變化，可能來自不同機制</tspan></text>
<rect x="32" y="112" width="152" height="91" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="108.0" y="150.5" font-size="23" fill="#1c2732" text-anchor="middle"><tspan x="108.0" dy="0">酯鍵</tspan><tspan x="108.0" dy="28">改變</tspan></text>
<path d="M 194 157 L 250 157" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="268" y="126" width="132" height="62" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="334.0" y="164.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="334.0" dy="0">水解</tspan></text>
<rect x="412" y="126" width="132" height="62" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="478.0" y="164.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="478.0" dy="0">皂化</tspan></text>
<rect x="556" y="126" width="132" height="62" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="622.0" y="164.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="622.0" dy="0">酯交換</tspan></text>
<text x="477" y="225" font-size="18" fill="#53606d" text-anchor="middle"><tspan x="477" dy="0">斷酯鍵／脂肪醯基重新分配</tspan></text>
<rect x="32" y="255" width="152" height="91" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="108.0" y="293.5" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="108.0" dy="0">碳碳雙鍵</tspan><tspan x="108.0" dy="28">C=C</tspan></text>
<path d="M 194 300 L 250 300" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<rect x="268" y="269" width="177" height="62" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="356.5" y="307.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="356.5" dy="0">氧化</tspan></text>
<rect x="478" y="269" width="210" height="62" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="583.0" y="307.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="583.0" dy="0">催化氫化</tspan></text>
<text x="358" y="365" font-size="18" fill="#53606d" text-anchor="middle"><tspan x="358" dy="0">與氧反應</tspan></text>
<text x="583" y="365" font-size="17" fill="#53606d" text-anchor="middle"><tspan x="583" dy="0">加氫；可能伴隨異構化</tspan></text>
<rect x="32" y="392" width="656" height="77" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="61" y="438" font-size="22" fill="#14665d" text-anchor="start"><tspan x="61" dy="0">分子排列</tspan></text>
<text x="293" y="438" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="293" dy="0">熔化</tspan></text>
<path d="M 337 423 L 456 423" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 456 447 L 337 447" fill="none" stroke="#6f8fb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="503" y="438" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="503" dy="0">結晶</tspan></text>
<text x="649" y="438" font-size="18" fill="#53606d" text-anchor="end"><tspan x="649" dy="0">物理變化</tspan></text>
<text x="688" y="492" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
