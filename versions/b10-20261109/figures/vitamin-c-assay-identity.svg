<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">測 AA 與測總 C 是兩條分析鏈</title>
<desc id="figure-desc">同一原樣分成直接 AA 測定與先還原 DHA 再測定兩條路；同一 AA 當量基準的差值估算 DHA。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="540" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">測 AA 與測總 C 是兩條分析鏈</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">教材假想；同一原樣、同一 AA 當量基準</tspan></text>
<rect x="32" y="193" width="148" height="100" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="106.0" y="236.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="106.0" dy="0">原樣</tspan><tspan x="106.0" dy="28">AA ＋ DHA</tspan></text>
<path d="M 192 243 L 214 243 L 214 139 L 251 139" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 214 243 L 214 348 L 251 348" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="264" y="101" width="196" height="76" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="362.0" y="132.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="362.0" dy="0">直接測定</tspan><tspan x="362.0" dy="28">AA＝30</tspan></text>
<rect x="264" y="310" width="196" height="76" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="362.0" y="341.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="362.0" dy="0">先將 DHA 還原</tspan><tspan x="362.0" dy="28">再測總 C＝42</tspan></text>
<path d="M 472 139 L 508 139 L 508 209 L 539 209" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 472 348 L 508 348 L 508 277 L 539 277" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="552" y="191" width="136" height="110" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="620.0" y="225.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="620.0" dy="0">42 − 30</tspan><tspan x="620.0" dy="28">＝12</tspan><tspan x="620.0" dy="28">DHA 估計</tspan></text>
<text x="476" y="429" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="476" dy="0">單位：mg L-AA 當量／100 g</tspan></text>
<text x="32" y="480" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">差值為 DHA 的 AA 當量估計，非直接鑑定；</tspan><tspan x="32" dy="25">須確認還原、回收及兩次量測的誤差。</tspan></text>
<text x="688" y="522" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
