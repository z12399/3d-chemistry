<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="title">替代蛋白：分母、需求與消化分開</title>
<desc id="desc">胺基酸含量先換成每克蛋白，再對需求模式；缺值保留未知，體外端點不等於體內迴腸消化率。</desc>
<defs>
<marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#14665d"/></marker>
<marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53606d"/></marker>
<marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b4692e"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6f8fb5"/></marker>
<marker id="arr-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b8902a"/></marker>
</defs>
<rect width="720" height="520" fill="#ffffff"/>
<text x="30" y="38" font-size="22" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="30" dy="0">替代蛋白：分母、需求與消化分開</tspan></text>
<text x="30" y="69" font-size="17" fill="#53606d" text-anchor="start"><tspan x="30" dy="0">同一份胺基酸，換分母不會變多</tspan></text>
<rect x="30" y="104" width="205" height="75" rx="12" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="132.5" y="135.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="132.5" dy="0">g 胺基酸</tspan><tspan x="132.5" dy="27">／100 g 乾樣</tspan></text>
<text x="265" y="150" font-size="28" fill="#1c2732" text-anchor="middle"><tspan x="265" dy="0">÷</tspan></text>
<rect x="300" y="104" width="215" height="75" rx="12" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="407.5" y="135.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="407.5" dy="0">g 蛋白</tspan><tspan x="407.5" dy="27">／100 g 乾樣</tspan></text>
<text x="601" y="150" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="601" dy="0">×1000</tspan></text>
<path d="M360 195L360 228" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/>
<rect x="192" y="242" width="336" height="66" rx="12" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="360.0" y="282.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">mg 胺基酸／g 蛋白</tspan></text>
<path d="M360 322L360 352" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/>
<text x="360" y="386" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">對照同一胺基酸群的需求模式</tspan></text>
<rect x="30" y="410" width="660" height="62" rx="12" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="50" y="438" font-size="18" fill="#1c2732" text-anchor="start"><tspan x="50" dy="0">Cys 或 Trp 缺值 → 保留未知</tspan></text>
<text x="50" y="462" font-size="18" fill="#1c2732" text-anchor="start"><tspan x="50" dy="0">成分比值 ≠ 已做逐項消化校正</tspan></text>
<text x="688" y="504" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
