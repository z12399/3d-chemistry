<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
<title id="t">α-胺基酸的通式（兩性離子）</title><desc id="d">α 碳連接氫、側鏈 R、銨基與羧酸根；pH 7 附近以兩性離子為主。</desc>
<rect width="760" height="420" fill="#ffffff"/>
<g font-family="Segoe UI, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="15" fill="#1f2a2e">
<text x="380.0" y="40.0" font-size="18" fill="#1f2a2e" text-anchor="middle" font-weight="bold">α-胺基酸通式：一個 α 碳接四個不同基團</text>
<text x="380.0" y="221.0" font-size="20" fill="#1f2a2e" text-anchor="middle" font-weight="bold">C</text>
<text x="394.0" y="205.0" font-size="12" fill="#5b6b70" text-anchor="start" font-weight="normal">α</text>
<line x1="380.0" y1="199.0" x2="380.0" y2="157.0" stroke="#1f2a2e" stroke-width="2.2" stroke-linecap="round"/>
<text x="380.0" y="149.0" font-size="18" fill="#1f2a2e" text-anchor="middle" font-weight="normal">H</text>
<line x1="380.0" y1="229.0" x2="380.0" y2="273.0" stroke="#1f2a2e" stroke-width="2.2" stroke-linecap="round"/>
<text x="380.0" y="297.0" font-size="18" fill="#1f2a2e" text-anchor="middle" font-weight="bold">R</text>
<text x="380.0" y="319.0" font-size="13" fill="#5b6b70" text-anchor="middle" font-weight="normal">側鏈：決定是哪一種胺基酸（20 種）</text>
<line x1="364.0" y1="215.0" x2="310.0" y2="215.0" stroke="#1f2a2e" stroke-width="2.2" stroke-linecap="round"/>
<text x="262.0" y="221.0" font-size="18" fill="#1f2a2e" text-anchor="middle" font-weight="normal">H₃N⁺</text>
<text x="262.0" y="245.0" font-size="13" fill="#5b6b70" text-anchor="middle" font-weight="normal">α-胺基（質子化）</text>
<line x1="396.0" y1="215.0" x2="450.0" y2="215.0" stroke="#1f2a2e" stroke-width="2.2" stroke-linecap="round"/>
<text x="466.0" y="221.0" font-size="20" fill="#1f2a2e" text-anchor="middle" font-weight="bold">C</text>
<line x1="478.0" y1="205.0" x2="514.0" y2="179.0" stroke="#1f2a2e" stroke-width="2.2" stroke-linecap="round"/>
<line x1="479.9" y1="196.2" x2="505.1" y2="178.0" stroke="#1f2a2e" stroke-width="2.2" stroke-linecap="round"/>
<text x="532.0" y="179.0" font-size="18" fill="#1f2a2e" text-anchor="middle" font-weight="normal">O</text>
<line x1="478.0" y1="225.0" x2="514.0" y2="251.0" stroke="#1f2a2e" stroke-width="2.2" stroke-linecap="round"/>
<text x="538.0" y="259.0" font-size="18" fill="#1f2a2e" text-anchor="middle" font-weight="normal">O⁻</text>
<text x="506.0" y="291.0" font-size="13" fill="#5b6b70" text-anchor="middle" font-weight="normal">α-羧基（去質子化）</text>
<text x="380.0" y="340.0" font-size="14" fill="#11665a" text-anchor="middle" font-weight="normal">低 pH：H₃N⁺–CHR–COOH（淨電荷 +1）　pH 7 附近：H₃N⁺–CHR–COO⁻（0）　高 pH：H₂N–CHR–COO⁻（−1）</text>
<text x="380.0" y="368.0" font-size="13" fill="#5b6b70" text-anchor="middle" font-weight="normal">畫法重點：α 碳要同時接到 H、R、胺基、羧基；寫成兩性離子時正負電荷各一。</text>
<text x="380.0" y="392.0" font-size="13" fill="#5b6b70" text-anchor="middle" font-weight="normal">除甘胺酸（R = H）外 α 碳為掌性中心；蛋白質中的天然胺基酸多為 L 型。</text>
</g></svg>
