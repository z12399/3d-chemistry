<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">α 與 β 互變，要先開環</title>
<desc id="figure-desc">環狀葡萄糖經開鏈羰基的平面中心，再重新閉環，形成另一異頭形式並趨向平衡。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="440" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">α 與 β 互變，要先開環</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">方塊代表形式，不是完整化學結構</tspan></text>
<rect x="32" y="146" width="185" height="135" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="124.5" y="206.5" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="124.5" dy="0">α-D-葡萄糖</tspan><tspan x="124.5" dy="28">環狀</tspan></text>
<rect x="267" y="146" width="186" height="135" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="206.5" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">開鏈 D-葡萄糖</tspan><tspan x="360.0" dy="28">C1 羰基為平面</tspan></text>
<rect x="503" y="146" width="185" height="135" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="595.5" y="206.5" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="595.5" dy="0">β-D-葡萄糖</tspan><tspan x="595.5" dy="28">環狀</tspan></text>
<path d="M 222 192 L 262 192" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 262 229 L 222 229" fill="none" stroke="#6f8fb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M 458 192 L 498 192" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 498 229 L 458 229" fill="none" stroke="#6f8fb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="242" y="127" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="242" dy="0">開環</tspan></text>
<text x="478" y="127" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="478" dy="0">再閉環</tspan></text>
<path d="M 124 293 L 124 325 L 596 325 L 596 293" fill="none" stroke="#dfe4e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="360" y="358" font-size="21" fill="#14665d" text-anchor="middle"><tspan x="360" dy="0">異頭形式互變，直到平衡</tspan></text>
<text x="360" y="403" font-size="19" fill="#53606d" text-anchor="middle"><tspan x="360" dy="0">一般單鍵旋轉不會改變 α／β 配置</tspan></text>
<text x="688" y="422" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
