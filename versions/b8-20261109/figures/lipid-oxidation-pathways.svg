<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">同一亞油酸，兩條途徑的產物位置</title>
<desc id="figure-desc">對照由 C11 抽氫的自由基自氧化與 II 型光敏單重態氧路徑，前者主要形成 9、13 位，後者可形成 9、10、12、13 位氫過氧化物。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="520" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">同一亞油酸，兩條途徑的產物位置</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">位置從羧基碳 C1 起算；指 −OOH 所接碳</tspan></text>
<rect x="154" y="96" width="412" height="56" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="131.0" font-size="23" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">亞油酸 18:2（9Z,12Z）</tspan></text>
<rect x="32" y="179" width="656" height="133" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="52" y="212" font-size="22" fill="#14665d" text-anchor="start"><tspan x="52" dy="0">自氧化</tspan></text>
<text x="53" y="251" font-size="18" fill="#1c2732" text-anchor="start"><tspan x="53" dy="0">C11 易被抽氫</tspan><tspan x="53" dy="28">自由基離域後加氧</tspan></text>
<path d="M 276 254 L 361 254" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="319" y="236" font-size="17" fill="#1c2732" text-anchor="middle"><tspan x="319" dy="0">再取氫</tspan></text>
<circle cx="446" cy="252" r="29" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="446" y="258" font-size="16" fill="#14665d" text-anchor="middle"><tspan x="446" dy="0">9</tspan></text>
<circle cx="561" cy="252" r="29" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="561" y="258" font-size="16" fill="#14665d" text-anchor="middle"><tspan x="561" dy="0">13</tspan></text>
<text x="503" y="300" font-size="17" fill="#53606d" text-anchor="middle"><tspan x="503" dy="0">主要產物位置</tspan></text>
<rect x="32" y="332" width="656" height="133" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="52" y="365" font-size="22" fill="#14665d" text-anchor="start"><tspan x="52" dy="0">II 型光敏氧化</tspan></text>
<text x="53" y="404" font-size="18" fill="#1c2732" text-anchor="start"><tspan x="53" dy="0">光敏分子把能量交給氧</tspan><tspan x="53" dy="28">單重態氧與雙鍵反應</tspan></text>
<path d="M 302 410 L 360 410" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<circle cx="407" cy="408" r="25" fill="#ffffff" stroke="#14665d" stroke-width="2"/>
<text x="407" y="414" font-size="16" fill="#14665d" text-anchor="middle"><tspan x="407" dy="0">9</tspan></text>
<circle cx="478" cy="408" r="25" fill="#ffffff" stroke="#b4692e" stroke-width="2"/>
<text x="478" y="414" font-size="16" fill="#b4692e" text-anchor="middle"><tspan x="478" dy="0">10</tspan></text>
<circle cx="549" cy="408" r="25" fill="#ffffff" stroke="#b4692e" stroke-width="2"/>
<text x="549" y="414" font-size="16" fill="#b4692e" text-anchor="middle"><tspan x="549" dy="0">12</tspan></text>
<circle cx="620" cy="408" r="25" fill="#ffffff" stroke="#14665d" stroke-width="2"/>
<text x="620" y="414" font-size="16" fill="#14665d" text-anchor="middle"><tspan x="620" dy="0">13</tspan></text>
<text x="360" y="497" font-size="19" fill="#53606d" text-anchor="middle"><tspan x="360" dy="0">9、13 位在兩條途徑重疊，不能單獨判定來源</tspan></text>
<text x="688" y="502" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
