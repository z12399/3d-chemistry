<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="analysis-calibration-residuals-title analysis-calibration-residuals-desc">
<title id="analysis-calibration-residuals-title">殘差：觀察值離模型多遠？</title>
<desc id="analysis-calibration-residuals-desc">單一觀測與模型預測的差用符號列示，再分辨殘差的系統方向變化與散布變大所提出的不同警訊。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker></defs>
<rect width="720" height="100%" fill="#ffffff"/>
<g font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" fill="#1c2732" font-size="18">
<text x="32" y="36" font-size="20" fill="#1c2732" text-anchor="start" font-weight="600">殘差：觀察值離模型多遠？</text>
<line x1="32" y1="54" x2="688" y2="54" stroke="#dfe4e8" stroke-width="2"/>
<rect x="32" y="90" width="208" height="76" rx="12" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="136.0" y="134.0" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">觀察響應 yᵢ</text>
<text x="279" y="139" font-size="28" fill="#1c2732" text-anchor="middle" font-weight="400">−</text>
<rect x="318" y="90" width="370" height="76" rx="12" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="503.0" y="134.0" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">模型預測 a ＋ bxᵢ</text>
<path d="M136 170 V201 H359 V224" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M503 170 V201 H360" fill="none" stroke="#14665d" stroke-width="2"/>
<text x="360" y="257" font-size="22" fill="#1c2732" text-anchor="middle" font-weight="600">殘差 eᵢ ＝ yᵢ − (a ＋ bxᵢ)</text>
<rect x="32" y="292" width="312" height="82" rx="12" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="188.0" y="326.0" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">兩端與中間方向不同</text>
<text x="188.0" y="352.0" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">提示直線可能不足</text>
<rect x="368" y="292" width="320" height="82" rx="12" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="528.0" y="326.0" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">散布隨濃度放大</text>
<text x="528.0" y="352.0" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">提示等變異不適用</text>
<rect x="32" y="401" width="656" height="68" rx="12" fill="#e7f1ee" stroke="#e7f1ee" stroke-width="2"/>
<text x="46" y="427" font-size="16" fill="#14665d" text-anchor="start" font-weight="400">R² 很高仍可能有問題；先核模型與範圍，不為美化而刪點。</text>
<text x="46" y="452" font-size="16" fill="#14665d" text-anchor="start" font-weight="400">扣過空白不自動證明截距為零；強迫過零也是模型假設。</text>
<text x="680" y="487" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text>
</g>
</svg>