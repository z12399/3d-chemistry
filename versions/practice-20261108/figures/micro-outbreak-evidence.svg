<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">共同來源主張，要接上四條證據</title><desc id="desc">基因體、病例暴露、產品追溯與時間四條證據共同支持有範圍的來源主張，不能只由基因距離下結論。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="520" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">共同來源主張，要接上四條證據</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">基因群不等同工廠、食品批次或傳播方向</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><rect x="28" y="108" width="265" height="85" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="138" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">基因體關聯</text><text x="44" y="167" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">採樣集合與分析方法</text><rect x="427" y="108" width="265" height="85" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="443" y="138" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">病例暴露</text><text x="443" y="167" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">接觸／食用資料</text><rect x="28" y="335" width="265" height="85" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="365" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">產品追溯</text><text x="44" y="394" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">產品與供應來源</text><rect x="427" y="335" width="265" height="85" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="443" y="365" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">時間相容性</text><text x="443" y="394" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">事件與採樣時間</text><rect x="225" y="226" width="270" height="75" rx="14" fill="#ffffff" stroke="#14665d" stroke-width="2"/><text x="360" y="270" font-size="18" fill="#14665d" text-anchor="middle" font-weight="700">範圍清楚的來源主張</text><path d="M 161 202 L 161 264 L 215 264" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><path d="M 559 202 L 559 264 L 505 264" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><path d="M 161 326 L 161 264" fill="none" stroke="#14665d" stroke-width="2"/><path d="M 559 326 L 559 264" fill="none" stroke="#14665d" stroke-width="2"/><text x="28" y="453" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">同一工廠可牽涉兩個基因群，須與其他調查證據一起讀。</text><text x="28" y="476" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">基因距離不能單獨指出最初污染入口或傳播方向。</text><text x="692" y="504" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>