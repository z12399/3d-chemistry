<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">同樣油體積，小滴提供較多界面</title>
<desc id="figure-desc">同體積油以多個小球滴或較少大球滴分布，前者界面較多；總界面由 d32 連到油體積，d43 不能代替。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="520" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">同樣油體積，小滴提供較多界面</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">球滴示意；兩側油體積相同</tspan></text>
<rect x="32" y="106" width="295" height="239" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<rect x="393" y="106" width="295" height="239" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<circle cx="111" cy="170" r="20" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="169" cy="170" r="20" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="227" cy="170" r="20" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="111" cy="226" r="20" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="169" cy="226" r="20" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="227" cy="226" r="20" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="140" cy="282" r="20" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="198" cy="282" r="20" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="540" cy="224" r="40" fill="#e7f1ee" stroke="#14665d" stroke-width="3"/>
<text x="179" y="380" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="179" dy="0">小滴分布</tspan><tspan x="179" dy="29">每單位油體積界面較多</tspan></text>
<text x="540" y="380" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="540" dy="0">大滴分布</tspan><tspan x="540" dy="29">每單位油體積界面較少</tspan></text>
<rect x="61" y="425" width="598" height="52" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="458.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">總界面 A＝6V／d₃₂；不可用 d₄₃ 直接代替</tspan></text>
<text x="688" y="502" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
