<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">吸水降低玻璃轉移溫度</title>
<desc id="figure-desc">定性圖表示含水量增加時，無定形食品的玻璃轉移溫度可下降。在同一儲存溫度下，超過轉移區間時活動性可能增加。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="520" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">吸水降低玻璃轉移溫度</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">無定形糖類系統的定性概念比較</tspan></text>
<path d="M 88 373 L 88 112" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<path d="M 88 373 L 653 373" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<text x="43" y="124" font-size="19" fill="#1c2732" text-anchor="start"><tspan x="43" dy="0">溫度</tspan></text>
<text x="648" y="408" font-size="19" fill="#1c2732" text-anchor="end"><tspan x="648" dy="0">含水量增加</tspan></text>
<path d="M 101 243 L 641 243" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/>
<text x="111" y="229" font-size="19" fill="#b4692e" text-anchor="start"><tspan x="111" dy="0">同一儲存溫度</tspan></text>
<path d="M 123 151 C 240 171, 298 232, 370 274 S 529 334, 620 345" fill="none" stroke="#14665d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="300" y="354" font-size="20" fill="#14665d" text-anchor="start"><tspan x="300" dy="0">T_g（定性）</tspan></text>
<text x="160" y="330" font-size="20" fill="#53606d" text-anchor="start"><tspan x="160" dy="0">較低活動性</tspan></text>
<text x="423" y="168" font-size="20" fill="#1c2732" text-anchor="start"><tspan x="423" dy="0">T儲存 &gt; T_g 時</tspan><tspan x="423" dy="28">活動性可能增加</tspan></text>
<text x="32" y="458" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">T_g 依組成與量測條件而變，屬轉移區間。</tspan><tspan x="32" dy="25">低於 T_g 不代表所有化學反應都停止。</tspan></text>
<text x="688" y="502" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
