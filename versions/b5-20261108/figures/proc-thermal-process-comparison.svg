<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">熱處理、包裝與儲存要一起讀</title><desc id="desc">巴氏乳與 UHT 無菌包裝乳有不同控制目標與儲存前提；開封後條件改變，營養成分另需相符資料。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="520" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">熱處理、包裝與儲存要一起讀</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">以下為乳品的來源條件；營養指標另行比較</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><rect x="28" y="109" width="310" height="165" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="139" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">巴氏處理</text><text x="44" y="168" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">降低致病微生物危害</text><text x="44" y="193" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">不等同商業無菌</text><text x="44" y="218" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">來源乳品須冷藏</text><rect x="382" y="109" width="310" height="165" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="398" y="139" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">UHT＋無菌包裝</text><text x="398" y="168" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">商業無菌的其中一條路徑</text><text x="398" y="193" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">未開封：須完整包裝</text><text x="398" y="218" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">儲存依產品標示</text><line x1="537" y1="283" x2="537" y2="310" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="382" y="322" width="310" height="87" rx="14" fill="#ffffff" stroke="#14665d" stroke-width="2"/><text x="400" y="352" font-size="17" fill="#1c2732" text-anchor="start" font-weight="400">開封改變儲存前提</text><text x="400" y="380" font-size="17" fill="#1c2732" text-anchor="start" font-weight="400">須冷藏並按標示期間使用</text><rect x="28" y="302" width="310" height="107" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="46" y="334" font-size="17" fill="#1c2732" text-anchor="start" font-weight="400">營養比較另核對：</text><text x="46" y="363" font-size="17" fill="#1c2732" text-anchor="start" font-weight="400">成分、原料基準、觀測時點</text><text x="28" y="453" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">最高溫度不能排出所有營養素與風味的通用優劣。</text><text x="28" y="476" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">商業無菌也不等於任何條件下都沒有任何生命。</text><text x="692" y="504" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>