<svg xmlns="http://www.w3.org/2000/svg" width="290" height="262" viewBox="0 0 290 262" role="img" aria-label="α-D-吡喃葡萄糖的 Haworth 式：異頭碳 C1 的 OH 向下，和 C5 上的 CH2OH 在環的不同面。">
<rect width="290" height="262" fill="#ffffff"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif" font-size="17" fill="#1f2a30" stroke-linecap="round">
<polygon points="50,130 100,88 190,88 240,130 190,172 100,172" fill="none" stroke="#1f2a30" stroke-width="2" stroke-linejoin="round"/>
<line x1="190" y1="172" x2="100" y2="172" stroke="#1f2a30" stroke-width="5"/>
<text x="36" y="135" text-anchor="middle" font-size="12" fill="#6b7780">4</text>
<text x="114" y="82" text-anchor="middle" font-size="12" fill="#6b7780">5</text>
<rect x="180" y="76" width="20" height="24" fill="#ffffff"/><text x="190" y="94" text-anchor="middle">O</text>
<text x="254" y="135" text-anchor="middle" font-size="12" fill="#6b7780">1</text>
<text x="204" y="188" text-anchor="middle" font-size="12" fill="#6b7780">2</text>
<text x="86" y="188" text-anchor="middle" font-size="12" fill="#6b7780">3</text>
<line x1="100" y1="88" x2="100" y2="56" stroke="#1f2a30" stroke-width="2"/>
<text x="100" y="50" text-anchor="middle" fill="#1f2a30">CH<tspan dy="4" font-size="12">2</tspan><tspan dy="-4">OH</tspan></text>
<line x1="50" y1="130" x2="50" y2="162" stroke="#1f2a30" stroke-width="2"/>
<text x="50" y="181" text-anchor="middle" fill="#1f2a30">OH</text>
<line x1="100" y1="172" x2="100" y2="140" stroke="#1f2a30" stroke-width="2"/>
<text x="100" y="134" text-anchor="middle" fill="#1f2a30">OH</text>
<line x1="190" y1="172" x2="190" y2="204" stroke="#1f2a30" stroke-width="2"/>
<text x="190" y="223" text-anchor="middle" fill="#1f2a30">OH</text>
<line x1="240" y1="130" x2="240" y2="162" stroke="#b4532a" stroke-width="2.6"/>
<text x="240" y="181" text-anchor="middle" fill="#b4532a" font-weight="700">OH</text>
<text x="145" y="250" text-anchor="middle" font-size="13" fill="#b4532a">α：C1 的 OH 向下</text>
</g>
</svg>
