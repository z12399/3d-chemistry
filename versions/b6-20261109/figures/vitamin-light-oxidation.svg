<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">光與氧是兩個控制入口</title>
<desc id="figure-desc">核黃素吸光進入激發態，再把能量轉給氧形成單重態氧；遮光與阻氧分別控制不同入口，阻氧不移除起始溶氧。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="540" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">光與氧是兩個控制入口</tspan></text>
<rect x="32" y="106" width="131" height="64" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="97.5" y="145.0" font-size="23" fill="#1c2732" text-anchor="middle"><tspan x="97.5" dy="0">光 hν</tspan></text>
<path d="M 175 138 L 269 138" fill="none" stroke="#b8902a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gold)"/>
<text x="222" y="98" font-size="18" fill="#b8902a" text-anchor="middle"><tspan x="222" dy="0">遮光控制</tspan></text>
<rect x="282" y="106" width="169" height="64" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="366.5" y="145.0" font-size="23" fill="#1c2732" text-anchor="middle"><tspan x="366.5" dy="0">RF → RF*</tspan></text>
<rect x="32" y="248" width="131" height="64" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="97.5" y="287.0" font-size="23" fill="#1c2732" text-anchor="middle"><tspan x="97.5" dy="0">³O₂</tspan></text>
<path d="M 175 280 L 269 280" fill="none" stroke="#6f8fb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="222" y="240" font-size="18" fill="#6f8fb5" text-anchor="middle"><tspan x="222" dy="0">阻氧控制</tspan></text>
<rect x="282" y="248" width="169" height="64" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="366.5" y="287.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="366.5" dy="0">氧接受能量</tspan></text>
<path d="M 366 182 L 366 234" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="386" y="212" font-size="18" fill="#b4692e" text-anchor="start"><tspan x="386" dy="0">RF* 能量轉移</tspan></text>
<path d="M 463 280 L 511 280" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="524" y="231" width="164" height="98" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="606.0" y="273.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="606.0" dy="0">RF 再生</tspan><tspan x="606.0" dy="28">＋ ¹O₂</tspan></text>
<path d="M 606 341 L 606 374" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="499" y="387" width="189" height="58" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="593.5" y="423.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="593.5" dy="0">感光氧化</tspan></text>
<text x="32" y="479" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">阻氧不會自動除去原有溶氧；</tspan><tspan x="32" dy="25">RF 可降解；剩餘量不代表全部氧化累積。</tspan></text>
<text x="688" y="522" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
