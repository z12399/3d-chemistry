<text x="32" y="490" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">相同 pH 不足以指定持水性。</tspan><tspan x="32" dy="25">持水性測值本身不能辨認全部連接鍵型。</tspan></text>
<text x="688" y="542" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
