<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">平均停留時間不是最快通過時間</title>
<desc id="figure-desc">連續流動中停留時間有分布：層流管中心流速為平均流速的兩倍，最快的流體只停留平均時間的一半；熱處理要以最快通過的部分為準，而不是平均停留時間。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="520" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">平均停留時間不是最快通過時間</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">理想充分發展圓管層流：指定平均 τ = 2 min</tspan></text>
<rect x="32" y="125" width="136" height="112" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="100.0" y="174.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="100.0" dy="0">入口</tspan><tspan x="100.0" dy="28">被動示蹤</tspan></text>
<rect x="232" y="125" width="270" height="112" rx="4" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<path d="M 242 141 L 492 141" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 242 221 L 492 221" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 256 162 L 340 162" fill="none" stroke="#6f8fb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M 256 181 L 476 181" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 256 201 L 340 201" fill="none" stroke="#6f8fb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="367" y="275" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="367" dy="0">中心較快，近壁較慢</tspan></text>
<rect x="566" y="125" width="122" height="112" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="627.0" y="174.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="627.0" dy="0">出口</tspan><tspan x="627.0" dy="28">收集訊號</tspan></text>
<path d="M 176 181 L 222 181" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<path d="M 510 181 L 556 181" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="32" y="318" width="200" height="94" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="132.0" y="358.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="132.0" dy="0">最快邊界</tspan><tspan x="132.0" dy="28">τ/2 = 1 min</tspan></text>
<rect x="260" y="318" width="200" height="94" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="358.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">完整平均</tspan><tspan x="360.0" dy="28">τ = 2 min</tspan></text>
<rect x="488" y="318" width="200" height="94" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="588.0" y="358.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="588.0" dy="0">截止前收集</tspan><tspan x="588.0" dy="28">仍可能漏掉長尾</tspan></text>
<text x="32" y="457" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">有限觀察窗的條件平均 ≠ 完整平均。</tspan><tspan x="32" dy="25">流動示蹤本身不能證明殺菌充分。</tspan></text>
<text x="688" y="502" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
