<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">烯二醇分支：羰基建在哪裡？</title>
<desc id="figure-desc">鹼性下葡萄糖經共同平面中間態，C2 重建羰基得果糖；恢復 C1 醛基並從 C2 兩側補氫，可得葡萄糖或甘露糖。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="490" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">烯二醇分支：羰基建在哪裡？</tspan></text>
<rect x="32" y="205" width="170" height="100" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="117.0" y="248.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="117.0" dy="0">葡萄糖</tspan><tspan x="117.0" dy="28">C1 醛基</tspan></text>
<rect x="267" y="205" width="180" height="100" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="357.0" y="248.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="357.0" dy="0">1,2-烯二醇</tspan><tspan x="357.0" dy="28">平面中間態</tspan></text>
<path d="M 206 255 L 259 255" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="233" y="230" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="233" dy="0">鹼性</tspan></text>
<rect x="500" y="100" width="188" height="105" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="594.0" y="145.5" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="594.0" dy="0">果糖</tspan><tspan x="594.0" dy="28">C2 重建羰基</tspan></text>
<rect x="500" y="325" width="188" height="115" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="594.0" y="361.5" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="594.0" dy="0">葡萄糖／甘露糖</tspan><tspan x="594.0" dy="28">恢復 C1 醛基</tspan><tspan x="594.0" dy="28">C2 從兩側補 H</tspan></text>
<path d="M 451 235 L 475 235 L 475 155 L 492 155" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 451 277 L 475 277 L 475 380 L 492 380" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="32" y="472" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">O1 留在 C1、O2 留在 C2；不是氧沿碳鏈搬家。</tspan></text>
<text x="688" y="472" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
