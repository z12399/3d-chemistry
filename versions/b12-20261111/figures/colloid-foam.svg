<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">泡沫：界面保護與排液並存</title>
<desc id="figure-desc">左圖放大氣泡的蛋白質界面保護層；右圖表示泡沫中液體向下排流。起泡量與長期穩定性需要分別判斷。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="500" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">泡沫：界面保護與排液並存</tspan></text>
<text x="182" y="120" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="182" dy="0">氣液界面形成保護層</tspan></text>
<circle cx="182" cy="250" r="85" fill="#e7f1ee" stroke="#14665d" stroke-width="5"/>
<circle cx="182" cy="250" r="76" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/>
<text x="182" y="258" font-size="24" fill="#1c2732" text-anchor="middle"><tspan x="182" dy="0">空氣</tspan></text>
<text x="182" y="378" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="182" dy="0">蛋白質吸附並重新排列</tspan></text>
<path d="M 182 350 L 182 339" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="404" y="145" width="250" height="242" rx="8" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="529" y="120" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="529" dy="0">液體仍會排流</tspan></text>
<rect x="417" y="344" width="224" height="29" rx="5" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<circle cx="447" cy="189" r="24" fill="#ffffff" stroke="#14665d" stroke-width="3"/>
<circle cx="506" cy="191" r="29" fill="#ffffff" stroke="#14665d" stroke-width="3"/>
<circle cx="580" cy="190" r="35" fill="#ffffff" stroke="#14665d" stroke-width="3"/>
<circle cx="463" cy="255" r="33" fill="#ffffff" stroke="#14665d" stroke-width="3"/>
<circle cx="541" cy="262" r="36" fill="#ffffff" stroke="#14665d" stroke-width="3"/>
<circle cx="610" cy="273" r="22" fill="#ffffff" stroke="#14665d" stroke-width="3"/>
<path d="M 432 282 L 432 335" fill="none" stroke="#6f8fb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M 591 309 L 591 335" fill="none" stroke="#6f8fb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="529" y="329" font-size="18" fill="#6f8fb5" text-anchor="middle"><tspan x="529" dy="0">排液</tspan></text>
<text x="32" y="430" font-size="24" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">起泡量高 ≠ 久放後最穩</tspan></text>
<text x="32" y="467" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">泡沫還可能發生氣體擴散與破泡。</tspan></text>
<text x="688" y="482" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
