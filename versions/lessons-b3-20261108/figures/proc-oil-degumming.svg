<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">脫膠：水合與金屬結合要分開看</title>
<desc id="figure-desc">可水合磷脂與部分金屬結合磷脂經不同處理後，再藉膠質或吸附相分離離開油相。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="520" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">脫膠：水合與金屬結合要分開看</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">加水不保證去除所有磷脂</tspan></text>
<text x="121" y="123" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="121" dy="0">油中磷脂</tspan></text>
<rect x="35" y="147" width="175" height="70" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="122.5" y="175.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="122.5" dy="0">可水合</tspan><tspan x="122.5" dy="28">磷脂</tspan></text>
<path d="M 215 182 L 260 182" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="270" y="147" width="190" height="70" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="365.0" y="189.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="365.0" dy="0">加水水合</tspan></text>
<rect x="35" y="282" width="175" height="85" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="122.5" y="317.5" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="122.5" dy="0">部分與鈣、鎂</tspan><tspan x="122.5" dy="28">結合的磷脂</tspan></text>
<path d="M 215 324 L 260 324" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="270" y="265" width="190" height="115" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="365.0" y="301.5" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="365.0" dy="0">酸處理調整結合</tspan><tspan x="365.0" dy="28">後續水合</tspan><tspan x="365.0" dy="28">或吸附</tspan></text>
<path d="M 465 182 L 519 209" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 465 322 L 519 290" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="530" y="150" width="155" height="200" rx="20" fill="#ffffff" stroke="#14665d" stroke-width="2"/>
<rect x="540" y="161" width="135" height="90" rx="10" fill="#e7f1ee" stroke="#e7f1ee" stroke-width="2"/>
<text x="607" y="210" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="607" dy="0">油相</tspan></text>
<path d="M 540 261 L 675 261" fill="none" stroke="#dfe4e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="607" y="293" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="607" dy="0">膠質或</tspan><tspan x="607" dy="29">吸附相</tspan></text>
<text x="607" y="382" font-size="22" fill="#14665d" text-anchor="middle"><tspan x="607" dy="0">再分離</tspan></text>
<text x="360" y="418" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">磷總量 ＝ 油質量 × 磷濃度</tspan><tspan x="360" dy="28">前後比較才知道去除多少</tspan></text>
<text x="32" y="477" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">磷量不等於全部膠質量；分離也可能夾帶油。</tspan><tspan x="32" dy="25">酸脫膠不等於脫除游離脂肪酸。</tspan></text>
<text x="688" y="502" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
