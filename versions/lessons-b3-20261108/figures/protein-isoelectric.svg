<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">等電點：淨電荷與聚集</title>
<desc id="figure-desc">比較低於、接近與高於等電點的平均淨電荷及聚集傾向。接近等電點仍保有帶電基團。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="460" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">等電點：淨電荷與聚集</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">pH 改變可解離基團，進而改變平均淨電荷</tspan></text>
<rect x="32" y="108" width="192" height="245" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="128" y="142" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="128" dy="0">pH &lt; pI</tspan></text>
<rect x="264" y="108" width="192" height="245" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="360" y="142" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">pH ≈ pI</tspan></text>
<rect x="496" y="108" width="192" height="245" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="592" y="142" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="592" dy="0">pH &gt; pI</tspan></text>
<circle cx="83" cy="214" r="27" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="83" y="220" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="83" dy="0">+</tspan></text>
<circle cx="83" cy="280" r="27" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="83" y="286" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="83" dy="0">+</tspan></text>
<circle cx="173" cy="214" r="27" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="173" y="220" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="173" dy="0">+</tspan></text>
<circle cx="173" cy="280" r="27" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="173" y="286" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="173" dy="0">+</tspan></text>
<circle cx="547" cy="214" r="27" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="547" y="220" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="547" dy="0">−</tspan></text>
<circle cx="547" cy="280" r="27" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="547" y="286" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="547" dy="0">−</tspan></text>
<circle cx="637" cy="214" r="27" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="637" y="220" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="637" dy="0">−</tspan></text>
<circle cx="637" cy="280" r="27" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="637" y="286" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="637" dy="0">−</tspan></text>
<circle cx="332" cy="218" r="27" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="332" y="224" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="332" dy="0">+ −</tspan></text>
<circle cx="388" cy="218" r="27" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="388" y="224" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="388" dy="0">+ −</tspan></text>
<circle cx="332" cy="274" r="27" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="332" y="280" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="332" dy="0">+ −</tspan></text>
<circle cx="388" cy="274" r="27" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="388" y="280" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="388" dy="0">+ −</tspan></text>
<text x="128" y="329" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="128" dy="0">偏正、排斥較強</tspan></text>
<text x="360" y="329" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">淨電荷近零、易聚集</tspan></text>
<text x="592" y="329" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="592" dy="0">偏負、排斥較強</tspan></text>
<text x="32" y="390" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">pI 不等於所有基團都中性。</tspan><tspan x="32" dy="25">聚集程度仍受鹽與蛋白結構影響。</tspan></text>
<text x="688" y="442" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
