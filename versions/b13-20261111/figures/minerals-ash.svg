<text x="32" y="451" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">灰分不能分辨鈣、鐵等個別含量；</tspan><tspan x="32" dy="25">化學形態與生體可利用性需要其他分析。</tspan></text>
