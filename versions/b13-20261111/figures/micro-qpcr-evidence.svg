<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">qPCR：訊號經校準才到模板量</title>
<desc id="figure-desc">qPCR 追蹤目標核酸的擴增訊號。在適用判讀範圍內，同目標、同方法、共同效率、閾值與訊號比例下，模板較多可較早達到 Cq；適用校準可估每反應起始模板量。Cq／拷貝量不直接等於原食品活菌數，先增菌後更不能直接回推。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="530" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">qPCR：訊號經校準才到模板量</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">Cq 是達指定判讀條件的循環位置</tspan></text>
<rect x="32" y="135" width="140" height="112" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="102.0" y="184.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="102.0" dy="0">引子界定</tspan><tspan x="102.0" dy="28">目標序列</tspan></text>
<rect x="204" y="135" width="140" height="112" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="274.0" y="184.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="274.0" dy="0">循環擴增</tspan><tspan x="274.0" dy="28">追蹤螢光</tspan></text>
<rect x="376" y="135" width="140" height="112" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="446.0" y="184.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="446.0" dy="0">達到閾值</tspan><tspan x="446.0" dy="28">讀取 Cq</tspan></text>
<rect x="548" y="135" width="140" height="112" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="618.0" y="184.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="618.0" dy="0">適用校準</tspan><tspan x="618.0" dy="28">估起始模板</tspan></text>
<path d="M 180 191 L 196 191" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<path d="M 352 191 L 368 191" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<path d="M 524 191 L 540 191" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="45" y="315" width="250" height="93" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="170.0" y="354.5" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="170.0" dy="0">起始模板較多</tspan><tspan x="170.0" dy="28">同方法與共同效率</tspan></text>
<rect x="425" y="315" width="250" height="93" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="550.0" y="354.5" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="550.0" dy="0">較早達同一閾值</tspan><tspan x="550.0" dy="28">Cq 較小</tspan></text>
<path d="M 305 361 L 415 361" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="173" y="445" width="374" height="51" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="477.5" font-size="24" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">模板量 ≠ 原食品活菌數</tspan></text>
<text x="32" y="518" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">定量仍需校準範圍、抑制、回收與不確定度。</tspan></text>
<text x="688" y="512" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
