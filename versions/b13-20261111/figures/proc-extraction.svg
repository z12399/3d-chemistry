<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">萃取量與萃取液濃度分開看</title>
<desc id="figure-desc">萃取利用成分在兩相間的分配：回收率表示取出了多少，萃取液濃度還取決於溶劑用量；質量衡算檢查收支，相平衡（分配係數）決定兩相組成。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="530" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">萃取量與萃取液濃度分開看</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">兩相收支要守恆，組成還取決於相平衡</tspan></text>
<rect x="32" y="130" width="162" height="80" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="113.0" y="163.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="113.0" dy="0">進料 F</tspan><tspan x="113.0" dy="28">含目標成分</tspan></text>
<rect x="32" y="285" width="162" height="80" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="113.0" y="318.0" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="113.0" dy="0">溶劑 S</tspan><tspan x="113.0" dy="28">不含目標成分</tspan></text>
<rect x="285" y="198" width="150" height="100" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="241.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">兩相接觸</tspan><tspan x="360.0" dy="28">成分分配</tspan></text>
<rect x="526" y="130" width="162" height="80" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="607.0" y="163.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="607.0" dy="0">萃取相 E</tspan><tspan x="607.0" dy="28">濃度 yA</tspan></text>
<rect x="526" y="285" width="162" height="80" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="607.0" y="318.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="607.0" dy="0">殘餘相 R</tspan><tspan x="607.0" dy="28">濃度 xA</tspan></text>
<path d="M 204 170 L 240 170 L 240 225 L 275 225" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 204 325 L 240 325 L 240 272 L 275 272" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 445 225 L 480 225 L 480 170 L 516 170" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 445 272 L 480 272 L 480 325 L 516 325" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="32" y="405" width="300" height="74" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="182.0" y="435.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="182.0" dy="0">目標取出總量</tspan><tspan x="182.0" dy="28">E × yA</tspan></text>
<rect x="388" y="405" width="300" height="74" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="538.0" y="435.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="538.0" dy="0">萃取液濃度</tspan><tspan x="538.0" dy="28">取出總量 ÷ E</tspan></text>
<text x="32" y="510" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">回收率要對照進料；濃度高不等於取出多。</tspan></text>
<text x="688" y="512" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
