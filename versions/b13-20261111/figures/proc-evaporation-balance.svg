<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">雙效蒸發：逐效記質量與焓</title>
<desc id="figure-desc">蒸發器設計先以質量與焓的衡算求出外供蒸汽量，再以 Q＝U·A·ΔT 求傳熱面積；總蒸發量由固形物守恆決定，外供蒸汽量則要逐效做能量衡算。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="600" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">雙效蒸發：逐效記質量與焓</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">第一效蒸出的水，在第二效加熱側凝結供熱</tspan></text>
<rect x="145" y="175" width="180" height="190" rx="14" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<rect x="440" y="175" width="180" height="190" rx="14" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="235" y="232" font-size="25" fill="#1c2732" text-anchor="middle"><tspan x="235" dy="0">第一效</tspan><tspan x="235" dy="35">較熱</tspan></text>
<text x="530" y="232" font-size="25" fill="#1c2732" text-anchor="middle"><tspan x="530" dy="0">第二效</tspan><tspan x="530" dy="35">較冷</tspan></text>
<path d="M 32 215 L 135 215" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="34" y="192" font-size="18" fill="#b4692e" text-anchor="start"><tspan x="34" dy="0">外供蒸汽 S</tspan></text>
<path d="M 32 315 L 135 315" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="40" y="292" font-size="19" fill="#1c2732" text-anchor="start"><tspan x="40" dy="0">進料 F</tspan></text>
<path d="M 335 315 L 430 315" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="382" y="293" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="382" dy="0">熱液 L₁</tspan></text>
<path d="M 630 315 L 692 315" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="662" y="354" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="662" dy="0">產品 P</tspan></text>
<path d="M 235 165 L 235 125 L 530 125 L 530 165" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="382" y="104" font-size="20" fill="#b4692e" text-anchor="middle"><tspan x="382" dy="0">第一效蒸氣 V₁：再用來供熱</tspan></text>
<path d="M 630 205 L 692 205" fill="none" stroke="#6f8fb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="663" y="153" font-size="18" fill="#6f8fb5" text-anchor="middle"><tspan x="663" dy="0">蒸發水</tspan><tspan x="663" dy="24">V₂</tspan></text>
<path d="M 235 375 L 235 416" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<path d="M 530 375 L 530 416" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="235" y="446" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="235" dy="0">外供蒸汽凝結水</tspan></text>
<text x="530" y="446" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="530" dy="0">V₁ 凝結水</tspan></text>
<rect x="32" y="477" width="300" height="74" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="182.0" y="507.0" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="182.0" dy="0">固形物守恆 → 總蒸發水</tspan><tspan x="182.0" dy="28">逐效能量帳 → 外供蒸汽</tspan></text>
<rect x="388" y="477" width="300" height="74" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="538.0" y="507.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="538.0" dy="0">先解 Q，再求面積</tspan><tspan x="538.0" dy="28">A = Q / (U × ΔT)</tspan></text>
<text x="32" y="580" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">液流降溫也供熱；雙效不等於固定省一半蒸汽。</tspan></text>
<text x="688" y="582" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
