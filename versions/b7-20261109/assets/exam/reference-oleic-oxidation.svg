<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
<title id="title">油酸的cis雙鍵與氧化位置集合</title><desc id="desc">油酸的C9=C10雙鍵兩端碳鏈位於同側，氫位於另一側；單重態氧代表產物9與10位，自由基代表產物8、9、10、11位，非等量斷言。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18745f"/></marker></defs>
<rect width="640" height="640" fill="white"/><g font-family="Arial,Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="28" y="38" font-size="24" fill="#1c3335" text-anchor="start" font-weight="700">以油酸 18:1(9Z) 為代表假設</text><text x="28" y="68" font-size="17" fill="#566966" text-anchor="start" font-weight="400">由羧基碳 C1 開始編號；圖中鏈的長度不按比例。</text><rect x="28" y="91" width="584" height="246" rx="14" fill="#f1f6f2" stroke="#d9e4dc"/><text x="80" y="146" font-size="21" fill="#1c3335" text-anchor="middle" font-weight="400">HOOC−(CH₂)₇</text><text x="545" y="146" font-size="21" fill="#1c3335" text-anchor="middle" font-weight="400">(CH₂)₇−CH₃</text><text x="230" y="227" font-size="22" fill="#1c3335" text-anchor="middle" font-weight="600">C9</text><text x="410" y="227" font-size="22" fill="#1c3335" text-anchor="middle" font-weight="600">C10</text><line x1="247" y1="213" x2="385" y2="213" stroke="#243c3c" stroke-width="2"/><line x1="247" y1="226" x2="385" y2="226" stroke="#243c3c" stroke-width="2"/><line x1="210" y1="204" x2="151" y2="155" stroke="#243c3c" stroke-width="2"/><line x1="433" y1="204" x2="487" y2="155" stroke="#243c3c" stroke-width="2"/><line x1="210" y1="235" x2="168" y2="288" stroke="#243c3c" stroke-width="2"/><line x1="433" y1="235" x2="476" y2="288" stroke="#243c3c" stroke-width="2"/><text x="150" y="311" font-size="20" fill="#1c3335" text-anchor="middle" font-weight="400">H</text><text x="490" y="311" font-size="20" fill="#1c3335" text-anchor="middle" font-weight="400">H</text><text x="319" y="279" font-size="18" fill="#18745f" text-anchor="middle" font-weight="400">cis / Z</text><text x="28" y="376" font-size="22" fill="#1c3335" text-anchor="start" font-weight="600">主要 ROOH 位置提供反應途徑線索</text><rect x="28" y="396" width="584" height="78" rx="14" fill="#f1f6f2" stroke="#d9e4dc"/><text x="48" y="427" font-size="20" fill="#1c3335" text-anchor="start" font-weight="600">單重態氧途徑</text><text x="48" y="455" font-size="18" fill="#1c3335" text-anchor="start" font-weight="400">此 Δ9 代表物：主要可形成 9-ROOH、10-ROOH</text><rect x="28" y="490" width="584" height="90" rx="14" fill="#f1f6f2" stroke="#d9e4dc"/><text x="48" y="521" font-size="20" fill="#1c3335" text-anchor="start" font-weight="600">自由基途徑</text><text x="48" y="549" font-size="18" fill="#1c3335" text-anchor="start" font-weight="400">C8 / C11 抽氫與離域 → 8、9、10、11 位 ROOH</text><text x="28" y="614" font-size="16" fill="#566966" text-anchor="start" font-weight="400">位置分布較廣 ≠ 四個位置等量；兩個位置也不足以唯一鑑定。</text></g></svg>
