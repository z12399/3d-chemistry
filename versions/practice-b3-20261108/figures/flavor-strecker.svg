<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 475" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">Strecker：側鏈留下，羧基碳離開</title>
<desc id="figure-desc">胺基酸與活性二羰基物經多步轉化形成醛，側鏈保留，羧基碳以二氧化碳離開。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="475" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">Strecker：側鏈留下，羧基碳離開</tspan></text>
<rect x="32" y="121" width="250" height="92" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="157.0" y="160.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="157.0" dy="0">胺基酸</tspan><tspan x="157.0" dy="28">R–CH(NH₂)–COOH</tspan></text>
<rect x="32" y="275" width="250" height="70" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="157.0" y="317.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="157.0" dy="0">活性二羰基物</tspan></text>
<path d="M 289 167 L 331 228" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 289 310 L 331 270" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="339" y="210" width="139" height="78" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="408.5" y="256.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="408.5" dy="0">多步轉化</tspan></text>
<path d="M 486 235 L 524 187" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 486 270 L 524 315" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<rect x="532" y="140" width="156" height="94" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="610.0" y="180.0" font-size="23" fill="#1c2732" text-anchor="middle"><tspan x="610.0" dy="0">R–CHO</tspan><tspan x="610.0" dy="28">香氣醛</tspan></text>
<rect x="532" y="279" width="156" height="78" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="610.0" y="311.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="610.0" dy="0">CO₂</tspan><tspan x="610.0" dy="28">羧基碳離開</tspan></text>
<rect x="65" y="391" width="590" height="44" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="420.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">側鏈 R 保留 → 醛比原胺基酸少一個碳</tspan></text>
<text x="688" y="457" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
