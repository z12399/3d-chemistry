<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">冷媒循環搬走食品的熱</title>
<desc id="figure-desc">冷媒依序經過蒸發器、壓縮機、冷凝器與節流閥；食品側吸熱、壓縮機輸入功、冷凝器向高溫端排熱。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="500" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">冷媒循環搬走食品的熱</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">食品結冰與冷媒吸熱汽化，是不同過程</tspan></text>
<rect x="57" y="181" width="224" height="84" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="169.0" y="216.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="169.0" dy="0">蒸發器</tspan><tspan x="169.0" dy="28">低壓冷媒吸熱汽化</tspan></text>
<rect x="438" y="181" width="224" height="84" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="550.0" y="216.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="550.0" dy="0">壓縮機</tspan><tspan x="550.0" dy="28">升壓</tspan></text>
<rect x="438" y="347" width="224" height="84" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="550.0" y="382.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="550.0" dy="0">冷凝器</tspan><tspan x="550.0" dy="28">放熱、冷媒液化</tspan></text>
<rect x="57" y="347" width="224" height="84" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="169.0" y="382.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="169.0" dy="0">節流閥</tspan><tspan x="169.0" dy="28">降壓</tspan></text>
<path d="M 295 224 L 424 224" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="359" y="207" font-size="18" fill="#14665d" text-anchor="middle"><tspan x="359" dy="0">低壓蒸氣</tspan></text>
<path d="M 550 279 L 550 333" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="571" y="309" font-size="18" fill="#b4692e" text-anchor="start"><tspan x="571" dy="0">高壓蒸氣</tspan></text>
<path d="M 424 390 L 295 390" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="359" y="373" font-size="18" fill="#14665d" text-anchor="middle"><tspan x="359" dy="0">高壓液體</tspan></text>
<path d="M 168 333 L 168 279" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="193" y="309" font-size="18" fill="#14665d" text-anchor="start"><tspan x="193" dy="0">低壓液氣</tspan></text>
<text x="168" y="114" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="168" dy="0">食品／低溫端</tspan></text>
<path d="M 168 127 L 168 168" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="192" y="153" font-size="19" fill="#b4692e" text-anchor="start"><tspan x="192" dy="0">熱</tspan></text>
<text x="550" y="114" font-size="19" fill="#b4692e" text-anchor="middle"><tspan x="550" dy="0">功輸入</tspan></text>
<path d="M 550 127 L 550 168" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<path d="M 550 443 L 550 478" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="526" y="469" font-size="18" fill="#b4692e" text-anchor="end"><tspan x="526" dy="0">熱 → 高溫端</tspan></text>
<text x="688" y="482" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
