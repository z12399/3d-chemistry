<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">油脂：口感與氣味有不同來源</title>
<desc id="figure-desc">分開純淨 TAG 的口感、含短鏈脂醯基之脂質水解釋出的短鏈游離酸，以及氧化後醛酮；本圖的酯鍵水解不表示剪短脂肪酸碳鏈。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="500" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">油脂：口感與氣味有不同來源</tspan></text>
<rect x="32" y="105" width="210" height="80" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="137.0" y="138.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="137.0" dy="0">純淨 TAG</tspan><tspan x="137.0" dy="28">氣味通常很弱</tspan></text>
<path d="M 250 145 L 425 145" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="437" y="105" width="251" height="80" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="562.5" y="138.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="562.5" dy="0">潤滑、包覆、熔化</tspan><tspan x="562.5" dy="28">口感</tspan></text>
<rect x="32" y="235" width="160" height="80" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="112.0" y="268.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="112.0" dy="0">含短鏈脂醯基</tspan><tspan x="112.0" dy="28">脂質的酯鍵水解</tspan></text>
<path d="M 200 275 L 270 275" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="282" y="235" width="220" height="80" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="392.0" y="268.0" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="392.0" dy="0">短鏈游離脂肪酸</tspan><tspan x="392.0" dy="28">例如丁酸</tspan></text>
<path d="M 510 275 L 555 275" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="568" y="235" width="120" height="80" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="628.0" y="282.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="628.0" dy="0">氣味</tspan></text>
<rect x="32" y="365" width="160" height="80" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="112.0" y="412.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="112.0" dy="0">脂質氧化</tspan></text>
<path d="M 200 405 L 270 405" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="282" y="365" width="150" height="80" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="357.0" y="412.0" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="357.0" dy="0">氫過氧化物</tspan></text>
<path d="M 440 405 L 495 405" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="507" y="365" width="181" height="80" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="597.5" y="398.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="597.5" dy="0">部分醛、酮</tspan><tspan x="597.5" dy="28">揮發香氣</tspan></text>
<text x="32" y="477" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">香氣亦可來自微量揮發物；氣味不能單獨確診。</tspan></text>
<text x="688" y="482" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
