<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">先分製程角色，再比較揮發物訊號</title><desc id="desc">製麴時產生酵素，加鹽液後水解與耐鹽菌及酵母代謝可並行；研究比較須固定化合物與萃取法。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="520" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">先分製程角色，再比較揮發物訊號</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">水解、代謝與分離，是不同作用</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><rect x="28" y="111" width="191" height="105" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="141" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">製麴</text><text x="44" y="170" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">麴菌生長</text><text x="44" y="195" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">產生酵素</text><line x1="229" y1="162" x2="276" y2="162" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><text x="252" y="131" font-size="16" fill="#14665d" text-anchor="middle" font-weight="400">加鹽液</text><rect x="288" y="101" width="404" height="197" rx="14" fill="#f6f7f8" stroke="#14665d" stroke-width="2"/><text x="309" y="132" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">鹽液醪：可並行的作用</text><rect x="309" y="154" width="171" height="111" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="325" y="184" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">酵素水解</text><text x="325" y="213" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">原料組分水解</text><rect x="501" y="154" width="170" height="111" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="517" y="184" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">耐鹽菌／酵母</text><text x="517" y="213" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">微生物代謝</text><line x1="28" y1="325" x2="692" y2="325" stroke="#dfe4e8" stroke-width="2"/><text x="28" y="356" font-size="18" fill="#1c2732" text-anchor="start" font-weight="400">本研究：大豆製麴後，四個接種條件的刊載比較</text><rect x="28" y="377" width="142" height="53" rx="9" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="99" y="410" font-size="18" fill="#14665d" text-anchor="middle" font-weight="700">NT</text><rect x="202" y="377" width="142" height="53" rx="9" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="273" y="410" font-size="18" fill="#14665d" text-anchor="middle" font-weight="700">LA</text><rect x="376" y="377" width="142" height="53" rx="9" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="447" y="410" font-size="18" fill="#14665d" text-anchor="middle" font-weight="700">YE</text><rect x="550" y="377" width="142" height="53" rx="9" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="621" y="410" font-size="18" fill="#14665d" text-anchor="middle" font-weight="700">LY</text><text x="28" y="453" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">固定同一化合物與萃取法；NT 是未額外接種，不是無菌。</text><text x="28" y="476" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">相對峰面積較高，不能直接推成更好喝或減鹽更安全。</text><text x="692" y="504" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>