<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">先算原樣代表量，再合併菌落數</title><desc id="desc">原樣等效濃度、稀釋比例及接種體積共同決定每盤代表的原樣量，合併菌落數後除以總代表量。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="510" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">先算原樣代表量，再合併菌落數</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">相同平板大小，不代表相同的原樣份量</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><rect x="28" y="105" width="180" height="120" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="135" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">原樣等效濃度</text><text x="44" y="164" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">c₀：g/mL</text><text x="44" y="189" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">稀釋比例 dᵢ</text><text x="44" y="214" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">記錄體積 Vᵢ</text><line x1="217" y1="166" x2="262" y2="166" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><circle cx="333" cy="161" r="49" fill="#ffffff" stroke="#14665d" stroke-width="2"/><text x="333" y="168" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">平板 i</text><text x="333" y="237" font-size="18" fill="#14665d" text-anchor="middle" font-weight="400">菌落數 nᵢ</text><line x1="390" y1="166" x2="444" y2="166" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="458" y="105" width="234" height="120" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="474" y="135" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">原樣代表量</text><text x="474" y="164" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">mᵢ＝c₀dᵢVᵢ</text><text x="474" y="189" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">mᵢ 單位：g</text><rect x="28" y="270" width="664" height="77" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="360" y="317" font-size="20" fill="#14665d" text-anchor="middle" font-weight="700">合併：M＝Σmᵢ；濃度估算 Ĉ＝Σnᵢ／M</text><rect x="28" y="375" width="312" height="70" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="405" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">零菌落：只描述所測份量</text><rect x="380" y="375" width="312" height="70" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="396" y="405" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">1／M：一個 CFU 的換算刻度</text><text x="28" y="478" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">不能等權平均各盤濃度；1／M 不能直接稱為方法檢出限。</text><text x="692" y="494" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>