<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">溫度敏感度由活化能決定</title>
<desc id="figure-desc">以兩條定性曲線比較不同活化能的相對溫度敏感度，而非絕對速率高低。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="440" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">溫度敏感度由活化能決定</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">不同反應升溫後，不一定加快相同倍數</tspan></text>
<text x="62" y="116" font-size="18" fill="#53606d" text-anchor="start"><tspan x="62" dy="0">k 的相對變化</tspan></text>
<path d="M 83 316 L 83 137" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<path d="M 83 316 L 647 316" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<text x="646" y="345" font-size="18" fill="#53606d" text-anchor="end"><tspan x="646" dy="0">溫度 T（定性）</tspan></text>
<path d="M 100 303 C 220 301 310 278 400 237 C 500 194 560 152 612 121" fill="none" stroke="#b4692e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 100 303 C 250 301 410 287 612 250" fill="none" stroke="#14665d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 178 140 L 214 140" fill="none" stroke="#b4692e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="228" y="146" font-size="20" fill="#b4692e" text-anchor="start"><tspan x="228" dy="0">較高 Ea：較敏感</tspan></text>
<path d="M 178 178 L 214 178" fill="none" stroke="#14665d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="228" y="184" font-size="20" fill="#14665d" text-anchor="start"><tspan x="228" dy="0">較低 Ea：較不敏感</tspan></text>
<rect x="110" y="365" width="500" height="46" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="395.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">k = A exp(−Ea / RT)</tspan></text>
<text x="688" y="422" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
