<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">同殺菌值，品質保留仍可不同</title>
<desc id="figure-desc">本課假想單一一階品質模型與微生物模型採同一參考溫度；理想定溫且 zq 大於 z 時，相同微生物 Fref 下高溫短時的品質作用量較小。此圖不是所有品質參數與設備的通則。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="520" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">同殺菌值，品質保留仍可不同</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">教學定溫比較：z = 10°C、zq = 30°C</tspan></text>
<rect x="175" y="108" width="370" height="56" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="143.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">相同微生物 F90</tspan></text>
<path d="M 260 164 L 260 192 L 190 192 L 190 214" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 460 164 L 460 192 L 530 192 L 530 214" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="40" y="225" width="290" height="195" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="185" y="263" font-size="24" fill="#1c2732" text-anchor="middle"><tspan x="185" dy="0">80°C・20 min</tspan></text>
<text x="185" y="300" font-size="22" fill="#14665d" text-anchor="middle"><tspan x="185" dy="0">約 34.3% 保留</tspan></text>
<rect x="75" y="338" width="220" height="34" rx="3" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/>
<rect x="75" y="338" width="75.46000000000001" height="34" rx="3" fill="#14665d" stroke="#14665d" stroke-width="2"/>
<text x="185" y="400" font-size="18" fill="#53606d" text-anchor="middle"><tspan x="185" dy="0">假想品質模型</tspan></text>
<rect x="390" y="225" width="290" height="195" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="535" y="263" font-size="24" fill="#1c2732" text-anchor="middle"><tspan x="535" dy="0">90°C・2 min</tspan></text>
<text x="535" y="300" font-size="22" fill="#14665d" text-anchor="middle"><tspan x="535" dy="0">約 79.4% 保留</tspan></text>
<rect x="425" y="338" width="220" height="34" rx="3" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/>
<rect x="425" y="338" width="174.68" height="34" rx="3" fill="#14665d" stroke="#14665d" stroke-width="2"/>
<text x="535" y="400" font-size="18" fill="#53606d" text-anchor="middle"><tspan x="535" dy="0">假想品質模型</tspan></text>
<text x="32" y="460" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">zq 較大時，高溫短時可減少品質損失。</tspan><tspan x="32" dy="25">此比較不是所有品質成分與設備的通則。</tspan></text>
<text x="688" y="502" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
