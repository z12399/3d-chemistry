<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">同一份水，分母不同</title>
<desc id="figure-desc">同一批果肉的水及乾物質構成，分別對應濕基與乾基分母；只移除水時乾物質保持不變。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="470" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">同一份水，分母不同</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">課文例：80 kg 果肉＝60 kg 水＋20 kg 乾物質</tspan></text>
<rect x="50" y="120" width="250" height="96" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<rect x="50" y="120" width="187.5" height="96" rx="0" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<rect x="237.5" y="120" width="62.5" height="96" rx="0" fill="#b8902a" stroke="#b8902a" stroke-width="2"/>
<text x="144" y="162" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="144" dy="0">水</tspan><tspan x="144" dy="28">60 kg</tspan></text>
<text x="269" y="157" font-size="17" fill="#1c2732" text-anchor="middle"><tspan x="269" dy="0">乾物</tspan><tspan x="269" dy="26">20 kg</tspan></text>
<path d="M 50 232 L 50 244 L 300 244 L 300 232" fill="none" stroke="#53606d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="175" y="277" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="175" dy="0">濕料總量 80 kg</tspan></text>
<rect x="356" y="115" width="315" height="74" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="513.5" y="145.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="513.5" dy="0">濕基：水 ÷ 濕料總重</tspan><tspan x="513.5" dy="28">60 ÷ 80＝75%</tspan></text>
<rect x="356" y="213" width="315" height="74" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="513.5" y="243.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="513.5" dy="0">乾基：水 ÷ 乾物質</tspan><tspan x="513.5" dy="28">60 ÷ 20＝3 kg/kg</tspan></text>
<rect x="48" y="328" width="180" height="64" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="138.0" y="367.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="138.0" dy="0">乾物質</tspan></text>
<path d="M 248 359 L 448 359" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="348" y="335" font-size="19" fill="#14665d" text-anchor="middle"><tspan x="348" dy="0">只移除水</tspan></text>
<rect x="468" y="328" width="200" height="64" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="568.0" y="367.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="568.0" dy="0">乾物質不變</tspan></text>
<text x="32" y="432" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">乾基可大於 100%；前後比較先固定分母</tspan></text>
<text x="688" y="452" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
