<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">仍有釋氨訊號，來源還不能命名</title><desc id="desc">主發酵前已建立不同菌株，發酵取樣後分別量測容器氣相釋氨與食品尿素庫存，不能由殘餘訊號命名新途徑。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="540" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">仍有釋氨訊號，來源還不能命名</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">菌株失活差異在主發酵前已建立</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><rect x="28" y="108" width="210" height="85" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="138" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">親本／介入菌株</text><text x="44" y="167" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">不是同一樣品的即時開關</text><line x1="248" y1="150" x2="289" y2="150" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="302" y="108" width="167" height="85" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="318" y="138" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">發酵與取樣</text><text x="318" y="167" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">保留各組起始狀態</text><line x1="479" y1="150" x2="520" y2="150" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="533" y="108" width="159" height="85" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="549" y="138" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">取樣後分析</text><path d="M 611 202 L 611 225 L 186 225 L 186 253" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><path d="M 611 225 L 533 225 L 533 253" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="266" width="312" height="114" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="296" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">指定容器中釋出氣體</text><text x="44" y="325" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">量測：氣相氨訊號</text><text x="44" y="350" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">不是完整氮收支</text><rect x="380" y="266" width="312" height="114" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="396" y="296" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">食品樣品萃取分析</text><text x="396" y="325" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">量測：尿素庫存</text><text x="396" y="350" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">保留起始量差異</text><text x="360" y="325" font-size="28" fill="#b4692e" text-anchor="middle" font-weight="400">≠</text><rect x="28" y="407" width="664" height="67" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="360" y="448" font-size="17" fill="#1c2732" text-anchor="middle" font-weight="400">仍測到釋氨 → 修訂原解釋；尚未辨認剩餘訊號來源</text><text x="28" y="509" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">末端尿素差不能直接當消耗量；殘餘氨不能直接證明第三途徑。</text><text x="692" y="524" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>