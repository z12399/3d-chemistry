<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">熱分布與熱穿透，量測位置不同</title><desc id="desc">左圖觀測設備裝載的熱分布；右圖觀測指定食品內部的熱穿透，另核對參數、校正及產品條件。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="510" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">熱分布與熱穿透，量測位置不同</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">公式正確，仍需現場傳熱與量測證據</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><text x="47" y="117" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">設備與裝載：熱分布</text><rect x="48" y="142" width="268" height="180" rx="22" fill="#f6f7f8" stroke="#14665d" stroke-width="2"/><rect x="76" y="163" width="48" height="54" rx="5" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><circle cx="100" cy="190" r="5" fill="#6f8fb5" stroke="#6f8fb5" stroke-width="2"/><rect x="76" y="239" width="48" height="54" rx="5" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><circle cx="100" cy="266" r="5" fill="#6f8fb5" stroke="#6f8fb5" stroke-width="2"/><rect x="146" y="163" width="48" height="54" rx="5" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><circle cx="170" cy="190" r="5" fill="#6f8fb5" stroke="#6f8fb5" stroke-width="2"/><rect x="146" y="239" width="48" height="54" rx="5" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><circle cx="170" cy="266" r="5" fill="#6f8fb5" stroke="#6f8fb5" stroke-width="2"/><rect x="216" y="163" width="48" height="54" rx="5" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><circle cx="240" cy="190" r="5" fill="#6f8fb5" stroke="#6f8fb5" stroke-width="2"/><rect x="216" y="239" width="48" height="54" rx="5" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><circle cx="240" cy="266" r="5" fill="#6f8fb5" stroke="#6f8fb5" stroke-width="2"/><text x="182" y="348" font-size="16" fill="#53606d" text-anchor="middle" font-weight="400">檢查裝載中的供熱情形</text><text x="388" y="117" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">食品內部：熱穿透</text><rect x="396" y="154" width="240" height="151" rx="28" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/><circle cx="516" cy="230" r="8" fill="#b4692e" stroke="#b4692e" stroke-width="2"/><line x1="516" y1="230" x2="650" y2="230" stroke="#b4692e" stroke-width="2"/><text x="398" y="338" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">追蹤指定食品與容器內部</text><text x="398" y="362" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">保留測點位置與時間紀錄</text><line x1="360" y1="110" x2="360" y2="365" stroke="#dfe4e8" stroke-width="2"/><rect x="28" y="389" width="205" height="66" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="419" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">參數來源</text><rect x="258" y="389" width="204" height="66" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="274" y="419" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">感測器校正</text><rect x="487" y="389" width="205" height="66" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="503" y="419" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">產品與配置條件</text><text x="28" y="484" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">黏度、粒徑、填充或配置改變，須重查證據適用範圍。</text><text x="692" y="494" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>