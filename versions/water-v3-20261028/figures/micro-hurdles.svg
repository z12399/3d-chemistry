<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">多個限制共同影響微生物</title>
<desc id="figure-desc">pH、水活性、溫度、氣體及防腐劑以多條箭頭共同指向生長受抑，並保留抑制不等於殺滅的界線。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="470" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">多個限制共同影響微生物</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">同一個讀值，不能代表完整食品環境</tspan></text>
<rect x="32" y="112" width="154" height="65" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="109.0" y="151.5" font-size="23" fill="#1c2732" text-anchor="middle"><tspan x="109.0" dy="0">pH</tspan></text>
<rect x="283" y="112" width="154" height="65" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="151.5" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">水活性 aw</tspan></text>
<rect x="534" y="112" width="154" height="65" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="611.0" y="151.5" font-size="23" fill="#1c2732" text-anchor="middle"><tspan x="611.0" dy="0">溫度</tspan></text>
<rect x="32" y="279" width="154" height="65" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="109.0" y="318.5" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="109.0" dy="0">氧氣／氣體</tspan></text>
<rect x="534" y="279" width="154" height="65" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="611.0" y="318.5" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="611.0" dy="0">防腐劑</tspan></text>
<rect x="251" y="258" width="218" height="101" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="301.5" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">共同作用</tspan><tspan x="360.0" dy="28">可抑制生長</tspan></text>
<path d="M 175 190 L 262 244" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 360 191 L 360 243" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 545 190 L 458 244" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 200 311 L 237 311" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 520 311 L 484 311" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="91" y="398" width="538" height="44" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="427.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">抑制生長 ≠ 已殺滅或毒素已失活</tspan></text>
<text x="688" y="452" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
