<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">局部熱歷程，決定局部累積作用</title><desc id="desc">在本課平板模型中，表面與中心各有不同熱歷程，必須分別積分得到局部作用與品質響應。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="500" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">局部熱歷程，決定局部累積作用</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">只限本課的對稱、單調加熱平板模型</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><rect x="43" y="122" width="168" height="230" rx="5" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/><line x1="127" y1="122" x2="127" y2="352" stroke="#6f8fb5" stroke-width="2" stroke-dasharray="6 5"/><circle cx="205" cy="169" r="6" fill="#b4692e" stroke="#b4692e" stroke-width="2"/><circle cx="127" cy="280" r="6" fill="#6f8fb5" stroke="#6f8fb5" stroke-width="2"/><text x="127" y="383" font-size="16" fill="#53606d" text-anchor="middle" font-weight="400">平板截面</text><path d="M 214 169 L 270 169" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><path d="M 136 280 L 270 280" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="282" y="119" width="168" height="99" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="298" y="149" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">表面 T(x,t)</text><text x="298" y="178" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">升溫較快</text><rect x="282" y="233" width="168" height="99" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="298" y="263" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">中心 T(x,t)</text><text x="298" y="292" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">本模型中較冷</text><line x1="458" y1="168" x2="500" y2="168" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><line x1="458" y1="280" x2="500" y2="280" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="513" y="119" width="179" height="99" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="529" y="149" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">分別積分</text><text x="529" y="178" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">作用與品質損失</text><text x="529" y="203" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">可累積較多</text><rect x="513" y="233" width="179" height="99" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="529" y="263" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">分別積分</text><text x="529" y="292" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">局部累積作用</text><text x="529" y="317" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">較小</text><rect x="282" y="356" width="410" height="65" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="487" y="395" font-size="17" fill="#1c2732" text-anchor="middle" font-weight="400">局部 F 與局部 Q ≠ 整板平均品質</text><text x="28" y="433" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">品質響應為教學假想；不是實測營養素或安全判定。</text><text x="28" y="456" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">整板平均還需要各位置品質及其質量權重。</text><text x="692" y="484" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>