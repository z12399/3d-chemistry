<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">污染路徑：減少與再引入分開查</title>
<desc id="figure-desc">實線呈現製程順序，虛線呈現原料、環境或人員經接觸面到已處理食品的待查路徑。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="520" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">污染路徑：減少與再引入分開查</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">箭頭中的污染路徑是待查假設</tspan></text>
<rect x="35" y="130" width="215" height="75" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="142.5" y="160.5" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="142.5" dy="0">原料／環境</tspan><tspan x="142.5" dy="28">／人員</tspan></text>
<path d="M 263 167 L 341 167" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow-orange)"/>
<rect x="355" y="130" width="180" height="75" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="445.0" y="174.5" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="445.0" dy="0">接觸面</tspan></text>
<path d="M 537 168 L 602 168 L 602 269" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow-orange)"/>
<text x="616" y="238" font-size="19" fill="#b4692e" text-anchor="start"><tspan x="616" dy="0">待查路徑</tspan></text>
<rect x="35" y="285" width="170" height="80" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="120.0" y="318.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="120.0" dy="0">處理前</tspan><tspan x="120.0" dy="28">食品</tspan></text>
<path d="M 215 325 L 262 325" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="275" y="285" width="170" height="80" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="332.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">前段處理</tspan></text>
<path d="M 455 325 L 502 325" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="515" y="285" width="170" height="80" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="600.0" y="318.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="600.0" dy="0">已處理食品</tspan><tspan x="600.0" dy="28">後續接觸／包裝</tspan></text>
<text x="360" y="404" font-size="19" fill="#14665d" text-anchor="middle"><tspan x="360" dy="0">實線：製程順序</tspan></text>
<text x="360" y="434" font-size="20" fill="#b4692e" text-anchor="middle"><tspan x="360" dy="0">虛線：待查路徑，未證明來源或方向</tspan></text>
<text x="32" y="475" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">末端陽性不能單獨指出污染源。</tspan><tspan x="32" dy="25">沒有觀察到增殖，也不代表沒有轉移。</tspan></text>
<text x="688" y="502" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
