<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">分層、成團、融合：看的是不同事</title>
<desc id="figure-desc">乳析改變液滴位置；絮凝成團但保有每滴界面；聚結使接觸界面消失並融合，需用粒徑與顯微觀察判斷。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="490" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">分層、成團、融合：看的是不同事</tspan></text>
<rect x="32" y="96" width="192" height="279" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="128" y="133" font-size="24" fill="#1c2732" text-anchor="middle"><tspan x="128" dy="0">乳析</tspan></text>
<rect x="51" y="154" width="154" height="189" rx="6" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/>
<rect x="264" y="96" width="192" height="279" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="360" y="133" font-size="24" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">絮凝</tspan></text>
<rect x="283" y="154" width="154" height="189" rx="6" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/>
<rect x="496" y="96" width="192" height="279" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="592" y="133" font-size="24" fill="#1c2732" text-anchor="middle"><tspan x="592" dy="0">聚結</tspan></text>
<rect x="515" y="154" width="154" height="189" rx="6" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/>
<circle cx="83" cy="181" r="19" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="165" cy="184" r="19" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="126" cy="228" r="19" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="83" cy="306" r="19" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<path d="M 170 302 L 170 251" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<circle cx="336" cy="218" r="24" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="384" cy="218" r="24" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="360" cy="260" r="24" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="408" cy="260" r="24" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="567" cy="193" r="23" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="617" cy="193" r="23" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<path d="M 592 228 L 592 249" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<circle cx="592" cy="299" r="34" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="128" y="404" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="128" dy="0">位置重新分布</tspan><tspan x="128" dy="27">液滴不必變大</tspan></text>
<text x="360" y="404" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">液滴成團</tspan><tspan x="360" dy="27">個別界面仍在</tspan></text>
<text x="592" y="404" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="592" dy="0">接觸界面消失</tspan><tspan x="592" dy="27">液滴融合</tspan></text>
<text x="32" y="470" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">分層外觀不足；還需粒徑與顯微觀察。</tspan></text>
<text x="688" y="472" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
