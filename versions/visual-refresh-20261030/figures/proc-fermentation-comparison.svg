<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">兩個 100%，可能沒有共同分母</title><desc id="desc">液體培養與固體基質培養各自除以本系列最大值，兩個 100% 不代表相同絕對活性。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="510" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">兩個 100%，可能沒有共同分母</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">原料、接種、回收與檢定條件都影響可比性</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><rect x="63" y="123" width="210" height="125" rx="18" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/><path d="M 80 191 Q 125 181 169 191 T 255 191" fill="none" stroke="#6f8fb5" stroke-width="2"/><text x="168" y="155" font-size="18" fill="#14665d" text-anchor="middle" font-weight="700">液體培養</text><rect x="447" y="123" width="210" height="125" rx="18" fill="#f6f7f8" stroke="#14665d" stroke-width="2"/><circle cx="473" cy="211" r="9" fill="#ffffff" stroke="#b8902a" stroke-width="2"/><circle cx="515" cy="192" r="9" fill="#ffffff" stroke="#b8902a" stroke-width="2"/><circle cx="553" cy="215" r="9" fill="#ffffff" stroke="#b8902a" stroke-width="2"/><circle cx="598" cy="192" r="9" fill="#ffffff" stroke="#b8902a" stroke-width="2"/><circle cx="632" cy="216" r="9" fill="#ffffff" stroke="#b8902a" stroke-width="2"/><text x="552" y="155" font-size="18" fill="#14665d" text-anchor="middle" font-weight="700">固體基質培養</text><line x1="168" y1="258" x2="168" y2="288" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><line x1="552" y1="258" x2="552" y2="288" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="299" width="280" height="87" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="168" y="332" font-size="16" fill="#1c2732" text-anchor="middle" font-weight="400">本系列活性／本系列最大值</text><text x="168" y="359" font-size="16" fill="#1c2732" text-anchor="middle" font-weight="400">本系列最高值＝100%</text><rect x="412" y="299" width="280" height="87" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="552" y="332" font-size="16" fill="#1c2732" text-anchor="middle" font-weight="400">本系列活性／本系列最大值</text><text x="552" y="359" font-size="16" fill="#1c2732" text-anchor="middle" font-weight="400">本系列最高值＝100%</text><text x="360" y="344" font-size="28" fill="#b4692e" text-anchor="middle" font-weight="400">？</text><text x="360" y="411" font-size="17" fill="#1c2732" text-anchor="middle" font-weight="400">不能據此判定絕對活性或產量相同</text><text x="28" y="443" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">U 是指定 assay 下的活性，並非槽內反應速率。</text><text x="28" y="466" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">新設計的相同條件是計畫，結果仍須實際量測。</text><text x="692" y="494" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>