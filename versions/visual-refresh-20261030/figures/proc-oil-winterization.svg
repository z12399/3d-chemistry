<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">冬化以結晶做物理分離</title>
<desc id="figure-desc">冬化：把油冷卻，使蠟或高熔點成分結晶，再過濾分離，使油在低溫下保持澄清；它是物理分離，不是氫化。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="520" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">冬化以結晶做物理分離</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">冷卻 → 蠟或較高熔點成分結晶 → 固液分離</tspan></text>
<rect x="32" y="125" width="150" height="120" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="107.0" y="178.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="107.0" dy="0">原油</tspan><tspan x="107.0" dy="28">可結晶成分</tspan></text>
<rect x="267" y="125" width="186" height="200" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="360" y="159" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">冷卻後形成晶體</tspan></text>
<path d="M 312 193 L 327 207 L 312 221 L 297 207 Z" fill="#e7f1ee" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 375 241 L 390 255 L 375 269 L 360 255 Z" fill="#e7f1ee" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 405 187 L 420 201 L 405 215 L 390 201 Z" fill="#e7f1ee" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="360" y="302" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">晶體 ＋ 液態油</tspan></text>
<path d="M 190 185 L 257 185" fill="none" stroke="#6f8fb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="223" y="114" font-size="18" fill="#6f8fb5" text-anchor="middle"><tspan x="223" dy="0">冷卻</tspan></text>
<rect x="538" y="125" width="150" height="86" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="613.0" y="161.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="613.0" dy="0">液態油</tspan><tspan x="613.0" dy="28">低溫澄清</tspan></text>
<rect x="538" y="271" width="150" height="86" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="613.0" y="307.0" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="613.0" dy="0">固相物流</tspan><tspan x="613.0" dy="28">可夾帶液態油</tspan></text>
<path d="M 463 225 L 496 225 L 496 168 L 528 168" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 496 225 L 496 314 L 528 314" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<text x="500" y="397" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="500" dy="0">過濾分離</tspan></text>
<rect x="45" y="425" width="630" height="55" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="459.5" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">冬化不是氫化；澄清度與油回收率要一起看。</tspan></text>
<text x="688" y="502" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
