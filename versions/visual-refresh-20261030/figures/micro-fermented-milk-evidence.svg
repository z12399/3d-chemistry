<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">品質量測，還不能直接證明菌株互作</title><desc id="desc">實際三菌組合與配方連到冷藏品質的 pH、自然離水及持水性，圖中保留菌株別生長與代謝交換未量測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="510" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">品質量測，還不能直接證明菌株互作</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">先核對方法中實際使用的菌種</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><rect x="28" y="108" width="280" height="147" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="138" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">本研究菌種組合</text><text x="44" y="167" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">嗜熱鏈球菌</text><text x="44" y="192" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">嗜酸乳桿菌</text><text x="44" y="217" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">乳雙歧桿菌</text><rect x="28" y="280" width="280" height="66" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="310" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">配方與處理條件</text><path d="M 318 183 L 353 183 L 353 253 L 393 253" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><path d="M 318 313 L 353 313 L 353 253" fill="none" stroke="#14665d" stroke-width="2"/><rect x="406" y="181" width="286" height="141" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="422" y="211" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">冷藏期間品質端點</text><text x="422" y="240" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">pH</text><text x="422" y="265" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">自然離水</text><text x="422" y="290" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">持水性 WHC</text><rect x="28" y="376" width="664" height="70" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="360" y="405" font-size="17" fill="#1c2732" text-anchor="middle" font-weight="400">表中未測各成員生長或代謝交換</text><text x="360" y="431" font-size="17" fill="#1c2732" text-anchor="middle" font-weight="400">方法未列保加利亞乳桿菌</text><text x="28" y="480" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">第 0 日為發酵完成後 24 h，不能當作發酵起點。</text><text x="692" y="494" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>