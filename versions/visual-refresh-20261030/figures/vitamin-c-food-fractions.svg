<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="vitamin-c-food-fractions-title vitamin-c-food-fractions-desc">
<title id="vitamin-c-food-fractions-title">AA 與 DHAA：先在同一基準相加</title>
<desc id="vitamin-c-food-fractions-desc">第1日與第9日各自的刊載 AA 及 DHAA 均值相加，得到推算總 C 濃度；再比較兩日的差值。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker></defs>
<rect width="720" height="100%" fill="#ffffff"/>
<g font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" fill="#1c2732" font-size="18">
<text x="32" y="36" font-size="20" fill="#1c2732" text-anchor="start" font-weight="600">AA 與 DHAA：先在同一基準相加</text>
<line x1="32" y1="54" x2="688" y2="54" stroke="#dfe4e8" stroke-width="2"/>
<rect x="32" y="83" width="304" height="243" rx="12" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="184" y="115" font-size="20" fill="#14665d" text-anchor="middle" font-weight="600">第 1 日</text>
<rect x="52" y="135" width="264" height="48" rx="12" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/>
<text x="184.0" y="165.0" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">刊載 AA 均值</text>
<text x="184" y="209" font-size="24" fill="#1c2732" text-anchor="middle" font-weight="400">＋</text>
<rect x="52" y="224" width="264" height="48" rx="12" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/>
<text x="184.0" y="254.0" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">刊載 DHAA 均值</text>
<text x="184" y="307" font-size="20" fill="#1c2732" text-anchor="middle" font-weight="400">推算總 C 濃度</text>
<rect x="384" y="83" width="304" height="243" rx="12" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="536" y="115" font-size="20" fill="#14665d" text-anchor="middle" font-weight="600">第 9 日</text>
<rect x="404" y="135" width="264" height="48" rx="12" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/>
<text x="536.0" y="165.0" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">刊載 AA 均值</text>
<text x="536" y="209" font-size="24" fill="#1c2732" text-anchor="middle" font-weight="400">＋</text>
<rect x="404" y="224" width="264" height="48" rx="12" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/>
<text x="536.0" y="254.0" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">刊載 DHAA 均值</text>
<text x="536" y="307" font-size="20" fill="#1c2732" text-anchor="middle" font-weight="400">推算總 C 濃度</text>
<text x="360" y="363" font-size="20" fill="#1c2732" text-anchor="middle" font-weight="400">變化量 ＝ 第 9 日均值和 − 第 1 日均值和</text>
<rect x="32" y="398" width="656" height="68" rx="12" fill="#e7f1ee" stroke="#e7f1ee" stroke-width="2"/>
<text x="46" y="424" font-size="16" fill="#14665d" text-anchor="start" font-weight="400">單位 mg/g 鮮重；沿原研究 L-AA 校正基準。</text>
<text x="46" y="449" font-size="16" fill="#14665d" text-anchor="start" font-weight="400">均值和不是獨立量測、每袋總量或顯著性檢定。</text>
<text x="680" y="487" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text>
</g>
</svg>