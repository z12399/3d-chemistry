<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="glycoside-title glycoside-desc">
  <title id="glycoside-title">糖苷處理：四個要分開驗證的問題</title>
  <desc id="glycoside-desc">概念示意圖：以四張卡片區分槲皮素 O-糖苷的糖基形式、水解、進入與結合代謝、血漿量測。示意不連成必然吸收的箭頭；最後明示酸水解當量不同於游離槲皮素濃度。</desc>
  <style>
    text{font-family:'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif;fill:#1c2732;font-size:16px}
    .title{font-size:24px;font-weight:700}.heading{font-size:20px;font-weight:700}.muted{fill:#53606d}.teal{fill:#14665d}.white{fill:#fff}.bold{font-weight:700}.formula{font-size:20px}
    .card{fill:#fff;stroke:#dfe4e8;stroke-width:2}.divider{stroke:#dfe4e8;stroke-width:2}
  </style>
  <rect width="720" height="560" fill="#fff"/>
  <text x="28" y="36" class="title">糖苷處理：四個要分開驗證的問題</text>
  <text x="28" y="65" class="muted">以槲皮素 O-糖苷為例；編號是判讀順序，不是吸收保證。</text>

  <rect x="28" y="88" width="324" height="175" rx="13" class="card"/>
  <circle cx="55" cy="117" r="15" fill="#14665d"/>
  <text x="55" y="123" text-anchor="middle" class="white bold">1</text>
  <text x="80" y="124" class="heading">糖基形式</text>
  <rect x="48" y="146" width="66" height="35" rx="8" fill="#e7f1ee"/>
  <text x="81" y="170" text-anchor="middle" class="formula teal bold">Q</text>
  <line x1="114" y1="163" x2="143" y2="163" stroke="#14665d" stroke-width="2.5"/>
  <text x="154" y="170" text-anchor="middle" class="formula teal">O</text>
  <line x1="167" y1="163" x2="191" y2="163" stroke="#14665d" stroke-width="2.5"/>
  <rect x="192" y="146" width="118" height="35" rx="8" fill="#f6f7f8" stroke="#b8902a" stroke-width="2"/>
  <text x="251" y="170" text-anchor="middle" class="formula">糖基</text>
  <text x="48" y="210">核對糖種類、位置與鍵型</text>
  <text x="48" y="239" class="muted">Q：槲皮素母體；非完整結構圖</text>

  <rect x="368" y="88" width="324" height="175" rx="13" class="card"/>
  <circle cx="395" cy="117" r="15" fill="#14665d"/>
  <text x="395" y="123" text-anchor="middle" class="white bold">2</text>
  <text x="420" y="124" class="heading">水解</text>
  <text x="388" y="161">LPH：腸腔側；部分葡萄糖苷</text>
  <text x="388" y="190">rutin：部分菌相可去醣</text>
  <line x1="388" y1="208" x2="672" y2="208" class="divider"/>
  <text x="388" y="239" class="teal bold">鍵被切斷 ≠ 已穿過腸壁</text>

  <rect x="28" y="281" width="324" height="195" rx="13" class="card"/>
  <circle cx="55" cy="310" r="15" fill="#14665d"/>
  <text x="55" y="316" text-anchor="middle" class="white bold">3</text>
  <text x="80" y="317" class="heading">進入與結合代謝</text>
  <text x="48" y="353">去醣可釋出較疏水的苷元</text>
  <text x="48" y="382">作者提出：可被動擴散入胞</text>
  <line x1="48" y1="400" x2="332" y2="400" class="divider"/>
  <text x="48" y="428">入胞後可形成葡萄糖醛酸</text>
  <text x="48" y="456">與硫酸結合物</text>

  <rect x="368" y="281" width="324" height="195" rx="13" class="card"/>
  <circle cx="395" cy="310" r="15" fill="#14665d"/>
  <text x="395" y="316" text-anchor="middle" class="white bold">4</text>
  <text x="420" y="317" class="heading">量測定義</text>
  <text x="388" y="353">Hollman 研究的血漿先酸水解</text>
  <rect x="388" y="366" width="284" height="37" rx="8" fill="#e7f1ee"/>
  <text x="530" y="391" text-anchor="middle" class="teal bold">讀值：槲皮素當量</text>
  <text x="388" y="431">≠ 游離槲皮素濃度</text>
  <text x="388" y="458">≠ 完整糖苷濃度</text>

  <rect x="28" y="496" width="664" height="43" rx="10" fill="#f6f7f8"/>
  <text x="360" y="523" text-anchor="middle" class="bold">人體 AUC 須保留量測定義；相對暴露不等於絕對吸收率。</text>
</svg>
