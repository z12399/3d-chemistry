<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">維生素先看分布在哪個相</title>
<desc id="figure-desc">同一食材的水溶性維生素可轉移到烹調水，脂溶性維生素隨油脂分布與流失，物理轉移與化學轉化分開追蹤。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="500" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">維生素先看分布在哪個相</tspan></text>
<rect x="245" y="88" width="230" height="62" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="126.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">原料中的維生素</tspan></text>
<path d="M 360 162 L 360 182 L 177 182 L 177 207" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 360 182 L 543 182 L 543 207" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<rect x="32" y="220" width="290" height="163" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="177" y="254" font-size="23" fill="#14665d" text-anchor="middle"><tspan x="177" dy="0">水相</tspan></text>
<circle cx="115" cy="315" r="34" fill="#ffffff" stroke="#14665d" stroke-width="2"/>
<text x="115" y="322" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="115" dy="0">B 群</tspan></text>
<circle cx="237" cy="315" r="34" fill="#ffffff" stroke="#14665d" stroke-width="2"/>
<text x="237" y="322" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="237" dy="0">C</tspan></text>
<rect x="398" y="220" width="290" height="163" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="543" y="254" font-size="23" fill="#b4692e" text-anchor="middle"><tspan x="543" dy="0">油脂相</tspan></text>
<circle cx="445" cy="315" r="24" fill="#ffffff" stroke="#b4692e" stroke-width="2"/>
<text x="445" y="322" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="445" dy="0">A</tspan></text>
<circle cx="510" cy="315" r="24" fill="#ffffff" stroke="#b4692e" stroke-width="2"/>
<text x="510" y="322" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="510" dy="0">D</tspan></text>
<circle cx="575" cy="315" r="24" fill="#ffffff" stroke="#b4692e" stroke-width="2"/>
<text x="575" y="322" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="575" dy="0">E</tspan></text>
<circle cx="640" cy="315" r="24" fill="#ffffff" stroke="#b4692e" stroke-width="2"/>
<text x="640" y="322" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="640" dy="0">K</tspan></text>
<path d="M 177 395 L 177 426" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 543 395 L 543 426" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="177" y="456" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="177" dy="0">可隨烹調水流出</tspan></text>
<text x="543" y="456" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="543" dy="0">可隨油脂流出</tspan></text>
<text x="32" y="484" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">轉移到液相≠降解；食用與流出部分都要查。</tspan></text>
<text x="688" y="482" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
