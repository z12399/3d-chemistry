<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">逆滲透看膜面淨驅動力</title>
<desc id="figure-desc">逆滲透的水通量 J＝Lp（ΔP − Δπ）：施加壓差大於膜面兩側的滲透壓差時，水由濃側流向稀側；稀溶液的滲透壓 π＝cRT，在正向逆滲透且有溶質的固定film模型中，濃差極化使膜面濃度高於主體濃度。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="540" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">逆滲透看膜面淨驅動力</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">J = Lp（ΔP − πm）；此圖選 J &gt; 0 的情況</tspan></text>
<rect x="45" y="133" width="285" height="175" rx="6" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<rect x="390" y="133" width="285" height="175" rx="6" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<rect x="348" y="128" width="24" height="185" rx="2" fill="#ffffff" stroke="#14665d" stroke-width="2"/>
<text x="183" y="168" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="183" dy="0">濃側主體 Cb</tspan></text>
<text x="532" y="168" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="532" dy="0">純水側</tspan></text>
<circle cx="83" cy="222" r="6" fill="#b8902a" stroke="#b8902a" stroke-width="2"/>
<circle cx="128" cy="271" r="6" fill="#b8902a" stroke="#b8902a" stroke-width="2"/>
<circle cx="181" cy="221" r="6" fill="#b8902a" stroke="#b8902a" stroke-width="2"/>
<circle cx="240" cy="272" r="6" fill="#b8902a" stroke="#b8902a" stroke-width="2"/>
<circle cx="299" cy="209" r="6" fill="#b8902a" stroke="#b8902a" stroke-width="2"/>
<circle cx="307" cy="250" r="6" fill="#b8902a" stroke="#b8902a" stroke-width="2"/>
<path d="M 263 338 L 462 338" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="360" y="369" font-size="21" fill="#14665d" text-anchor="middle"><tspan x="360" dy="0">ΔP &gt; πm：水由濃側流向稀側</tspan></text>
<text x="360" y="112" font-size="18" fill="#14665d" text-anchor="middle"><tspan x="360" dy="0">膜</tspan></text>
<text x="532" y="236" font-size="27" fill="#1c2732" text-anchor="middle"><tspan x="532" dy="0">ΔP − πm</tspan></text>
<text x="183" y="112" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="183" dy="0">膜面 Cm &gt; Cb</tspan></text>
<rect x="45" y="410" width="630" height="68" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="437.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">正通量的濃差極化提高膜面滲透壓</tspan><tspan x="360.0" dy="28">因此有效驅動力變小</tspan></text>
<text x="32" y="513" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">ΔP &gt; 0 不保證逆滲透；要看 ΔP − πm。</tspan></text>
<text x="688" y="522" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
