<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">pH 改變弱酸形式</title>
<desc id="figure-desc">較低 pH 相對 pKa 時，未解離酸 HA 比例較高；HA 較易通過細胞膜，影響抑菌表現。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="460" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">pH 改變弱酸形式</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">比較相同總酸量的化學分布</tspan></text>
<rect x="32" y="111" width="185" height="118" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="124.5" y="163.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="124.5" dy="0">pH 較高</tspan><tspan x="124.5" dy="28">HA 比例較低</tspan></text>
<rect x="32" y="256" width="185" height="118" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="124.5" y="308.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="124.5" dy="0">pH 較低</tspan><tspan x="124.5" dy="28">HA 比例較高</tspan></text>
<path d="M 230 312 L 324 312" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="278" y="288" font-size="22" fill="#14665d" text-anchor="middle"><tspan x="278" dy="0">HA</tspan></text>
<rect x="344" y="112" width="18" height="263" rx="4" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<rect x="377" y="112" width="18" height="263" rx="4" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="369" y="101" font-size="18" fill="#53606d" text-anchor="middle"><tspan x="369" dy="0">細胞膜</tspan></text>
<path d="M 336 312 L 430 312" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="500" y="247" font-size="18" fill="#14665d" text-anchor="middle"><tspan x="500" dy="0">HA 較易通過</tspan></text>
<rect x="457" y="270" width="224" height="86" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="569.0" y="306.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="569.0" dy="0">影響微生物</tspan><tspan x="569.0" dy="28">抑菌表現</tspan></text>
<rect x="436" y="139" width="245" height="72" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="558.5" y="182.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="558.5" dy="0">HA ⇌ H⁺ ＋ A⁻</tspan></text>
<text x="32" y="411" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">酸的性質、菌種與基質也會影響效果</tspan></text>
<text x="688" y="442" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
