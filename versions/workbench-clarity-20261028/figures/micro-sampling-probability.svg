<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 475" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">全陰性仍可能漏掉污染</title>
<desc id="figure-desc">在每單位污染機率 p、樣品獨立且完美檢測的假設下，全陰性機率是 (1−p)^n；課文例比較抽 5 與 50 個單位。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="475" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">全陰性仍可能漏掉污染</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">前提：獨立單位、相同污染機率、完美檢測</tspan></text>
<text x="360" y="126" font-size="23" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">每個單位陰性的機率：1 − p</tspan></text>
<rect x="60" y="154" width="82" height="72" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="101" y="199" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="101" dy="0">陰性</tspan></text>
<text x="165" y="200" font-size="22" fill="#53606d" text-anchor="middle"><tspan x="165" dy="0">×</tspan></text>
<rect x="188" y="154" width="82" height="72" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="229" y="199" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="229" dy="0">陰性</tspan></text>
<text x="293" y="200" font-size="22" fill="#53606d" text-anchor="middle"><tspan x="293" dy="0">×</tspan></text>
<rect x="316" y="154" width="82" height="72" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="357" y="199" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="357" dy="0">陰性</tspan></text>
<text x="421" y="200" font-size="22" fill="#53606d" text-anchor="middle"><tspan x="421" dy="0">×</tspan></text>
<rect x="444" y="154" width="82" height="72" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="485" y="199" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="485" dy="0">陰性</tspan></text>
<text x="549" y="200" font-size="22" fill="#53606d" text-anchor="middle"><tspan x="549" dy="0">×</tspan></text>
<rect x="572" y="154" width="82" height="72" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="613" y="199" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="613" dy="0">陰性</tspan></text>
<rect x="108" y="256" width="504" height="56" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="291.0" font-size="23" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">P（全陰性 | p, n）＝(1 − p)ⁿ</tspan></text>
<text x="360" y="347" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">課文假想例：每單位污染機率 p＝2%</tspan></text>
<rect x="45" y="369" width="296" height="59" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="193.0" y="405.5" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="193.0" dy="0">抽 5 個：約 90.4% 全陰性</tspan></text>
<rect x="379" y="369" width="296" height="59" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="527.0" y="405.5" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="527.0" dy="0">抽 50 個：約 36.4% 全陰性</tspan></text>
<text x="32" y="454" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">全陰性不能反推出 p＝0</tspan></text>
<text x="688" y="457" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
