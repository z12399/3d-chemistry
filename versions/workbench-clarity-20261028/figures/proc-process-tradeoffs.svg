<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">先對齊終點，再比較製程</title><desc id="desc">兩條製程在同一系統邊界達到共同產品終點，再分開比較能源、時間產能與品質。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="470" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">先對齊終點，再比較製程</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">邊界不同，能耗比值就可能回答不同問題</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><rect x="28" y="105" width="664" height="204" rx="16" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2" stroke-dasharray="7 5"/><text x="48" y="134" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">共同系統邊界</text><rect x="48" y="166" width="147" height="111" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="64" y="196" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">同一原料</text><text x="64" y="225" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">共同產品目標</text><rect x="264" y="152" width="174" height="59" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="280" y="182" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">製程 A</text><rect x="264" y="232" width="174" height="59" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="280" y="262" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">製程 B</text><path d="M 202 221 L 232 221 L 232 182 L 254 182" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><path d="M 232 221 L 232 262 L 254 262" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="507" y="166" width="164" height="111" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="523" y="196" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">共同終點</text><text x="523" y="225" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">如相似含水量</text><path d="M 446 182 L 475 182 L 475 213 L 497 213" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><path d="M 446 262 L 475 262 L 475 231 L 497 231" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="334" width="205" height="76" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="364" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">能源效率</text><text x="44" y="393" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">SEC＝耗能／除水量</text><rect x="258" y="334" width="204" height="76" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="274" y="364" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">時間與產能</text><text x="274" y="393" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">設備占用另行比較</text><rect x="487" y="334" width="205" height="76" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="503" y="364" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">結構與香氣</text><text x="503" y="393" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">品質、復水性另測</text><text x="28" y="442" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">最低 SEC 只回答能源效率的一部分。</text><text x="692" y="454" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>