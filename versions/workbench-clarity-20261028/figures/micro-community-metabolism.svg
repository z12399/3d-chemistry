<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">互動影響代謝，比例另有分母</title>
<desc id="figure-desc">混合菌群中各成員會互相影響生長與代謝（如優格中嗜熱鏈球菌與保加利亞乳桿菌的互利共生）；相對豐度是比例，不等於絕對菌數或代謝活性。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="590" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">互動影響代謝，比例另有分母</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">優格菌互動是生物關係；相對豐度是組成計算</tspan></text>
<rect x="40" y="112" width="250" height="100" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="165.0" y="155.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="165.0" dy="0">嗜熱鏈球菌</tspan><tspan x="165.0" dy="28">生長與代謝</tspan></text>
<rect x="430" y="112" width="250" height="100" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="555.0" y="155.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="555.0" dy="0">保加利亞乳桿菌</tspan><tspan x="555.0" dy="28">生長與代謝</tspan></text>
<path d="M 300 142 L 420 142" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 420 185 L 300 185" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="360" y="248" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">互相影響，依菌株與環境而異</tspan></text>
<path d="M 32 276 L 688 276" fill="none" stroke="#dfe4e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="360" y="313" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">假想數量單位：A 減少，A 比例仍可上升</tspan></text>
<text x="185" y="355" font-size="24" fill="#1c2732" text-anchor="middle"><tspan x="185" dy="0">A 100 ＋ B 100</tspan></text>
<rect x="45" y="380" width="140.0" height="38" rx="0" fill="#14665d" stroke="#14665d" stroke-width="2"/>
<rect x="185.0" y="380" width="140.0" height="38" rx="0" fill="#6f8fb5" stroke="#6f8fb5" stroke-width="2"/>
<text x="185" y="457" font-size="25" fill="#14665d" text-anchor="middle"><tspan x="185" dy="0">A 占 50%</tspan></text>
<text x="535" y="355" font-size="24" fill="#1c2732" text-anchor="middle"><tspan x="535" dy="0">A 80 ＋ B 20</tspan></text>
<rect x="395" y="380" width="224.0" height="38" rx="0" fill="#14665d" stroke="#14665d" stroke-width="2"/>
<rect x="619.0" y="380" width="55.999999999999986" height="38" rx="0" fill="#6f8fb5" stroke="#6f8fb5" stroke-width="2"/>
<text x="535" y="457" font-size="25" fill="#14665d" text-anchor="middle"><tspan x="535" dy="0">A 占 80%</tspan></text>
<path d="M 337 399 L 383 399" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<circle cx="65" cy="500" r="7" fill="#14665d" stroke="#14665d" stroke-width="2"/>
<text x="82" y="507" font-size="20" fill="#1c2732" text-anchor="start"><tspan x="82" dy="0">A</tspan></text>
<circle cx="148" cy="500" r="7" fill="#6f8fb5" stroke="#6f8fb5" stroke-width="2"/>
<text x="165" y="507" font-size="20" fill="#1c2732" text-anchor="start"><tspan x="165" dy="0">B</tspan></text>
<text x="420" y="507" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="420" dy="0">pA = NA /（NA ＋ NB）</tspan></text>
<text x="32" y="564" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">占比上升不等於絕對量或代謝活性增加。</tspan></text>
<text x="688" y="572" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
