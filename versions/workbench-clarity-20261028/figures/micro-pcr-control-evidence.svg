<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">陰性之前，先問控制涵蓋哪一段</title><desc id="desc">取樣、萃取與 PCR 流程顯示萃取空白、無模板對照、外部陽性及萃取後內控各自檢查的範圍。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="520" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">陰性之前，先問控制涵蓋哪一段</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">本活動的內部擴增控制在萃取後加入</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><rect x="28" y="116" width="174" height="65" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="146" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">取樣</text><rect x="270" y="116" width="174" height="65" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="286" y="146" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">萃取</text><rect x="518" y="116" width="174" height="65" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="534" y="146" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">PCR 反應</text><line x1="211" y1="148" x2="260" y2="148" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><line x1="453" y1="148" x2="508" y2="148" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><path d="M 294 220 L 294 199 L 608 199 L 608 184" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="230" font-size="17" fill="#1c2732" text-anchor="start" font-weight="400">萃取空白：涵蓋前處理與擴增背景</text><line x1="28" y1="251" x2="692" y2="251" stroke="#dfe4e8" stroke-width="2"/><text x="28" y="283" font-size="17" fill="#14665d" text-anchor="start" font-weight="700">無模板對照</text><text x="28" y="327" font-size="17" fill="#14665d" text-anchor="start" font-weight="700">外部陽性控制</text><text x="28" y="371" font-size="17" fill="#14665d" text-anchor="start" font-weight="700">樣本內部控制</text><text x="240" y="283" font-size="17" fill="#1c2732" text-anchor="start" font-weight="400">檢查擴增背景或污染</text><text x="240" y="327" font-size="17" fill="#1c2732" text-anchor="start" font-weight="400">此次反應能否檢出目標</text><text x="240" y="371" font-size="17" fill="#1c2732" text-anchor="start" font-weight="400">監測該管擴增是否如預期</text><rect x="28" y="402" width="664" height="62" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="360" y="440" font-size="17" fill="#14665d" text-anchor="middle" font-weight="400">對照合格＋目標未檢出 → 有條件接受此萃取液未檢出</text><text x="28" y="491" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">萃取後內控不能證明取樣與萃取回收；雙陰性不自動有效。</text><text x="692" y="504" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>