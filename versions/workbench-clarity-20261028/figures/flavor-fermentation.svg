<text x="32" y="449" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">簡化主要產物；食品中仍有副產物與微生物生長。</tspan><tspan x="32" dy="25">不能由這些簡式涵蓋全部風味或安全條件。</tspan></text>
<text x="688" y="492" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
