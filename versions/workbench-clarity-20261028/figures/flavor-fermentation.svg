<rect x="500" y="230" width="188" height="60" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="594.0" y="267.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="594.0" dy="0">乙醇 ＋ CO₂</tspan></text>
<path d="M 198 375 L 242 375" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="250" y="345" width="180" height="60" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="340.0" y="382.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="340.0" dy="0">異型發酵</tspan></text>
