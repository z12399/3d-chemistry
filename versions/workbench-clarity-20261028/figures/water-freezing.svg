<text x="177" y="379" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="177" dy="0">溶質分散於溶液</tspan></text>
<text x="544" y="379" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="544" dy="0">溶質集中於未凍結相</tspan></text>
<text x="32" y="429" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">冷凍食品不會全部變成純冰。</tspan><tspan x="32" dy="25">符號與面積僅示意，不表示冰量或濃度數值。</tspan></text>
