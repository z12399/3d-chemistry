<svg xmlns="http://www.w3.org/2000/svg" width="290" height="262" viewBox="0 0 290 262" role="img" aria-label="β-D-呋喃果糖的 Haworth 式：五元環，異頭碳 C2 的 OH 向上，C2 另接一個 CH2OH（C1）向下。">
<rect width="290" height="262" fill="#ffffff"/>
<g font-family="'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif" font-size="17" fill="#1f2a30" stroke-linecap="round">
<polygon points="60,118 145,78 230,118 195,172 95,172" fill="none" stroke="#1f2a30" stroke-width="2" stroke-linejoin="round"/>
<line x1="195" y1="172" x2="95" y2="172" stroke="#1f2a30" stroke-width="5"/>
<text x="46" y="123" text-anchor="middle" font-size="12" fill="#6b7780">5</text>
<rect x="135" y="66" width="20" height="24" fill="#ffffff"/><text x="145" y="84" text-anchor="middle">O</text>
<text x="244" y="123" text-anchor="middle" font-size="12" fill="#6b7780">2</text>
<text x="209" y="188" text-anchor="middle" font-size="12" fill="#6b7780">3</text>
<text x="81" y="188" text-anchor="middle" font-size="12" fill="#6b7780">4</text>
<line x1="60" y1="118" x2="60" y2="86" stroke="#1f2a30" stroke-width="2"/>
<text x="60" y="80" text-anchor="middle" fill="#1f2a30">CH<tspan dy="4" font-size="12">2</tspan><tspan dy="-4">OH</tspan></text>
<line x1="230" y1="118" x2="230" y2="86" stroke="#b4532a" stroke-width="2.6"/>
<text x="230" y="80" text-anchor="middle" fill="#b4532a" font-weight="700">OH</text>
<line x1="230" y1="118" x2="230" y2="150" stroke="#1f2a30" stroke-width="2"/>
<text x="230" y="169" text-anchor="middle" fill="#1f2a30">CH<tspan dy="4" font-size="12">2</tspan><tspan dy="-4">OH</tspan></text>
<line x1="195" y1="172" x2="195" y2="140" stroke="#1f2a30" stroke-width="2"/>
<text x="195" y="134" text-anchor="middle" fill="#1f2a30">OH</text>
<line x1="95" y1="172" x2="95" y2="204" stroke="#1f2a30" stroke-width="2"/>
<text x="95" y="223" text-anchor="middle" fill="#1f2a30">OH</text>
<text x="145" y="250" text-anchor="middle" font-size="13" fill="#b4532a">五元環；異頭碳是 C2</text>
</g>
</svg>
