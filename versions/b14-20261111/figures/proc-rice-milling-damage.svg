<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">去殼、碾白與磨粉是不同層次</title><desc id="desc">稻穀經去殼成糙米、碾白成白米，再磨成米粉；粒徑、含水與澱粉損傷率為不同量測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="500" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">去殼、碾白與磨粉是不同層次</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">磨粉的粒徑、含水與損傷程度要分開量測</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><ellipse cx="87" cy="167" rx="40" ry="60" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/><ellipse cx="266" cy="167" rx="40" ry="60" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/><ellipse cx="445" cy="167" rx="40" ry="60" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/><ellipse cx="87" cy="167" rx="48" ry="70" fill="#ffffff" stroke="#b8902a" stroke-width="2"/><ellipse cx="87" cy="167" rx="35" ry="54" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/><ellipse cx="266" cy="167" rx="33" ry="51" fill="#ffffff" stroke="#b8902a" stroke-width="2"/><circle cx="601" cy="138" r="10" fill="#ffffff" stroke="#6f8fb5" stroke-width="2"/><circle cx="633" cy="135" r="10" fill="#ffffff" stroke="#6f8fb5" stroke-width="2"/><circle cx="653" cy="157" r="10" fill="#ffffff" stroke="#6f8fb5" stroke-width="2"/><circle cx="618" cy="165" r="10" fill="#ffffff" stroke="#6f8fb5" stroke-width="2"/><circle cx="600" cy="190" r="10" fill="#ffffff" stroke="#6f8fb5" stroke-width="2"/><circle cx="636" cy="197" r="10" fill="#ffffff" stroke="#6f8fb5" stroke-width="2"/><text x="87" y="267" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="700">稻穀</text><text x="266" y="267" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="700">糙米</text><text x="445" y="267" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="700">白米</text><text x="624" y="267" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="700">米粉</text><line x1="142" y1="166" x2="208" y2="166" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><text x="175.0" y="137" font-size="16" fill="#14665d" text-anchor="middle" font-weight="400">去殼</text><line x1="320" y1="166" x2="387" y2="166" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><text x="353.5" y="137" font-size="16" fill="#14665d" text-anchor="middle" font-weight="400">碾白</text><line x1="499" y1="166" x2="566" y2="166" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><text x="532.5" y="137" font-size="16" fill="#14665d" text-anchor="middle" font-weight="400">磨粉</text><line x1="28" y1="292" x2="692" y2="292" stroke="#dfe4e8" stroke-width="2"/><rect x="28" y="314" width="205" height="80" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="344" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">粒徑</text><text x="44" y="373" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">粉體尺寸</text><rect x="258" y="314" width="204" height="80" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="274" y="344" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">最終含水</text><text x="274" y="373" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">樣品水分</text><rect x="487" y="314" width="205" height="80" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="503" y="344" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">澱粉損傷率</text><text x="503" y="373" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">指定酵素測定</text><text x="28" y="433" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">帶水磨仍可有可測損傷；粉更細不代表澱粉更完整。</text><text x="28" y="456" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">浸泡有利只限所採流程，不能推成愈久永遠愈好。</text><text x="692" y="484" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>