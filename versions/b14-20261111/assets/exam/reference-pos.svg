<svg xmlns="http://www.w3.org/2000/svg" width="640" height="655" viewBox="0 0 640 655" role="img" aria-labelledby="title desc">
<title id="title">POS三酸甘油酯連接示意</title><desc id="desc">甘油三個羥基分別形成棕櫚酸酯、油酸酯及硬脂酸酯，油醯基在中間。各脂肪醯基碳數包含羰基碳，這是連接圖，不是立體投影或晶胞圖。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18745f"/></marker></defs>
<rect width="640" height="655" fill="white"/><g font-family="Arial,Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="28" y="38" font-size="24" fill="#1c3335" text-anchor="start" font-weight="700">POS：先分清分子連接與晶體排列</text><text x="28" y="69" font-size="18" fill="#566966" text-anchor="start" font-weight="400">P = 棕櫚醯基；O = 油醯基；S = 硬脂醯基</text><rect x="28" y="90" width="584" height="262" rx="14" fill="#f1f6f2" stroke="#d9e4dc"/><text x="127" y="146" font-size="24" fill="#1c3335" text-anchor="middle" font-weight="600">CH₂</text><line x1="153" y1="138" x2="199" y2="138" stroke="#243c3c" stroke-width="2"/><text x="218" y="146" font-size="23" fill="#1c3335" text-anchor="middle" font-weight="400">O</text><line x1="235" y1="138" x2="278" y2="138" stroke="#243c3c" stroke-width="2"/><text x="298" y="146" font-size="23" fill="#1c3335" text-anchor="middle" font-weight="400">C</text><line x1="315" y1="138" x2="353" y2="138" stroke="#243c3c" stroke-width="2"/><text x="377" y="146" font-size="24" fill="#18745f" text-anchor="middle" font-weight="600">R₁</text><line x1="292" y1="123" x2="292" y2="99" stroke="#243c3c" stroke-width="2"/><line x1="303" y1="123" x2="303" y2="99" stroke="#243c3c" stroke-width="2"/><text x="298" y="92" font-size="22" fill="#1c3335" text-anchor="middle" font-weight="400">O</text><text x="127" y="225" font-size="24" fill="#1c3335" text-anchor="middle" font-weight="600">CH</text><line x1="153" y1="217" x2="199" y2="217" stroke="#243c3c" stroke-width="2"/><text x="218" y="225" font-size="23" fill="#1c3335" text-anchor="middle" font-weight="400">O</text><line x1="235" y1="217" x2="278" y2="217" stroke="#243c3c" stroke-width="2"/><text x="298" y="225" font-size="23" fill="#1c3335" text-anchor="middle" font-weight="400">C</text><line x1="315" y1="217" x2="353" y2="217" stroke="#243c3c" stroke-width="2"/><text x="377" y="225" font-size="24" fill="#18745f" text-anchor="middle" font-weight="600">R₂</text><line x1="292" y1="202" x2="292" y2="178" stroke="#243c3c" stroke-width="2"/><line x1="303" y1="202" x2="303" y2="178" stroke="#243c3c" stroke-width="2"/><text x="298" y="171" font-size="22" fill="#1c3335" text-anchor="middle" font-weight="400">O</text><text x="127" y="304" font-size="24" fill="#1c3335" text-anchor="middle" font-weight="600">CH₂</text><line x1="153" y1="296" x2="199" y2="296" stroke="#243c3c" stroke-width="2"/><text x="218" y="304" font-size="23" fill="#1c3335" text-anchor="middle" font-weight="400">O</text><line x1="235" y1="296" x2="278" y2="296" stroke="#243c3c" stroke-width="2"/><text x="298" y="304" font-size="23" fill="#1c3335" text-anchor="middle" font-weight="400">C</text><line x1="315" y1="296" x2="353" y2="296" stroke="#243c3c" stroke-width="2"/><text x="377" y="304" font-size="24" fill="#18745f" text-anchor="middle" font-weight="600">R₃</text><line x1="292" y1="281" x2="292" y2="257" stroke="#243c3c" stroke-width="2"/><line x1="303" y1="281" x2="303" y2="257" stroke="#243c3c" stroke-width="2"/><text x="298" y="250" font-size="22" fill="#1c3335" text-anchor="middle" font-weight="400">O</text><line x1="127" y1="155" x2="127" y2="199" stroke="#243c3c" stroke-width="2"/><line x1="127" y1="234" x2="127" y2="278" stroke="#243c3c" stroke-width="2"/><text x="447" y="146" font-size="21" fill="#1c3335" text-anchor="start" font-weight="400">P：16:0</text><text x="447" y="225" font-size="18" fill="#1c3335" text-anchor="start" font-weight="400">O：18:1 cisΔ9</text><text x="447" y="304" font-size="21" fill="#1c3335" text-anchor="start" font-weight="400">S：18:0</text><text x="28" y="391" font-size="21" fill="#1c3335" text-anchor="start" font-weight="400">R₁ = (CH₂)₁₄−CH₃</text><text x="28" y="427" font-size="21" fill="#1c3335" text-anchor="start" font-weight="400">R₂ = (CH₂)₇−CH=CH−(CH₂)₇−CH₃</text><text x="28" y="461" font-size="18" fill="#18745f" text-anchor="start" font-weight="400">          油醯鏈雙鍵為 cis / Z</text><text x="28" y="497" font-size="21" fill="#1c3335" text-anchor="start" font-weight="400">R₃ = (CH₂)₁₆−CH₃</text><rect x="28" y="525" width="584" height="72" rx="14" fill="#f1f6f2" stroke="#d9e4dc"/><text x="48" y="554" font-size="18" fill="#1c3335" text-anchor="start" font-weight="400">三個 −O−C(=O)− 都是酯鍵；中間位置接 O。</text><text x="48" y="581" font-size="17" fill="#1c3335" text-anchor="start" font-weight="400">這張連接示意不指定 sn-1 / sn-3 的立體方向。</text><text x="28" y="629" font-size="17" fill="#566966" text-anchor="start" font-weight="400">晶型描述分子在晶體中的排列，須另用結晶證據判讀。</text></g></svg>
