<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">亞胺縮合：先加成，再脫水</title>
<desc id="figure-desc">胺氮加成到羰基，經 N 正氧負加成物與胺醇，再質子化羥基、脫水並去質子形成亞胺；兩階段的鍵階變化不同。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="540" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">亞胺縮合：先加成，再脫水</tspan></text>
<rect x="32" y="107" width="180" height="85" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="122.0" y="142.5" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="122.0" dy="0">羰基 ＋ 一級胺</tspan><tspan x="122.0" dy="28">C=O；N 有孤對</tspan></text>
<path d="M 223 150 L 264 150" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="244" y="98" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="244" dy="0">加成</tspan></text>
<rect x="275" y="107" width="170" height="85" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="142.5" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">加成物</tspan><tspan x="360.0" dy="28">N⁺／O⁻</tspan></text>
<path d="M 456 150 L 497 150" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="477" y="98" font-size="17" fill="#1c2732" text-anchor="middle"><tspan x="477" dy="0">質子轉移</tspan></text>
<rect x="508" y="107" width="180" height="85" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="598.0" y="142.5" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="598.0" dy="0">胺醇</tspan><tspan x="598.0" dy="28">C–N；C–OH</tspan></text>
<path d="M 598 204 L 598 275" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="580" y="245" font-size="18" fill="#1c2732" text-anchor="end"><tspan x="580" dy="0">羥基質子化</tspan></text>
<rect x="508" y="287" width="180" height="85" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="598.0" y="322.5" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="598.0" dy="0">活化離去基</tspan><tspan x="598.0" dy="28">C–OH₂⁺</tspan></text>
<path d="M 496 329 L 305 329" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="402" y="307" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="402" dy="0">脫水、再去質子</tspan></text>
<rect x="32" y="287" width="261" height="85" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="162.5" y="322.5" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="162.5" dy="0">亞胺 ＋ H₂O</tspan><tspan x="162.5" dy="28">形成 C=N</tspan></text>
<rect x="32" y="414" width="656" height="77" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="50" y="442" font-size="19" fill="#1c2732" text-anchor="start"><tspan x="50" dy="0">加成：C–N 0→1；C–O 2→1</tspan></text>
<text x="50" y="472" font-size="19" fill="#1c2732" text-anchor="start"><tspan x="50" dy="0">脫水：C–N 1→2；C–O 1→0</tspan></text>
<text x="688" y="522" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
