<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">維生素 C：氧化與降解分開看</title>
<desc id="figure-desc">抗壞血酸被氧化成脫氫抗壞血酸後仍可有維生素 C 活性；後續不可逆降解會減少活性。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="480" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">維生素 C：氧化與降解分開看</tspan></text>
<rect x="32" y="137" width="190" height="116" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="127.0" y="188.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="127.0" dy="0">抗壞血酸</tspan><tspan x="127.0" dy="28">提供電子</tspan></text>
<rect x="265" y="137" width="190" height="116" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="188.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">脫氫</tspan><tspan x="360.0" dy="28">抗壞血酸</tspan></text>
<rect x="498" y="137" width="190" height="116" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="593.0" y="188.0" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="593.0" dy="0">不可逆降解</tspan><tspan x="593.0" dy="28">活性減少</tspan></text>
<path d="M 231 195 L 257 195" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 464 195 L 490 195" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="244" y="113" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="244" dy="0">氧化</tspan></text>
<text x="477" y="113" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="477" dy="0">後續降解</tspan></text>
<path d="M 50 285 L 437 285" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 50 273 L 50 285" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 437 273 L 437 285" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="243" y="317" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="243" dy="0">兩者可有維生素 C 活性</tspan></text>
<text x="32" y="364" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">形式氧化半反應</tspan></text>
<text x="32" y="395" font-size="20" fill="#1c2732" text-anchor="start"><tspan x="32" dy="0">抗壞血酸 → 脫氫抗壞血酸 + 2 H⁺ + 2 e⁻</tspan></text>
<text x="32" y="438" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">省略電子受體；酸鹼狀態依 pH。</tspan></text>
<text x="688" y="462" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
