<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">從澱粉到果糖糖漿，分三步看</title>
<desc id="figure-desc">液化使澱粉鏈縮短，糖化釋出葡萄糖，再由葡萄糖異構酶把部分葡萄糖轉成果糖。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="520" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">從澱粉到果糖糖漿，分三步看</tspan></text>
<rect x="32" y="100" width="656" height="114" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<circle cx="62" cy="132" r="20" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="62" y="138" font-size="16" fill="#14665d" text-anchor="middle"><tspan x="62" dy="0">1</tspan></text>
<text x="98" y="139" font-size="22" fill="#14665d" text-anchor="start"><tspan x="98" dy="0">液化</tspan></text>
<text x="98" y="172" font-size="19" fill="#1c2732" text-anchor="start"><tspan x="98" dy="0">α-澱粉酶</tspan></text>
<text x="98" y="199" font-size="16" fill="#53606d" text-anchor="start"><tspan x="98" dy="0">切內部 α-1,4 鍵</tspan></text>
<rect x="32" y="231" width="656" height="114" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<circle cx="62" cy="263" r="20" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="62" y="269" font-size="16" fill="#14665d" text-anchor="middle"><tspan x="62" dy="0">2</tspan></text>
<text x="98" y="270" font-size="22" fill="#14665d" text-anchor="start"><tspan x="98" dy="0">糖化</tspan></text>
<text x="98" y="303" font-size="19" fill="#1c2732" text-anchor="start"><tspan x="98" dy="0">葡萄糖澱粉酶</tspan></text>
<text x="98" y="330" font-size="16" fill="#53606d" text-anchor="start"><tspan x="98" dy="0">普魯蘭酶協助切 α-1,6</tspan></text>
<rect x="32" y="362" width="656" height="114" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<circle cx="62" cy="394" r="20" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="62" y="400" font-size="16" fill="#14665d" text-anchor="middle"><tspan x="62" dy="0">3</tspan></text>
<text x="98" y="401" font-size="22" fill="#14665d" text-anchor="start"><tspan x="98" dy="0">異構化</tspan></text>
<text x="98" y="434" font-size="19" fill="#1c2732" text-anchor="start"><tspan x="98" dy="0">葡萄糖異構酶</tspan></text>
<text x="98" y="461" font-size="16" fill="#53606d" text-anchor="start"><tspan x="98" dy="0">只轉換部分葡萄糖</tspan></text>
<path d="M 365 137 L 390 123 L 415 137 L 440 123 L 465 137 L 490 123" fill="none" stroke="#14665d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 514 132 L 551 132" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 575 137 L 600 123 L 625 137" fill="none" stroke="#14665d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="496" y="185" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="496" dy="0">澱粉 → 短鏈糊精</tspan></text>
<path d="M 363 269 L 388 255 L 413 269" fill="none" stroke="#14665d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 438 264 L 478 264" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<circle cx="515" cy="264" r="18" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="515" y="270" font-size="16" fill="#14665d" text-anchor="middle"><tspan x="515" dy="0">G</tspan></text>
<circle cx="566" cy="264" r="18" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="566" y="270" font-size="16" fill="#14665d" text-anchor="middle"><tspan x="566" dy="0">G</tspan></text>
<circle cx="617" cy="264" r="18" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="617" y="270" font-size="16" fill="#14665d" text-anchor="middle"><tspan x="617" dy="0">G</tspan></text>
<text x="496" y="316" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="496" dy="0">糊精 → 葡萄糖</tspan></text>
<circle cx="398" cy="397" r="21" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="398" y="403" font-size="16" fill="#14665d" text-anchor="middle"><tspan x="398" dy="0">G</tspan></text>
<path d="M 440 391 L 510 391" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 510 414 L 440 414" fill="none" stroke="#6f8fb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<circle cx="552" cy="397" r="21" fill="#ffffff" stroke="#b4692e" stroke-width="2"/>
<text x="552" y="403" font-size="16" fill="#b4692e" text-anchor="middle"><tspan x="552" dy="0">F</tspan></text>
<text x="622" y="403" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="622" dy="0">＋ G</tspan></text>
<text x="496" y="448" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="496" dy="0">G：葡萄糖　F：果糖</tspan></text>
<text x="360" y="498" font-size="19" fill="#53606d" text-anchor="middle"><tspan x="360" dy="0">變稀 ≠ 完成糖化 ≠ 全部變成果糖</tspan></text>
<text x="688" y="502" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
