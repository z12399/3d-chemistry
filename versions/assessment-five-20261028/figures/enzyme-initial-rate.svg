<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 550" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">初速：校正後，取早期線性斜率</title>
<desc id="figure-desc">先以配對空白和校正換成產物濃度，再於混合穩定後的早期線性窗取斜率；後段曲線變彎不納入初速。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="550" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">初速：校正後，取早期線性斜率</tspan></text>
<rect x="32" y="100" width="190" height="70" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="127.0" y="128.0" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="127.0" dy="0">樣品訊號</tspan><tspan x="127.0" dy="28">減配對時間空白</tspan></text>
<rect x="265" y="100" width="190" height="70" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="128.0" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">校正訊號</tspan><tspan x="360.0" dy="28">換成產物濃度</tspan></text>
<rect x="500" y="100" width="188" height="70" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="594.0" y="128.0" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="594.0" dy="0">早期線性窗</tspan><tspan x="594.0" dy="28">斜率＝初速</tspan></text>
<path d="M 226 135 L 257 135" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 459 135 L 492 135" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="50" y="224" font-size="18" fill="#53606d" text-anchor="start"><tspan x="50" dy="0">產物濃度</tspan></text>
<path d="M 80 450 L 80 245" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<path d="M 80 450 L 657 450" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<path d="M 95 431 Q 120 423 145 405 L 330 313 C 420 270 527 258 635 252" fill="none" stroke="#14665d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 145 405 L 330 313" fill="none" stroke="#b4692e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 145 405 L 145 450" fill="none" stroke="#b4692e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
<path d="M 330 313 L 330 450" fill="none" stroke="#b4692e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
<text x="235" y="280" font-size="20" fill="#b4692e" text-anchor="middle"><tspan x="235" dy="0">初速窗：斜率</tspan></text>
<text x="555" y="226" font-size="20" fill="#53606d" text-anchor="middle"><tspan x="555" dy="0">後段彎曲</tspan></text>
<text x="660" y="481" font-size="18" fill="#53606d" text-anchor="end"><tspan x="660" dy="0">時間</tspan></text>
<text x="235" y="485" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="235" dy="0">混合穩定後的早期區段</tspan></text>
<text x="32" y="521" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">曲線為定性；初速窗仍須核對校正與量測線性範圍。</tspan></text>
<text x="688" y="532" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
