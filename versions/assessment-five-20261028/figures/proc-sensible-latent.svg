<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">熱量可用於升溫或相變</title>
<desc id="figure-desc">顯熱改變溫度，潛熱改變相態；純物質在固定壓力的相變過程仍吸熱而溫度近似不變。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="440" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">熱量可用於升溫或相變</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">先分辨過程，再計算各段需要的熱</tspan></text>
<rect x="32" y="111" width="313" height="234" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="188" y="146" font-size="23" fill="#1c2732" text-anchor="middle" font-weight="600"><tspan x="188" dy="0">顯熱</tspan></text>
<rect x="375" y="111" width="313" height="234" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="531" y="146" font-size="23" fill="#1c2732" text-anchor="middle" font-weight="600"><tspan x="531" dy="0">潛熱</tspan></text>
<text x="188" y="190" font-size="22" fill="#14665d" text-anchor="middle"><tspan x="188" dy="0">溫度上升</tspan></text>
<path d="M 82 289 L 82 213" fill="none" stroke="#53606d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 82 289 L 282 289" fill="none" stroke="#53606d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 100 273 L 262 218" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="188" y="327" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="188" dy="0">Q顯＝m cp ΔT</tspan></text>
<rect x="405" y="181" width="100" height="67" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="455.0" y="221.5" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="455.0" dy="0">液態</tspan></text>
<path d="M 519 214 L 553 214" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="566" y="181" width="100" height="67" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/>
<text x="616.0" y="221.5" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="616.0" dy="0">氣態</tspan></text>
<text x="532" y="279" font-size="20" fill="#14665d" text-anchor="middle"><tspan x="532" dy="0">溫度近似不變</tspan></text>
<text x="532" y="327" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="532" dy="0">Q潛＝m相變 λ</tspan></text>
<text x="32" y="385" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">潛熱比較限純物質、固定壓力的相變</tspan><tspan x="32" dy="25">熱量需求還不能直接當作時間或耗電</tspan></text>
<text x="688" y="422" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
