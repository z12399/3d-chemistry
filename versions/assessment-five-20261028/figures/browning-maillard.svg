<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">梅納反應：由羰基與胺基開始</title>
<desc id="figure-desc">還原糖羰基與可反應胺基經加成和脫水形成含氮中間體，再經多條路徑生成褐色色素與香氣。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="450" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">梅納反應：由羰基與胺基開始</tspan></text>
<rect x="32" y="90" width="656" height="48" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="121.0" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">溫度・pH・水活性影響速率</tspan></text>
<rect x="32" y="197" width="190" height="109" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="127.0" y="244.5" font-size="21" fill="#1c2732" text-anchor="middle"><tspan x="127.0" dy="0">還原糖羰基</tspan><tspan x="127.0" dy="28">＋ 可反應胺基</tspan></text>
<path d="M 229 251 L 277 251" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="253" y="177" font-size="18" fill="#14665d" text-anchor="middle"><tspan x="253" dy="0">加成</tspan><tspan x="253" dy="24">脫水</tspan></text>
<rect x="284" y="197" width="190" height="109" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="379.0" y="244.5" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="379.0" dy="0">含氮</tspan><tspan x="379.0" dy="28">中間體</tspan></text>
<path d="M 481 251 L 525 251" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="503" y="181" font-size="18" fill="#14665d" text-anchor="middle"><tspan x="503" dy="0">多條</tspan><tspan x="503" dy="24">路徑</tspan></text>
<rect x="532" y="179" width="156" height="145" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="610.0" y="244.5" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="610.0" dy="0">褐色色素</tspan><tspan x="610.0" dy="28">香氣</tspan></text>
<text x="32" y="373" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">早期已反應，不代表肉眼已看見褐色。</tspan><tspan x="32" dy="25">適當的游離胺基酸也能提供胺基。</tspan></text>
<text x="688" y="432" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
