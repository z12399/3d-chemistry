<text x="286.0" y="140.0" font-size="13" fill="#5b6b70" text-anchor="middle" font-weight="normal">5</text>
<text x="330.0" y="244.0" font-size="13" fill="#5b6b70" text-anchor="middle" font-weight="normal">6</text>
<text x="374.0" y="140.0" font-size="13" fill="#5b6b70" text-anchor="middle" font-weight="normal">7</text>
<text x="418.0" y="244.0" font-size="13" fill="#5b6b70" text-anchor="middle" font-weight="normal">8</text>
<text x="462.0" y="140.0" font-size="13" fill="#5b6b70" text-anchor="middle" font-weight="normal">9</text>
<text x="506.0" y="244.0" font-size="13" fill="#5b6b70" text-anchor="middle" font-weight="normal">10</text>
<text x="518.0" y="216.0" font-size="15" fill="#1f2a2e" text-anchor="start" font-weight="normal">CH₃</text>
<text x="380.0" y="280.0" font-size="14" fill="#11665a" text-anchor="middle" font-weight="normal">醛基在 C1；共軛雙鍵在 C2=C3、C4=C5，兩個都是 E（反式）：鏈的延續方向在雙鍵兩側相反。</text>
<text x="380.0" y="306.0" font-size="14" fill="#5b6b70" text-anchor="middle" font-weight="normal">C6–C10 為五個飽和碳（末端甲基）。總碳數 10、兩個雙鍵、一個醛基 → 分子式 C₁₀H₁₆O。</text>
<text x="380.0" y="350.0" font-size="13" fill="#5b6b70" text-anchor="middle" font-weight="normal">來源：亞麻油酸 9-氫過氧化物的烷氧自由基在 C8–C9 間 β-斷裂，</text>
<text x="380.0" y="372.0" font-size="13" fill="#5b6b70" text-anchor="middle" font-weight="normal">C9 成為醛基碳、原來的 C10=C11 與 C12=C13 變成新醛的 2、4 位雙鍵（見下一張機制圖）。</text>
</g></svg>
