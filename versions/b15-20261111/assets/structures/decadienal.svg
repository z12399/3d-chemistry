<text x="78.0" y="124.0" font-size="18" fill="#1f2a2e" text-anchor="middle" font-weight="normal">O</text>
<text x="84.0" y="184.0" font-size="14" fill="#5b6b70" text-anchor="end" font-weight="normal">H</text>
<text x="110.0" y="140.0" font-size="13" fill="#5b6b70" text-anchor="middle" font-weight="normal">1</text>
<text x="154.0" y="244.0" font-size="13" fill="#5b6b70" text-anchor="middle" font-weight="normal">2</text>
<text x="198.0" y="140.0" font-size="13" fill="#5b6b70" text-anchor="middle" font-weight="normal">3</text>
