<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">同一食品，三種證據回答不同問題</title><desc id="desc">同一食品以感官、生菌數與特定危害三種量測回答不同問題，外觀正常或一般菌數低都不能排除特定危害。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="500" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">同一食品，三種證據回答不同問題</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">腐敗與危害可重疊，也可不重疊</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><rect x="234" y="108" width="252" height="66" rx="14" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/><text x="360" y="149" font-size="19" fill="#14665d" text-anchor="middle" font-weight="700">同一食品或批次</text><path d="M 360 182 L 360 205 L 130 205 L 130 237" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><path d="M 360 205 L 360 237" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><path d="M 360 205 L 590 205 L 590 237" fill="none" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="250" width="205" height="119" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="280" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">感官劣變</text><text x="44" y="309" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">氣味／質地／外觀</text><text x="44" y="334" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">描述品質變化</text><rect x="258" y="250" width="204" height="119" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="274" y="280" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">一般生菌數</text><text x="274" y="309" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">指定方法的指標</text><text x="274" y="334" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">有品質與程序用途</text><rect x="487" y="250" width="205" height="119" rx="14" fill="#ffffff" stroke="#dfe4e8" stroke-width="2"/><text x="503" y="280" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">特定危害</text><text x="503" y="309" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">對應病原或毒素</text><text x="503" y="334" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">需相應檢測證據</text><rect x="28" y="394" width="664" height="61" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="360" y="431" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">外觀正常＋一般菌數低，仍不能排除所有特定危害</text><text x="28" y="480" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">未檢出須限定樣本、方法與檢出能力，不等於整批不存在。</text><text x="692" y="484" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>