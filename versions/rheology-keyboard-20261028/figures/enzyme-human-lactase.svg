<text x="208.0" y="239.5" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="208.0" dy="0">III</tspan></text>
<rect x="247" y="211" width="62" height="43" rx="12" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
