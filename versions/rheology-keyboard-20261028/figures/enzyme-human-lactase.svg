<rect x="501" y="272" width="73" height="43" rx="12" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="537.5" y="300.5" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="537.5" dy="0">IV</tspan></text>
<path d="M578 294L643 294" fill="none" stroke="#14665d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="547" y="348" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="547" dy="0">兩條成熟鏈：同源二聚體</tspan></text>
<path d="M30 371L690 371" fill="none" stroke="#dfe4e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="30" y="412" font-size="20" fill="#14665d" text-anchor="start" font-weight="600"><tspan x="30" dy="0">成熟 LPH 的 IV 區</tspan></text>
<text x="30" y="453" font-size="21" fill="#1c2732" text-anchor="start"><tspan x="30" dy="0">乳糖 ＋ H₂O → D-葡萄糖 ＋ β-D-半乳糖（初生）</tspan></text>
<text x="30" y="520" font-size="17" fill="#53606d" text-anchor="start"><tspan x="30" dy="0">調控變異具有族群與模型範圍；不能單靠基因型判斷個人症狀。</tspan></text>
<text x="688" y="544" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
