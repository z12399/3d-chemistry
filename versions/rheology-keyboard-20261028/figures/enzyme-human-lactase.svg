<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="title">LPH：基因調控、蛋白組裝與催化</title>
<desc id="desc">MCM6 內 enhancer 調控 LCT；兩條含 I–IV 的前驅物各自加工後，以保留 III、IV 的兩條成熟鏈組成二聚體；IV 區催化乳糖水解。</desc>
<defs>
<marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#14665d"/></marker>
<marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53606d"/></marker>
<marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b4692e"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6f8fb5"/></marker>
<marker id="arr-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b8902a"/></marker>
</defs>
<rect width="720" height="560" fill="#ffffff"/>
<text x="30" y="38" font-size="22" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="30" dy="0">LPH：基因調控、蛋白組裝與催化</tspan></text>
<text x="30" y="69" font-size="17" fill="#53606d" text-anchor="start"><tspan x="30" dy="0">I–IV 是一條鏈的區段，不是四條蛋白鏈</tspan></text>
<rect x="30" y="96" width="210" height="66" rx="12" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="135.0" y="122.5" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="135.0" dy="0">MCM6 內</tspan><tspan x="135.0" dy="27">enhancer</tspan></text>
<path d="M255 129L318 129" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/>
<text x="285" y="109" font-size="17" fill="#1c2732" text-anchor="middle"><tspan x="285" dy="0">調控</tspan></text>
<rect x="332" y="96" width="126" height="66" rx="12" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="395.0" y="136.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="395.0" dy="0">LCT</tspan></text>
