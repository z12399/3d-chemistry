<rect x="177" y="272" width="62" height="43" rx="12" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="208.0" y="300.5" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="208.0" dy="0">III</tspan></text>
<rect x="247" y="272" width="62" height="43" rx="12" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="278.0" y="300.5" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="278.0" dy="0">IV</tspan></text>
<text x="173" y="348" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="173" dy="0">兩條前驅物，各自加工</tspan></text>
<path d="M338 261L393 261" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/>
<rect x="420" y="211" width="73" height="43" rx="12" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="456.5" y="239.5" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="456.5" dy="0">III</tspan></text>
<rect x="501" y="211" width="73" height="43" rx="12" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<text x="537.5" y="239.5" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="537.5" dy="0">IV</tspan></text>
