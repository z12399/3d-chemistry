<text x="585" y="145" font-size="24" fill="#1c2732" text-anchor="middle"><tspan x="585" dy="0">C6</tspan></text>
<text x="360" y="211" font-size="20" fill="#53606d" text-anchor="middle"><tspan x="360" dy="0">共用苷元骨架</tspan></text>
<rect x="32" y="250" width="186" height="122" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="125.0" y="290.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="125.0" dy="0">環與接點</tspan><tspan x="125.0" dy="28">開／閉環</tspan><tspan x="125.0" dy="28">B 接 C2／C3</tspan></text>
<rect x="267" y="250" width="186" height="122" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="290.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">鍵與羰基</tspan><tspan x="360.0" dy="28">C2–C3 鍵階</tspan><tspan x="360.0" dy="28">C4 是否有 =O</tspan></text>
<rect x="502" y="250" width="186" height="122" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="595.0" y="304.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="595.0" dy="0">C3 取代</tspan><tspan x="595.0" dy="28">是否有 OH</tspan></text>
<path d="M 125 385 L 125 405 L 595 405 L 595 385" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 360 406 L 360 435" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="360" y="464" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">黃酮／黃酮醇／黃烷酮／異黃酮等</tspan></text>
<text x="32" y="496" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">分類、糖苷、食物含量與人體效果分開判讀。</tspan></text>
