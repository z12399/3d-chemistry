<text x="135" y="145" font-size="24" fill="#1c2732" text-anchor="middle"><tspan x="135" dy="0">C6</tspan></text>
<path d="M 180 137 L 289 137" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="290" y="96" width="140" height="82" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="144.0" font-size="24" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">C3</tspan></text>
<path d="M 431 137 L 540 137" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
