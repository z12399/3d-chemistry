<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">膜的選擇性與驅動力</title>
<desc id="figure-desc">並排顯示超濾保留蛋白質、讓水及較小成分通過，以及逆滲透用有效壓差主要使水通過。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="500" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">膜的選擇性與驅動力</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">不能只用同一個孔徑口訣解釋所有膜程序</tspan></text>
<rect x="32" y="113" width="313" height="275" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="188" y="148" font-size="23" fill="#1c2732" text-anchor="middle" font-weight="600"><tspan x="188" dy="0">超濾</tspan></text>
<rect x="179" y="170" width="18" height="132" rx="3" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<path d="M 151 254 L 228 254" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="375" y="113" width="313" height="275" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="531" y="148" font-size="23" fill="#1c2732" text-anchor="middle" font-weight="600"><tspan x="531" dy="0">逆滲透</tspan></text>
<rect x="522" y="170" width="18" height="132" rx="3" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<path d="M 494 254 L 571 254" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<circle cx="83" cy="207" r="21" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="127" cy="207" r="8" fill="#6f8fb5" stroke="#6f8fb5" stroke-width="2"/>
<circle cx="242" cy="207" r="8" fill="#6f8fb5" stroke="#6f8fb5" stroke-width="2"/>
<text x="97" y="327" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="97" dy="0">蛋白質保留</tspan></text>
<text x="255" y="327" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="255" dy="0">水與小分子</tspan><tspan x="255" dy="25">可通過</tspan></text>
<circle cx="425" cy="207" r="8" fill="#6f8fb5" stroke="#6f8fb5" stroke-width="2"/>
<circle cx="468" cy="207" r="14" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="589" cy="207" r="8" fill="#6f8fb5" stroke="#6f8fb5" stroke-width="2"/>
<text x="531" y="327" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="531" dy="0">主要讓水通過</tspan></text>
<text x="531" y="358" font-size="18" fill="#14665d" text-anchor="middle"><tspan x="531" dy="0">ΔP有效＝ΔP跨膜 − Δπ</tspan></text>
<path d="M 425 173 L 443 173" fill="none" stroke="#6f8fb5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="454" y="179" font-size="17" fill="#6f8fb5" text-anchor="start"><tspan x="454" dy="0">水</tspan></text>
<rect x="96" y="415" width="528" height="47" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="445.5" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">濃差極化、積垢 → 通量可能下降</tspan></text>
<text x="688" y="482" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
