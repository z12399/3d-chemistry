<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="processing-analysis-title processing-analysis-desc">
<title id="processing-analysis-title">近似分析：數字由方法得到</title>
<desc id="processing-analysis-desc">總氮包括蛋白氮與非蛋白氮，經係數換算得粗蛋白；碳水化合物差減法承接其他成分的誤差，不能直接分類糖澱粉纖維。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker></defs>
<rect width="720" height="100%" fill="#ffffff"/>
<g font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" fill="#1c2732" font-size="18">
<text x="32" y="36" font-size="20" fill="#1c2732" text-anchor="start" font-weight="600">近似分析：數字由方法得到</text>
<line x1="32" y1="54" x2="688" y2="54" stroke="#dfe4e8" stroke-width="2"/>
<text x="32" y="93" font-size="20" fill="#14665d" text-anchor="start" font-weight="600">氮分析與換算</text>
<rect x="32" y="116" width="198" height="97" rx="12" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="131.0" y="157.5" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">總氮</text>
<text x="131.0" y="183.5" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">蛋白氮＋非蛋白氮</text>
<line x1="233" y1="165" x2="283" y2="165" stroke="#14665d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="288" y="116" width="152" height="97" rx="12" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="364.0" y="170.5" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">× 換算係數</text>
<line x1="443" y1="165" x2="493" y2="165" stroke="#14665d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="498" y="116" width="190" height="97" rx="12" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="593.0" y="170.5" font-size="18" fill="#1c2732" text-anchor="middle" font-weight="400">粗蛋白估計</text>
<text x="32" y="267" font-size="20" fill="#14665d" text-anchor="start" font-weight="600">差減法</text>
<rect x="32" y="290" width="656" height="94" rx="12" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="360" y="324" font-size="20" fill="#1c2732" text-anchor="middle" font-weight="400">由其他成分扣除 → 碳水化合物估計</text>
<text x="360" y="357" font-size="18" fill="#b4692e" text-anchor="middle" font-weight="400">其他各項的誤差也會進入結果</text>
<rect x="32" y="405" width="656" height="68" rx="12" fill="#e7f1ee" stroke="#e7f1ee" stroke-width="2"/>
<text x="46" y="431" font-size="16" fill="#14665d" text-anchor="start" font-weight="400">粗蛋白換算係數須適合食品與方法。</text>
<text x="46" y="456" font-size="16" fill="#14665d" text-anchor="start" font-weight="400">碳水差減值不直接分出糖、澱粉與纖維。</text>
<text x="680" y="487" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text>
</g>
</svg>