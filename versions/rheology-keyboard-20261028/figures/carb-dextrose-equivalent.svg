<circle cx="217" cy="183" r="13" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="255" cy="183" r="13" fill="#b4692e" stroke="#b4692e" stroke-width="2"/>
<path d="M 453 183 L 461 183" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="440" cy="183" r="13" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="474" cy="183" r="13" fill="#b4692e" stroke="#b4692e" stroke-width="2"/>
