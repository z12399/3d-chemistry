<circle cx="520" cy="183" r="13" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="554" cy="183" r="13" fill="#b4692e" stroke="#b4692e" stroke-width="2"/>
<path d="M 613 183 L 621 183" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="600" cy="183" r="13" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="634" cy="183" r="13" fill="#b4692e" stroke="#b4692e" stroke-width="2"/>
<path d="M 300 183 L 385 183" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="342" y="160" font-size="18" fill="#1c2732" text-anchor="middle"><tspan x="342" dy="0">水解</tspan></text>
<text x="160" y="242" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="160" dy="0">還原端較少</tspan></text>
<text x="545" y="242" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="545" dy="0">還原端較多 → DE 較高</tspan></text>
<circle cx="45" cy="288" r="8" fill="#b4692e" stroke="#b4692e" stroke-width="2"/>
<text x="65" y="295" font-size="18" fill="#53606d" text-anchor="start"><tspan x="65" dy="0">橙色端點：還原端</tspan></text>
<rect x="32" y="320" width="656" height="65" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="359.5" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">DE＝葡萄糖還原當量 ÷ 乾物量 × 100</tspan></text>
<text x="32" y="416" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">相同 DE 仍可能有不同鏈長分布與糖組成。</tspan></text>
<text x="688" y="432" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
