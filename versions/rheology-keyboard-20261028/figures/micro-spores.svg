<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">內生孢子是存活型態</title>
<desc id="figure-desc">一個營養細胞形成一個內生孢子，再萌發為一個營養細胞；後續分裂與型態轉換分開表示。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="450" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">內生孢子是存活型態</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">部分細菌可形成；不是所有細菌都有此能力</tspan></text>
<rect x="66.0" y="180.0" width="78" height="38" rx="19.0" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="360" cy="199" r="28" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="360" cy="199" r="17" fill="#b8902a" stroke="#b8902a" stroke-width="2"/>
<rect x="576.0" y="180.0" width="78" height="38" rx="19.0" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<path d="M 166 199 L 310 199" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="237" y="165" font-size="19" fill="#1c2732" text-anchor="middle"><tspan x="237" dy="0">不利環境</tspan><tspan x="237" dy="27">形成孢子</tspan></text>
<path d="M 410 199 L 554 199" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="482" y="173" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="482" dy="0">萌發</tspan></text>
<text x="105" y="261" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="105" dy="0">1 個</tspan><tspan x="105" dy="28">營養細胞</tspan></text>
<text x="360" y="261" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">1 個內生孢子</tspan><tspan x="360" dy="28">休眠、耐熱耐乾</tspan></text>
<text x="615" y="261" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="615" dy="0">1 個</tspan><tspan x="615" dy="28">營養細胞</tspan></text>
<rect x="72" y="336" width="576" height="66" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="362.0" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">形成與萌發：型態轉換</tspan><tspan x="360.0" dy="28">恢復後再分裂：才是族群增殖</tspan></text>
<text x="688" y="432" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
