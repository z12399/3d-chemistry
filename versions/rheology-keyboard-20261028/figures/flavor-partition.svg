<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">香氣分子在不同相之間分配</tspan></text>
<rect x="32" y="172" width="180" height="158" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="122" y="208" font-size="24" fill="#1c2732" text-anchor="middle"><tspan x="122" dy="0">水相</tspan></text>
