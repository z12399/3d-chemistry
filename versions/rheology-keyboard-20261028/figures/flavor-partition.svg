<text x="598" y="208" font-size="24" fill="#1c2732" text-anchor="middle"><tspan x="598" dy="0">氣相</tspan></text>
<circle cx="551" cy="263" r="8" fill="#b4692e" stroke="#b4692e" stroke-width="2"/>
<circle cx="600" cy="288" r="8" fill="#b4692e" stroke="#b4692e" stroke-width="2"/>
<circle cx="645" cy="254" r="8" fill="#b4692e" stroke="#b4692e" stroke-width="2"/>
<path d="M 220 260 L 262 260" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 262 280 L 220 280" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 458 260 L 500 260" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
