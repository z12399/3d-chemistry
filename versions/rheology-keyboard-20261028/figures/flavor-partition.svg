<text x="360" y="208" font-size="24" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">油相</tspan></text>
<circle cx="313" cy="263" r="8" fill="#b4692e" stroke="#b4692e" stroke-width="2"/>
<circle cx="362" cy="288" r="8" fill="#b4692e" stroke="#b4692e" stroke-width="2"/>
