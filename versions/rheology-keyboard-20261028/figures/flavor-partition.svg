<path d="M 598 162 L 598 116" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="598" y="102" font-size="21" fill="#b4692e" text-anchor="middle"><tspan x="598" dy="0">氣相送達</tspan></text>
<text x="360" y="376" font-size="23" fill="#1c2732" text-anchor="middle"><tspan x="360" dy="0">K氣／液 = C氣 / C液</tspan></text>
<text x="32" y="424" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">氣／液濃度需使用相同單位、相同溫度。</tspan><tspan x="32" dy="25">平衡分配 ≠ 瞬間釋放速率；氣相濃度 ≠ 感知強度。</tspan></text>
