<circle cx="636" cy="215" r="7" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="658" cy="215" r="7" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="592" cy="247" r="7" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="614" cy="247" r="7" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="636" cy="247" r="7" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="658" cy="247" r="7" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<rect x="119" y="316" width="482" height="51" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="348.5" font-size="24" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">N＝N₀ × 2^(t/g)</tspan></text>
<text x="32" y="396" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">課文例：800 經三個代時後為 6400</tspan><tspan x="32" dy="25">遲滯期、穩定期與條件改變時，不可無限外推</tspan></text>
<text x="688" y="422" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
