<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">每一個代時，再乘一次二</title>
<desc id="figure-desc">在固定條件的對數期內，族群每經一個代時倍增；課文 800 個單位經三個代時達 6400 個單位。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="440" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">每一個代時，再乘一次二</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">模型僅適用固定條件的對數期</tspan></text>
<rect x="33" y="135" width="122" height="148" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="94" y="169" font-size="24" fill="#14665d" text-anchor="middle" font-weight="600"><tspan x="94" dy="0">N₀</tspan></text>
<circle cx="94" cy="215" r="7" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<path d="M 166 208 L 199 208" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="182.5" y="126" font-size="18" fill="#14665d" text-anchor="middle"><tspan x="182.5" dy="0">1 代時</tspan></text>
<rect x="210" y="135" width="122" height="148" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="271" y="169" font-size="24" fill="#14665d" text-anchor="middle" font-weight="600"><tspan x="271" dy="0">2N₀</tspan></text>
<circle cx="260" cy="215" r="7" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="282" cy="215" r="7" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<path d="M 343 208 L 376 208" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="359.5" y="126" font-size="18" fill="#14665d" text-anchor="middle"><tspan x="359.5" dy="0">1 代時</tspan></text>
<rect x="387" y="135" width="122" height="148" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="448" y="169" font-size="24" fill="#14665d" text-anchor="middle" font-weight="600"><tspan x="448" dy="0">4N₀</tspan></text>
<circle cx="415" cy="215" r="7" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="437" cy="215" r="7" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="459" cy="215" r="7" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<circle cx="481" cy="215" r="7" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
<path d="M 520 208 L 553 208" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="536.5" y="126" font-size="18" fill="#14665d" text-anchor="middle"><tspan x="536.5" dy="0">1 代時</tspan></text>
<rect x="564" y="135" width="122" height="148" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/>
<text x="625" y="169" font-size="24" fill="#14665d" text-anchor="middle" font-weight="600"><tspan x="625" dy="0">8N₀</tspan></text>
<circle cx="592" cy="215" r="7" fill="#e7f1ee" stroke="#14665d" stroke-width="2"/>
