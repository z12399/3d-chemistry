<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif">
<title id="title">產酵素的酵母，不是發酵 starter</title><desc id="desc">產酵素的 K. lactis 與接種 starter 角色分開，乳糖酶水解乳糖生成葡萄糖和半乳糖，糖與菌數端點各別判讀。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14665d"/></marker></defs>
<rect x="0" y="0" width="720" height="530" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="28" y="36" font-size="20" fill="#14665d" text-anchor="start" font-weight="700">產酵素的酵母，不是發酵 starter</text><text x="28" y="64" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">水解改變糖組成；各菌株反應需要各自量測</text><line x1="28" y1="80" x2="692" y2="80" stroke="#dfe4e8" stroke-width="2"/><rect x="28" y="109" width="252" height="93" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="139" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">K. lactis 酵母</text><text x="44" y="168" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">製造商所列產酵素來源</text><line x1="290" y1="154" x2="349" y2="154" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><text x="319" y="128" font-size="16" fill="#14665d" text-anchor="middle" font-weight="400">產製</text><rect x="363" y="109" width="329" height="93" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/><text x="379" y="139" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">乳糖酶／β-galactosidase</text><text x="379" y="168" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">催化乳糖 β(1→4) 鍵水解</text><line x1="527" y1="210" x2="527" y2="238" stroke="#14665d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="249" width="664" height="76" rx="14" fill="#ffffff" stroke="#14665d" stroke-width="2"/><text x="360" y="294" font-size="20" fill="#14665d" text-anchor="middle" font-weight="700">乳糖＋H₂O → D-葡萄糖＋D-半乳糖</text><rect x="28" y="358" width="312" height="93" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="44" y="388" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">糖量端點</text><text x="44" y="417" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">前後：指發酵前後</text><text x="44" y="442" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">名義 100% 組不等於乳糖為零</text><rect x="380" y="358" width="312" height="93" rx="14" fill="#f6f7f8" stroke="#dfe4e8" stroke-width="2"/><text x="396" y="388" font-size="18" fill="#14665d" text-anchor="start" font-weight="700">指定 starter 的 CFU</text><text x="396" y="417" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">兩菌株分別看</text><text x="396" y="442" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">菌數不等於生長率或產酸通量</text><text x="28" y="498" font-size="16" fill="#53606d" text-anchor="start" font-weight="400">水解淨反應不代表成品實測量；原糖表沒有半乳糖數值。</text><text x="692" y="514" font-size="16" fill="#53606d" text-anchor="end" font-weight="400">示意圖</text></svg>