<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="figure-title figure-desc" font-family="'Segoe UI','Microsoft JhengHei UI','Microsoft JhengHei',sans-serif" font-size="20">
<title id="figure-title">降低能障，不改變平衡</title>
<desc id="figure-desc">兩條定性反應途徑具有相同的起點與終點；酵素途徑的能障較低，平衡常數不變。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#14665d"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53606d"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4692e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8fb5"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8902a"/></marker>
</defs>
<rect x="0" y="0" width="720" height="520" fill="#ffffff"/>
<text x="32" y="42" font-size="26" fill="#1c2732" text-anchor="start" font-weight="600"><tspan x="32" dy="0">降低能障，不改變平衡</tspan></text>
<text x="32" y="74" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">定性示例：以較低能量的產物為例</tspan></text>
<path d="M 94 369 L 94 115" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<path d="M 94 369 L 663 369" fill="none" stroke="#53606d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<text x="35" y="118" font-size="18" fill="#53606d" text-anchor="start"><tspan x="35" dy="0">自由能</tspan></text>
<text x="570" y="399" font-size="18" fill="#53606d" text-anchor="start"><tspan x="570" dy="0">反應進程</tspan></text>
<path d="M 125 306 C 210 306 234 133 336 133 C 451 133 479 336 620 336" fill="none" stroke="#b4692e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 125 306 C 212 306 263 227 336 227 C 422 227 502 336 620 336" fill="none" stroke="#14665d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 130 306 L 359 306" fill="none" stroke="#dfe4e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
<path d="M 253 302 L 253 158" fill="none" stroke="#b4692e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="196" y="182" font-size="18" fill="#b4692e" text-anchor="middle"><tspan x="196" dy="0">較高</tspan><tspan x="196" dy="24">能障</tspan></text>
<path d="M 375 302 L 375 238" fill="none" stroke="#14665d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 375 310 L 375 319" fill="none" stroke="#14665d" stroke-width="2" stroke-linecap="round"/>
<text x="375" y="344" font-size="18" fill="#14665d" text-anchor="middle"><tspan x="375" dy="0">酵素降低能障</tspan></text>
<text x="150" y="341" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="150" dy="0">反應物</tspan></text>
<text x="620" y="360" font-size="20" fill="#1c2732" text-anchor="middle"><tspan x="620" dy="0">產物</tspan></text>
<path d="M 448 122 L 478 122" fill="none" stroke="#b4692e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="490" y="129" font-size="18" fill="#b4692e" text-anchor="start"><tspan x="490" dy="0">未催化途徑</tspan></text>
<path d="M 448 155 L 478 155" fill="none" stroke="#14665d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="490" y="162" font-size="18" fill="#14665d" text-anchor="start"><tspan x="490" dy="0">酵素途徑</tspan></text>
<rect x="63" y="421" width="594" height="45" rx="14" fill="#e7f1ee" stroke="#dfe4e8" stroke-width="2"/>
<text x="360.0" y="450.5" font-size="22" fill="#1c2732" text-anchor="middle"><tspan x="360.0" dy="0">同條件下，平衡常數 K 與 ΔG° 不變</tspan></text>
<text x="32" y="494" font-size="18" fill="#53606d" text-anchor="start"><tspan x="32" dy="0">ΔG 描述方向傾向；ΔG‡ 關係到跨越能障的快慢。</tspan></text>
<text x="688" y="502" font-size="16" fill="#53606d" text-anchor="end"><tspan x="688" dy="0">示意圖</tspan></text>
</svg>
